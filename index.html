    try { navigator.clipboard.writeText(readyCode).then(() => toast("Skopiowano kod ✓ Wklej go na drugim urządzeniu."), fallback); } catch (e) { fallback(); }
  };
  const sh = $("#codesh"); if (sh) sh.onclick = () => { if (!readyCode) { toast("Chwilka, przygotowuję kod… stuknij jeszcze raz."); return; } navigator.share({ title: "Kod postępów – japoński", text: readyCode }).catch(() => { }); };
  $("#codeld").onclick = async () => {
    try { const o = await readProgressCode($("#codein").value); if (!o.lessons) throw 0; if (!confirm("Zastąpić postępy na tym urządzeniu postępami z kodu?")) return; S = o; loadStateFix(); saveState(); toast("Wczytano postępy ✓"); route(); }
    catch (x) { toast("Ten kod nie wygląda na kod postępów."); }
  };
  $("#rst").onclick = () => { if (confirm("Na pewno usunąć wszystkie postępy?")) { localStorage.removeItem(STORE); loadState(); saveState(); toast("Wyzerowano."); go("/"); } };
}
async function progressCode() {
  const json = JSON.stringify(S);
  const b64 = bytes => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
  if (window.CompressionStream) {
    const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
    return "JPZ1:" + b64(new Uint8Array(buf));
  }
  return "JPJ1:" + b64(new TextEncoder().encode(json));
}
async function readProgressCode(code) {
  code = code.trim().replace(/\s+/g, "");
  const bytes = Uint8Array.from(atob(code.slice(5)), c => c.charCodeAt(0));
  if (code.startsWith("JPZ1:")) return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  if (code.startsWith("JPJ1:")) return JSON.parse(new TextDecoder().decode(bytes));
  return JSON.parse(code);
}
function loadStateFix() { const raw = JSON.stringify(S); localStorage.setItem(STORE, raw); loadState(); }
function applyTheme() { const t = S.settings.theme; if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }

/* ===================== start ===================== */
loadState(); applyTheme(); TTS.init();
document.addEventListener("voices", () => { const h = location.hash; if ((!h || h === "#/") && $("#app .hero")) { if (!!$("#app .hero .warnbox") !== (TTS.ready && !TTS.voices.length)) route(); } else if (h.startsWith("#/settings") && !$("#voice") && TTS.voices.length) route(); });
// drugie okno / powrót do aplikacji: wczytaj świeże postępy, żeby nie nadpisać ich starą kopią
window.addEventListener("storage", e => { if (e.key === STORE) { loadState(); applyTheme(); if (!document.querySelector(".quiz")) route(); } });
// japońskie znaki oznaczone jako japońskie (na Androidzie bez tego kanji mogą wyglądać po chińsku)
const JPSEL = ".jp,ruby,.jpl,.fjp,.jpline,.qq,.opt,.tile,.mbtn,table.voc .w,.sr .w,.kc .k,.kc .rd,.kcell .ch,.subs .sj,.sline .who,.actor .nm,.trace .gh,.hanko,.lvl .big,.bigjp".split(",").map(s => s + ":not([lang])").join(",");
const tagJa = () => document.querySelectorAll(JPSEL).forEach(e => e.lang = "ja");
new MutationObserver(tagJa).observe(document.body, { childList: true, subtree: true }); tagJa();
route();

async function playChars(btn) {
  const l = LESSONS[location.hash.split("/")[2]]; if (!l || !l.chars) return;
  if (btn.dataset.on) { btn.dataset.stop = 1; TTS.stop(); return; }
  btn.dataset.on = 1; delete btn.dataset.stop; btn.textContent = "⏹ Zatrzymaj";
  const cards = $$("[data-ch]");
  for (let i = 0; i < l.chars.length && !btn.dataset.stop && document.body.contains(btn); i++) {
    cards.forEach(c => c.style.outline = ""); cards[i].style.outline = "3px solid var(--accent)"; cards[i].scrollIntoView({ block: "nearest", behavior: "smooth" });
    const c = l.chars[i][0], sp = c === "を" || c === "ヲ" ? "お" : c;
    await TTS.speak(sp, { queue: true }); await sleep(1300);
  }
  cards.forEach(c => c.style.outline = ""); delete btn.dataset.on; btn.textContent = "▶ Posłuchaj wszystkich znaków po kolei";
}

/* ===================== ściąga gramatyczna ===================== */
function viewCheat(id) {
  const L = LV.find(x => x.id === id) || LV.find(x => x.lessons.some(l => l.grammar && l.grammar.length));
  const lv = LV.filter(x => x.lessons.some(l => l.grammar && l.grammar.length));
  app().innerHTML = `<div class="crumbs"><a href="#/">Start</a> › <a href="#/level/${L.id}">${esc(L.short)}</a> › Ściąga</div>
    <h1>📋 Ściąga gramatyczna</h1>
    <div class="tabs">${lv.map(x => `<a class="tab ${x === L ? "on" : ""}" href="#/sciaga/${x.id}">${esc(x.short)}</a>`).join("")}</div>
    <p class="small muted">Wszystkie konstrukcje z poziomu w jednym miejscu: wzór, przykład i link do lekcji. Dobre do powtórki przed testem.</p>
    ${L.lessons.filter(l => l.grammar && l.grammar.length).map(l => `<div class="card" style="margin-bottom:12px;--c:${L.color}"><h3 style="margin-top:0"><a href="#/lesson/${l.id}/learn">Lekcja ${l._n}: ${esc(l.title)}</a></h3>
      <table class="voc">${l.grammar.map(g => { const e = (g.examples || [])[0]; return `<tr><td style="width:38%"><b>${ruby(esc(g.title))}</b>${g.pattern ? `<div class="small jp muted">${ruby(esc(g.pattern))}</div>` : ""}</td>
        <td>${e ? `<div class="jp" style="font-size:17px;line-height:2">${ruby(e[0])} ${sayBtn(e[0])}</div><div class="small muted">${esc(e[1])}</div>` : ""}</td></tr>`; }).join("")}</table></div>`).join("")}`;
}

/* ===================== synchronizacja przez konto (wersja online na claude.ai) =====================
   W wersji online strona może mieć bazę danych przypisaną do zalogowanej osoby. Wtedy postępy zapisują się
   na koncie i są takie same na telefonie i komputerze. W pliku offline window.claude nie istnieje i nic się nie dzieje. */
const CHUNK = 180000;
window.CloudSync = {
  db: null, base: "", busy: false, again: false, timer: 0, state: "off", last: 0,
  async init() {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]).catch(() => [null, null]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    this.db = db; this.base = "data/users/" + id + "/";
    try {
      const meta = await db.doc(this.base + "meta").get();
      const m = meta.exists ? meta.data() : null;
      if (m && m.t > (S.t || 0)) {
        let json = "";
        for (let i = 0; i < m.n; i++) { const d = await db.doc(this.base + "p" + i).get(); json += d.exists ? d.data().s : ""; }
        const o = JSON.parse(json);
        if (o && o.lessons) { S = o; localStorage.setItem(STORE, json); loadState(); applyTheme(); route(); toast("☁️ Wczytano postępy z Twojego konta"); }
      } else if (!m || m.t < (S.t || 0)) this.push(true);
      this.state = "on"; this.last = m ? m.t : 0;
    } catch (e) { this.state = "err"; }
    if (location.hash.startsWith("#/settings")) route();
  },
  push(now) {
    if (!this.db) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.write(), now ? 0 : 2500);
  },
  async write() {
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try {
      const json = JSON.stringify(S), n = Math.ceil(json.length / CHUNK) || 1;
      for (let i = 0; i < n; i++) await this.db.doc(this.base + "p" + i).set({ s: json.slice(i * CHUNK, (i + 1) * CHUNK) });
      await this.db.doc(this.base + "meta").set({ n, t: S.t || Date.now() });
      this.state = "on"; this.last = S.t;
    } catch (e) { this.state = "err"; }
    this.busy = false;
    if (this.again) { this.again = false; this.write(); }
  }
};
CloudSync.init();

</script>
