  grammar: [
    { title: "尊敬語 – specjalne czasowniki wywyższające",
      pattern: "いる/行く/来る → いらっしゃる ・ 食べる/飲む → 召し上がる ・ 言う → おっしゃる ・ 見る → ご覧になる ・ する → なさる ・ 知っている → ご存じだ",
      explain: "Gdy mówisz o czynnościach klienta, szefa czy starszej osoby, zastępujesz zwykły czasownik specjalnym czasownikiem 尊敬語. Uwaga na formę ます: いらっしゃる → いらっしゃいます, おっしゃる → おっしゃいます, なさる → なさいます, くださる → くださいます (r wypada!).<br>Typowy błąd: ×私はいらっしゃいます – o sobie nigdy nie używasz 尊敬語.",
      examples: [
        ["{社長|しゃちょう}は{今|いま}、{会議室|かいぎしつ}にいらっしゃいます。","Prezes jest teraz w sali konferencyjnej."],
        ["どうぞ、{温|あたた}かいうちに{召|め}し{上|あ}がってください。","Proszę jeść, póki ciepłe."],
        ["{先生|せんせい}がおっしゃったとおりに{書|か}きました。","Napisałem tak, jak powiedział pan profesor."],
        ["この{資料|しりょう}、もうご{覧|らん}になりましたか。","Czy widział pan już te materiały?"],
        ["{週末|しゅうまつ}は{何|なに}をなさいますか。","Co pan robi w weekend?"]
      ] },
    { title: "尊敬語 – お～になる, ～られる, お～ください",
      pattern: "お + V-ます(temat) + になる ・ V-bierna (～られる) ・ お + V-ます(temat) + ください",
      explain: "Gdy czasownik nie ma specjalnej formy, używasz wzoru <b>お～になる</b>: 帰る → お帰りになる, 待つ → お待ちになる. Dla słów chińskiego pochodzenia: ご～になる (ご利用になる).<br>Lżejsza wersja: forma <b>bierna</b> w znaczeniu grzecznościowym: 部長は何時に帰られますか. Jest częsta w biurze i w newsach, ale słabsza niż お～になる.<br>Prośby: <b>お～ください</b> (お待ちください, お掛けください, ご利用ください) – grzeczniejsze niż ～てください.<br>Uwaga: お～になる nie działa dla czasowników z jedną sylabą tematu (×お見になる, ×おいになる) – tam są specjalne czasowniki.",
      examples: [
        ["{部長|ぶちょう}はもうお{帰|かえ}りになりました。","Kierownik już wyszedł do domu."],
        ["{社長|しゃちょう}は{毎朝|まいあさ}{新聞|しんぶん}を{読|よ}まれます。","Prezes co rano czyta gazetę."],
        ["こちらにお{掛|か}けになってお{待|ま}ちください。","Proszę usiąść tutaj i chwilę zaczekać."],
        ["このカードは{全国|ぜんこく}のコンビニでご{利用|りよう}になれます。","Z tej karty można korzystać w sklepach convenience w całym kraju."]
      ] },
    { title: "謙譲語 – specjalne czasowniki uniżające",
      pattern: "行く/来る → 参る ・ いる → おる ・ 言う → 申す ・ 見る → 拝見する ・ 聞く/訪ねる → 伺う ・ もらう/食べる → いただく ・ 知っている → 存じている ・ する → いたす",
      explain: "O <b>własnych</b> czynnościach (i swojej firmy) wobec klienta lub przełożonego mówisz skromnie. Przedstawiając się: ポーランドから参りました、アンナと申します.<br>Rozróżniaj pary: いらっしゃいます (on jest – 尊敬語) ↔ おります (ja jestem – 謙譲語); おっしゃる ↔ 申す; ご覧になる ↔ 拝見する.<br>Uwaga: 伺う znaczy zarówno „zapytać”, jak i „odwiedzić”: 明日御社に伺います / ちょっと伺いたいことがあるんですが.",
      examples: [
        ["はじめまして。ポーランドから{参|まい}りました、マレクと{申|もう}します。","Dzień dobry, nazywam się Marek, przyjechałem z Polski."],
        ["{明日|あした}の{午後|ごご}、{御社|おんしゃ}に{伺|うかが}います。","Jutro po południu odwiedzę państwa firmę."],
        ["{資料|しりょう}を{拝見|はいけん}しました。","Zapoznałem się z materiałami."],
        ["{私|わたし}は{毎日|まいにち}{八時|はちじ}まで{会社|かいしゃ}におります。","Codziennie jestem w biurze do ósmej."],
        ["お{名前|なまえ}はよく{存|ぞん}じております。","Bardzo dobrze znam pańskie nazwisko."]
      ] },
    { title: "謙譲語 – お～する / ご～する",
      pattern: "お + V-ます(temat) + する / いたす ・ ご + N(漢語) + する / いたす",
      explain: "Gdy robisz coś <b>dla</b> rozmówcy lub w związku z nim, używasz お～する: 持つ → お持ちします (ponieść za kogoś), 送る → お送りします. Słowa chińskie: ご～する: ご案内します, ご説明します, ご連絡します. Jeszcze grzeczniej: お～いたします.<br>Typowy błąd: mieszanie wzorów. お～になる = czynność <b>rozmówcy</b>, お～する = <b>moja</b> czynność dla rozmówcy. ×お客様がお待ちしています → お客様がお待ちになっています.<br>Nie używaj お～する do czynności, które nikogo nie dotyczą (×お寝します).",

  grammar: [
    { title: "～ように – żeby (cel poza naszą kontrolą)",
      pattern: "V-słownikowa (niewolicjonalna / potencjalna) / V-ない + ように",
      explain: "～ように wyraża cel, który jest <b>stanem lub wynikiem</b>, a nie bezpośrednią czynnością: żeby było słychać, żeby móc, żeby nie zapomnieć. Przed ように stoją zwykle: czasowniki niezależne od woli (見える, 聞こえる, 治る), formy potencjalne (話せる, 読める) i przeczenia (～ないように).<br>Podmioty obu części mogą być <b>różne</b>: 子どもにも分かるように、簡単に説明する.<br>Na końcu zdania ～ように（祈る） wyraża życzenie: 早く治りますように – „oby szybko wyzdrowiał”.",
      examples: [
        ["{後|うし}ろの{人|ひと}にも{聞|き}こえるように、{大|おお}きい{声|こえ}で{話|はな}してください。","Proszę mówić głośno, żeby było słychać również z tyłu."],
        ["{忘|わす}れないように、{手帳|てちょう}にメモしておきます。","Zapiszę to w kalendarzu, żeby nie zapomnieć."],
        ["{日本語|にほんご}のニュースが{分|わ}かるように、{毎日|まいにち}{聞|き}いています。","Słucham codziennie wiadomości po japońsku, żeby je rozumieć."],
        ["{風邪|かぜ}をひかないように、{暖|あたた}かくして{寝|ね}てください。","Proszę ciepło się ubrać do snu, żeby się nie przeziębić."],
        ["{早|はや}く{元気|げんき}になりますように。","Oby pan szybko wrócił do zdrowia."]
      ] },
    { title: "～ために – żeby, w celu (świadomy cel)",
      pattern: "V-słownikowa (wolicjonalna) + ために ・ N + のために",
      explain: "～ために wyraża <b>świadomy cel</b>, do którego dążę własnym działaniem. Przed ために stoi czasownik <b>wolicjonalny</b> w formie słownikowej (痩せる ma tu sens „chcę schudnąć”), a podmiot obu części jest <b>ten sam</b>. Z rzeczownikiem: 健康のために – „dla zdrowia”, 家族のために – „dla rodziny”.<br>Porównaj: 痩せるために、毎日走っている (cel: schudnąć – świadomy plan) ↔ 痩せられるように、毎日走っている (żeby móc schudnąć – forma potencjalna wymaga ように).<br>Typowy błąd: ×聞こえるために – 聞こえる nie zależy od woli, więc tylko ように.",
      examples: [
        ["{健康|けんこう}のために、{毎朝|まいあさ}{三十分|さんじゅっぷん}{歩|ある}いています。","Dla zdrowia codziennie rano chodzę pół godziny."],
        ["{痩|や}せるために、{甘|あま}い{物|もの}を{控|ひか}えています。","Żeby schudnąć, ograniczam słodycze."],
        ["{医者|いしゃ}になるために、{大学|だいがく}で{勉強|べんきょう}しています。","Studiuję, żeby zostać lekarzem."],
        ["{家族|かぞく}のために、{家|いえ}を{買|か}いました。","Kupiłem dom dla rodziny."]

    { title: "～ようになる – zacząć (umieć, robić); zmiana",
      pattern: "V-słownikowa / V-potencjalna + ようになる ・ V-ない → V-なくなる",
      explain: "～ようになる opisuje <b>stopniową zmianę</b> stanu, zdolności lub nawyku: „w końcu zacząłem…”. Bardzo często z formą potencjalną: 泳げるようになった – „nauczyłem się pływać”.<br>Odwrotną zmianę (przestać) wyraża się zwykle przez <b>～なくなる</b>: 眠れなくなった – „przestałem móc spać”, お酒を飲まなくなった – „przestałem pić”.<br>Porównaj z ～になる po rzeczowniku/przymiotniku: 元気になった (wyzdrowiał). Dla czasowników zawsze potrzebne jest ようになる – ×飲むになった.",
      examples: [
        ["{日本|にほん}に{来|き}て、{納豆|なっとう}が{食|た}べられるようになりました。","Po przyjeździe do Japonii zacząłem jeść nattō (dałem radę je polubić)."],

        ["{娘|むすめ}は{三歳|さんさい}で{自転車|じてんしゃ}に{乗|の}れるようになった。","Córka nauczyła się jeździć na rowerze w wieku trzech lat."]

  grammar: [
    { title: "～そうだ (podobno) – informacja z drugiej ręki",
      pattern: "forma zwykła (V / い-adj / な-adj+だ / N+だ) + そうだ ・ źródło: ～によると",
      explain: "～そうだ po <b>pełnej formie zwykłej</b> znaczy „podobno, słyszałem, że” – przekazujesz informację z konkretnego źródła, nie dodając własnej oceny. Źródło podajesz przez ～によると / ～では: 天気予報によると、明日は雨が降るそうです.<br>Nie myl z ～そうだ „wygląda na”, które dołącza się do <b>tematu</b>: 雨が降りそうだ (zanosi się na deszcz) ↔ 雨が降るそうだ (podobno będzie padać); おいしそうだ (wygląda smacznie) ↔ おいしいそうだ (podobno jest smaczne).<br>Ta そうだ nie ma formy przeszłej ani przeczącej: ×降るそうだった, ×降るそうではない.",
      examples: [

    { title: "～らしい – wygląda na to (z tego, co słyszę); typowy dla",

      examples: [

        ["{山田|やまだ}さんは{会社|かいしゃ}を{辞|や}めるらしいですよ。","Podobno pan Yamada odchodzi z firmy."],

        ["{今日|きょう}は{暖|あたた}かくて、{春|はる}らしい{一日|いちにち}でした。","Dziś było ciepło – typowo wiosenny dzień."],
        ["{遅刻|ちこく}するなんて、{彼|かれ}らしくないね。","Spóźnić się? To do niego niepodobne."]

    { title: "～ようだ / ～みたいだ – wnioskuję z tego, co widzę",

    { title: "～はずだ / ～はずがない – logicznie powinno być",

  grammar: [
    { title: "～ところだ – zaraz / właśnie teraz / przed chwilą",
      pattern: "V-słownikowa + ところだ ・ V-ている + ところだ ・ V-た + ところだ",
      explain: "ところ (dosł. „miejsce”) wskazuje <b>punkt na osi czasu</b> czynności:<br><b>V-る ところだ</b> – właśnie mam zamiar, zaraz (今から出かけるところです);<br><b>V-ている ところだ</b> – właśnie jestem w trakcie (今、調べているところです);<br><b>V-た ところだ</b> – dopiero co skończyłem, przed chwilą (今、着いたところです).<br>Często z 今, ちょうど, これから. Uwaga: ～ところだ mówi o <b>chwili obecnej</b> – nie użyjesz go o rzeczy sprzed tygodnia (×先週着いたところです).",
      examples: [

        ["ちょうど{空港|くうこう}に{着|つ}いたところです。","Dopiero co dotarłem na lotnisko."],
        ["{電話|でんわ}しようと{思|おも}っていたところでした。","Właśnie miałem zamiar zadzwonić."]
      ] },
    { title: "～たばかり – dopiero co (subiektywnie świeże)",
      pattern: "V-た + ばかりだ / ばかりの + N",
      explain: "～たばかり znaczy „dopiero co” i wyraża <b>odczucie mówiącego</b>, że minęło mało czasu – obiektywnie mogą to być minuty, ale i miesiące: 日本に来たばかりです (przyjechałem niedawno – np. miesiąc temu).<br>Różnica z ～たところ: たところ to dokładnie ten moment (przed chwilą), たばかり – „niedawno, wciąż świeże”. Można powiedzieć 先月結婚したばかり, ale nie ×先月結婚したところ.<br>Często z wyrzutem lub zdziwieniem: 買ったばかりなのに、もう壊れた. Może określać rzeczownik: 焼いたばかりのパン (świeżo upieczony chleb).",
      examples: [
        ["{先月|せんげつ}{日本|にほん}に{来|き}たばかりなので、まだ{分|わ}からないことが{多|おお}いです。","Przyjechałem do Japonii dopiero w zeszłym miesiącu, więc wielu rzeczy jeszcze nie rozumiem."],
        ["{買|か}ったばかりの{靴|くつ}なのに、もう{汚|よご}れてしまった。","To dopiero co kupione buty, a już się pobrudziły."],

        ["{焼|や}いたばかりのパンはおいしいですね。","Świeżo upieczony chleb jest pyszny."]

    { title: "～ながら – robiąc jednocześnie",
      pattern: "V-ます(temat) + ながら",
      explain: "～ながら łączy dwie czynności wykonywane <b>jednocześnie przez tę samą osobę</b>. Czynność <b>główna</b> stoi na końcu zdania, poboczna – przed ながら: 音楽を聞きながら勉強する (główne: uczę się, w tle muzyka).<br>Podmiot musi być ten sam – ×私はテレビを見ながら、母は料理した (tu użyj 間).<br>Rozszerzone znaczenie: <b>～ながら</b> o stanie trwającym długo – 働きながら大学に通う (studiować, pracując). Z przymiotnikami/stanami ～ながら(も) znaczy „mimo że” (残念ながら – niestety), ale to już wyższy poziom.",
      examples: [

        ["{彼|かれ}は「さようなら」も{言|い}わないまま、{国|くに}へ{帰|かえ}ってしまった。","Wyjechał do swojego kraju, nawet się nie pożegnawszy."]

  grammar: [
    { title: "～てしまう / ～ちゃう – całkiem, niestety, niechcący",
      pattern: "V-て + しまう ・ potocznie: ～てしまう → ～ちゃう, ～でしまう → ～じゃう",
      explain: "～てしまう ma dwa znaczenia:<br>1) <b>dokończenie</b> – zrobić coś całkowicie, do końca: 宿題を全部やってしまった;<br>2) <b>żal, coś niezamierzonego</b> – „niestety, niechcący”: 財布を落としてしまった, 寝坊してしまった.<br>W mowie potocznej skraca się: 食べてしまった → 食べちゃった, 飲んでしまった → 飲んじゃった, 忘れてしまう → 忘れちゃう.<br>Uwaga: w grzecznych sytuacjach (szef, klient) używaj pełnej formy ～てしまいました – ～ちゃいました brzmi zbyt swobodnie.",

    { title: "Czasowniki przechodnie i nieprzechodnie (他動詞・自動詞)",
      pattern: "[ktoś] が [rzecz] を 開ける ・ [rzecz] が 開く",
      explain: "Wiele czasowników występuje w parach: <b>przechodni</b> (他動詞) – ktoś działa na coś, dopełnienie z <b>を</b>; <b>nieprzechodni</b> (自動詞) – coś dzieje się samo, podmiot z <b>が</b>.<br>Częste wzory: -eru (przech.) / -aru (nieprzech.): 閉める/閉まる, 始める/始まる, 決める/決まる; -su / -reru: 壊す/壊れる, 汚す/汚れる; -eru / -u: 開ける/開く, 並べる/並ぶ; -su / -eru: 消す/消える.<br>Japończyk, gdy coś się zepsuło, chętniej powie 壊れた (zepsuło się) niż 壊した (zepsułem) – przyznanie się to świadomy wybór. Typowy błąd: ×ドアを開いてください (lepiej 開けて), ×会議を始まります (会議が始まります / 会議を始めます).",
      examples: [
        ["{窓|まど}を{開|あ}けてもいいですか。","Czy mogę otworzyć okno?"],
        ["{風|かぜ}でドアが{開|あ}きました。","Drzwi otworzyły się od wiatru."],

        ["パソコンが{急|きゅう}に{壊|こわ}れました。","Komputer nagle się zepsuł."],
        ["{弟|おとうと}が{私|わたし}のパソコンを{壊|こわ}しました。","Brat zepsuł mój komputer."]

    { title: "～てある vs ～ている – stan zamierzony a stan po prostu",
      pattern: "[rzecz] が V-przechodni-て + ある ・ [rzecz] が V-nieprzechodni-て + いる",
      explain: "<b>～てある</b> (z czasownikiem <b>przechodnim</b>) – ktoś <b>celowo</b> coś zrobił i rzecz pozostaje w tym stanie, często w jakimś celu: 窓が開けてある (ktoś otworzył okno – np. żeby przewietrzyć).<br><b>～ている</b> (z czasownikiem <b>nieprzechodnim</b>) – po prostu opisuje stan, bez informacji, czy ktoś to zrobił: 窓が開いている (okno jest otwarte).<br>Porównaj: 電気が消えている (światło jest zgaszone) ↔ 電気が消してある (ktoś zgasił, np. żeby oszczędzać).<br>Pamiętaj: ～ている z czasownikiem przechodnim (窓を開けている) opisuje czynność w toku – „ktoś właśnie otwiera okno”.",
      examples: [

    { title: "～ことにする / ～ことにしている – sam decyduję",
      pattern: "V-słownikowa / V-ない + ことにする ・ ～ことにしている",
      explain: "<b>～ことにする</b> wyraża <b>własną decyzję</b> mówiącego: 来年留学することにしました – „zdecydowałem, że w przyszłym roku wyjadę na studia”.<br><b>～ことにしている</b> – reguła, której się trzymasz z wyboru: 毎朝ジョギングすることにしている („mam zasadę, że codziennie rano biegam”). Jest mocniejsze i bardziej stanowcze niż ～ようにしている (staram się).<br>Przeczenie: ～ないことにする (postanowić, że nie).",

  intro: "W tej lekcji zebraliśmy konstrukcje, które pozwalają mówić o <b>przyczynach i skutkach</b> – nie tylko neutralnie (から, ので), ale z emocjonalnym zabarwieniem. Japoński odróżnia przyczynę, za którą jesteśmy wdzięczni (<b>おかげで</b>), od tej, którą obwiniamy (<b>せいで</b>), i ustępstwo neutralne (<b>ても</b> – „nawet jeśli”) od pełnego pretensji (<b>のに</b> – „a przecież”). Do tego przydatne łączniki: によって, について, とか i ばかり. Tematyka: społeczeństwo, środowisko, wiadomości.",

  grammar: [
    { title: "～ても – nawet jeśli / chociaż",
      pattern: "V-て + も ・ い-adj: ～くても ・ な-adj / N: ～でも ・ (たとえ) ～ても ・ どんなに / いくら ～ても",
      explain: "～ても wyraża <b>ustępstwo</b>: „nawet jeśli X, to i tak Y” – wynik nie zależy od warunku. Może dotyczyć hipotezy (明日雨が降っても行きます) albo faktu (薬を飲んでも治らない).<br>Wzmocnienia: <b>たとえ～ても</b> (nawet gdyby), <b>どんなに / いくら～ても</b> (choćby nie wiem jak): いくら頑張っても、うまくいかない.<br>Z pytajnikami: 何を食べても (cokolwiek), 誰が来ても (ktokolwiek).<br>Porównaj z ～たら: 雨が降ったら行かない (jeśli spadnie deszcz, nie pójdę) ↔ 雨が降っても行く (nawet jeśli spadnie, pójdę).",
      examples: [
        ["{明日|あした}{雨|あめ}が{降|ふ}っても、{試合|しあい}は{中止|ちゅうし}になりません。","Nawet jeśli jutro będzie padać, mecz nie zostanie odwołany."],
        ["いくら{練習|れんしゅう}しても、{上手|じょうず}になりません。","Choćbym nie wiem ile ćwiczył, nie robię postępów."],
        ["{高|たか}くても、{環境|かんきょう}にいい{製品|せいひん}を{選|えら}びたいです。","Nawet jeśli będzie drogi, chcę wybrać produkt przyjazny środowisku."],
        ["たとえ{反対|はんたい}されても、{自分|じぶん}の{意見|いけん}を{言|い}うつもりです。","Nawet gdyby się sprzeciwiali, zamierzam wyrazić swoje zdanie."]
      ] },
    { title: "～のに – a przecież, mimo że (rozczarowanie)",
      pattern: "forma zwykła + のに (N / な-adj: ～なのに)",
      explain: "～のに również znaczy „chociaż”, ale niesie <b>emocję</b>: zaskoczenie, rozczarowanie, pretensję – stało się inaczej, niż należało oczekiwać: 一生懸命勉強したのに、落ちた („a przecież tak się uczyłem!”).<br>Różnice:<br>～のに dotyczy <b>faktów</b> (nie hipotez), ～ても może dotyczyć hipotezy;<br>po ～のに nie może stać <b>wola, prośba ani rozkaz</b>: ×雨なのに行きましょう → 雨でも行きましょう.<br>Na końcu zdania ～のに wyraża żal: もっと早く言ってくれればよかったのに („szkoda, że nie powiedziałeś wcześniej”).",
      examples: [
        ["{一生懸命|いっしょうけんめい}{勉強|べんきょう}したのに、{試験|しけん}に{落|お}ちてしまった。","Tak się starałem, a i tak oblałem egzamin."],
        ["{約束|やくそく}したのに、{彼|かれ}は{来|こ}なかった。","Obiecał, a przecież nie przyszedł."],
        ["{日曜日|にちようび}なのに、{会社|かいしゃ}に{行|い}かなければならない。","Jest niedziela, a muszę iść do pracy."],
        ["{言|い}ってくれれば{手伝|てつだ}ったのに。","Gdybyś powiedział, pomógłbym ci (szkoda, że nie powiedziałeś)."]
      ] },
    { title: "～ため(に) – z powodu (formalnie)",
      pattern: "forma zwykła + ため(に) ・ N + の + ため(に) ・ な-adj + な + ため",
      explain: "Poza celem (lekcja 5) ～ため(に) wyraża <b>przyczynę</b> – w stylu oficjalnym: komunikaty, wiadomości, pisma, ogłoszenia. Znaczy to samo co ので / から, ale brzmi formalnie: 事故のため、電車が遅れています.<br>Jak rozpoznać? Cel: czasownik wolicjonalny w formie słownikowej + skutek zamierzony (合格するために勉強する). Przyczyna: forma przeszła, stan, czasownik niewolicjonalny albo zdarzenie (雪が降ったため、休校になった).<br>Po ため (przyczyna) zwykle nie stoi prośba ani wola mówiącego.",
      examples: [

        ["{少子化|しょうしか}のため、{地方|ちほう}の{学校|がっこう}が{減|へ}っています。","Z powodu spadku liczby urodzeń ubywa szkół na prowincji."],
        ["{工事中|こうじちゅう}のため、この{道|みち}は{通|とお}れません。","Z powodu robót drogowych ta droga jest zamknięta."]

    { title: "～おかげで / ～せいで – dzięki / przez",
      pattern: "forma zwykła + おかげで / せいで ・ N + の + おかげで / せいで",
      explain: "Oba wyrażają przyczynę, ale z przeciwną emocją:<br><b>おかげで</b> – „dzięki” – przyczyna pozytywna, wdzięczność: 先生のおかげで合格できました. Utarte: おかげさまで („dzięki Bogu / dzięki wam”).<br><b>せいで</b> – „przez, z winy” – przyczyna negatywna, obwinianie: 彼のせいで遅れた. Przyznając się: 私のせいです („to moja wina”).<br>Ironia: おかげで o złym skutku brzmi sarkastycznie: 君が寝坊したおかげで、電車に乗り遅れたよ („dzięki tobie spóźniliśmy się”).<br>Typowy błąd: ×雨のおかげで試合が中止になった (chyba że ironicznie) – tu 雨のせいで.",

  grammar: [
    { title: "～ものの – co prawda…, ale",
      pattern: "forma zwykła + ものの (な-przym. + な / である, rzecz. + である)",
      explain: "Przyznajesz fakt A, ale wynik B jest inny, niż można by oczekiwać. Brzmi pisemnie i rzeczowo, bez pretensji (w przeciwieństwie do のに). Część B to zwykle stwierdzenie stanu – <b>nie</b> stoi po nim prośba, rozkaz ani wola (<i>～ものの、来てください</i> ✗). Typowe: <i>買ったものの</i>, <i>始めたものの</i>, <i>とは言うものの</i>.",
      examples: [
        ["{対策|たいさく}は{発表|はっぴょう}されたものの、{具体的|ぐたいてき}な{予算|よさん}はまだ{決|き}まっていない。","Środki zaradcze ogłoszono, ale konkretnego budżetu jeszcze nie ustalono."],
        ["{太陽光|たいようこう}パネルを{付|つ}けたものの、{思|おも}ったほど{電気代|でんきだい}は{下|さ}がらなかった。","Zamontowałem panele słoneczne, ale rachunki za prąd spadły mniej, niż myślałem."],
        ["{分別|ぶんべつ}のルールは{知|し}っているものの、{実際|じっさい}に{守|まも}るのは{面倒|めんどう}だ。","Zasady segregacji znam, ale w praktyce ich przestrzeganie jest uciążliwe."]
      ] },
    { title: "～にもかかわらず – pomimo",
      pattern: "forma zwykła / rzecz. + にもかかわらず (な-przym./rzecz. + である opcjonalnie)",
      explain: "Formalne „pomimo (że)”. Typowe dla wiadomości, raportów i przemówień. Wyraża zaskoczenie lub krytykę, ale bezosobowo. Może łączyć się bezpośrednio z rzeczownikiem: <i>雨にもかかわらず</i>. W przeciwieństwie do ものの, po にもかかわらず może stać podziękowanie: <i>お忙しいにもかかわらず、ありがとうございます</i>.",
      examples: [
        ["{政府|せいふ}の{努力|どりょく}にもかかわらず、{二酸化炭素|にさんかたんそ}の{排出量|はいしゅつりょう}は{増|ふ}え{続|つづ}けている。","Pomimo wysiłków rządu emisja CO₂ nadal rośnie."],
        ["{悪天候|あくてんこう}にもかかわらず、{多|おお}くの{人|ひと}がデモに{参加|さんか}した。","Pomimo złej pogody wiele osób wzięło udział w demonstracji."],
        ["お{忙|いそが}しいにもかかわらず、お{越|こ}しいただきありがとうございます。","Dziękujemy, że przybyli Państwo, mimo natłoku zajęć."]
      ] },
    { title: "～くせに – a jeszcze…! (z pretensją)",
      pattern: "forma zwykła + くせに (な-przym. + な, rzecz. + の)",
      explain: "Potoczne „mimo że” z wyraźną <b>krytyką lub pogardą wobec osoby</b>. Podmiot A i B jest ten sam (zwykle ktoś inny niż mówiący). Nie używaj wobec przełożonych ani w piśmie. Porównaj z のに: のに wyraża też żal z powodu sytuacji (<i>雨なのに</i>), くせに zawsze ocenia człowieka. Często na końcu zdania jako wyrzut: <i>知ってるくせに！</i> – „przecież wiesz!”.",
      examples: [

        ["{環境|かんきょう}が{大事|だいじ}だと{言|い}うくせに、{車|くるま}で{近|ちか}くのコンビニに{行|い}く。","Mówi, że środowisko jest ważne, a do pobliskiego sklepu jeździ autem."],
        ["{子|こ}どものくせに、{生意気|なまいき}なことを{言|い}うな。","Jesteś dzieckiem, a mówisz takie bezczelne rzeczy!"]

    { title: "～ながらも – choć, mimo że (ten sam podmiot)",
      pattern: "V-ます-temat / い-przym. / な-przym. / rzecz. + ながら(も)",
      explain: "Znasz ながら jako „jednocześnie”. Ze stanami (<i>知りながら</i>, <i>狭いながらも</i>, <i>残念ながら</i>) znaczy „choć”. Podmiot obu części jest ten sam. Brzmi pisemnie, często pozytywnie lub z dystansem, bez pretensji. Utarte: <i>小さいながらも</i> (choć małe), <i>少しずつながらも</i> (powoli, ale jednak).",

      examples: [

  intro: "Japońskie gazety i referaty rzadko używają samego について czy で. Zamiast tego pojawiają się złożone partykuły z czasowników: <b>に関して</b>, <b>に対して</b>, <b>をめぐって</b>, <b>にとって</b>, <b>において</b>, <b>をはじめ</b>, <b>に基づいて</b>, <b>を中心に</b>.<br>Każda ma swoją „specjalność”. Najczęstsze pułapki na JLPT: <b>に対して</b> (wobec kogoś) vs <b>にとって</b> (z czyjegoś punktu widzenia) oraz <b>に関して</b> (temat) vs <b>をめぐって</b> (temat sporu).<br>Wszystkie mają formy przydawkowe przed rzeczownikiem: <i>に関する</i>, <i>に対する</i>, <i>をめぐる</i>, <i>における</i>, <i>に基づく</i>.",

  grammar: [
    { title: "～に関して / ～に関する – dotyczący, w sprawie",
      pattern: "rzecz. + に関して(は/も) / に関する + rzecz.",
      explain: "Formalny odpowiednik について: „w sprawie, odnośnie”. Brzmi sztywniej i pojawia się w ogłoszeniach, e-mailach i referatach. <i>について</i> jest neutralne i częstsze w mowie. Przed rzeczownikiem: <b>に関する</b> (<i>環境に関する調査</i>); w piśmie także <b>に関しての</b>. Zwróć uwagę: に関して wskazuje <b>temat</b>, nic nie mówi o konflikcie.",
      examples: [
        ["この{件|けん}に{関|かん}しては、{後日|ごじつ}{改|あらた}めてご{連絡|れんらく}いたします。","W tej sprawie skontaktujemy się ponownie w późniejszym terminie."],
        ["{若者|わかもの}の{政治|せいじ}への{関心|かんしん}に{関|かん}する{調査|ちょうさ}が{行|おこな}われた。","Przeprowadzono badanie dotyczące zainteresowania młodych polityką."],
        ["{税金|ぜいきん}に{関|かん}して{質問|しつもん}がある{方|かた}は、{窓口|まどぐち}へどうぞ。","Osoby z pytaniami dotyczącymi podatków zapraszamy do okienka."]
      ] },
    { title: "～に対して – wobec; w przeciwieństwie do",
      pattern: "rzecz. + に対して / に対する + rzecz.; forma zwykła + の + に対して",
      explain: "Dwa znaczenia. (1) <b>Kierunek działania lub emocji</b> wobec kogoś/czegoś: <i>客に対して失礼だ</i>, <i>政府に対する不満</i>. (2) <b>Kontrast</b> dwóch faktów: <i>兄は背が高いのに対して、弟は低い</i>. Częsty błąd: mylić z <b>にとって</b>. Test: に対して = ktoś <i>robi coś w stronę</i> X; にとって = X <i>ocenia</i> („dla X to jest…”). <i>私にとって大切だ</i> ✓, <i>私に対して大切だ</i> ✗.",
      examples: [
        ["{政府|せいふ}の{対応|たいおう}に{対|たい}して、{多|おお}くの{市民|しみん}が{不満|ふまん}を{持|も}っている。","Wielu obywateli jest niezadowolonych z reakcji rządu."],
        ["{お客様|おきゃくさま}に{対|たい}して、そんな{態度|たいど}を{取|と}ってはいけない。","Nie wolno zachowywać się tak wobec klientów."],
        ["{都市部|としぶ}の{人口|じんこう}が{増|ふ}えているのに{対|たい}して、{地方|ちほう}は{減|へ}り{続|つづ}けている。","Podczas gdy ludność miast rośnie, na prowincji ciągle spada."]
      ] },
    { title: "～にとって – dla (z punktu widzenia)",
      pattern: "rzecz. (osoba, grupa) + にとって(は/も/の)",
      explain: "Ocena z czyjejś perspektywy: „dla mnie, dla firmy, dla młodych”. Po にとって stoi zwykle ocena: <i>大切だ, 難しい, 問題だ, 必要だ</i>. Nie stoi po nim działanie wobec kogoś (wtedy に対して) ani zwykły odbiorca prezentu (wtedy に / のために): <i>母にとってプレゼントを買った</i> ✗ → <i>母にプレゼントを買った</i> ✓.",
      examples: [

    { title: "～ばかりか / ～のみならず – nie tylko…, ale nawet",

  grammar: [
    { title: "～ざるを得ない – nie mam wyjścia, muszę",
      pattern: "V-ない-temat + ざるを得ない (する → せざるを得ない)",
      explain: "„Nie mogę nie…” – okoliczności zmuszają mnie do czegoś, czego <b>nie chcę</b>. Słychać niechęć i rezygnację. Styl pisany lub formalny (zebrania, wiadomości). Uwaga na formę: <i>行かざる</i>, <i>食べざる</i>, ale <b>せざる</b> (od する) i <i>来ざる（こざる）</i>. Różnica z <b>しかない</b>: ざるを得ない akcentuje przymus z zewnątrz i niechęć, しかない – brak innych opcji, bardziej potocznie.",
      examples: [
        ["{赤字|あかじ}が{続|つづ}いているので、{工場|こうじょう}を{閉鎖|へいさ}せざるを{得|え}ない。","Deficyt się utrzymuje, więc nie mamy wyjścia – musimy zamknąć fabrykę."],
        ["{台風|たいふう}が{近|ちか}づいているため、イベントは{中止|ちゅうし}せざるを{得|え}ません。","Ze względu na zbliżający się tajfun musimy odwołać wydarzenie."],
        ["{上司|じょうし}の{命令|めいれい}なら、{従|したが}わざるを{得|え}ない。","Jeśli to polecenie szefa, muszę się podporządkować."]
      ] },
    { title: "～ずにはいられない – nie mogę się powstrzymać",
      pattern: "V-ない-temat + ずにはいられない (する → せずにはいられない)",
      explain: "Emocja lub odruch są silniejsze ode mnie: „nie mogę nie…”. Dotyczy uczuć, reakcji, ciekawości – nie obowiązków. Porównaj: <i>泣かざるを得ない</i> ✗ (nikt nie zmusza do płaczu), <i>泣かずにはいられない</i> ✓. Potoczny odpowiednik: <i>～ないではいられない</i>, a jeszcze swobodniej: <i>つい～てしまう</i>.",
      examples: [
        ["あのニュースを{見|み}て、{怒|いか}りを{感|かん}じずにはいられなかった。","Oglądając te wiadomości, nie mogłem nie poczuć gniewu."],
        ["{困|こま}っている{人|ひと}を{見|み}ると、{声|こえ}をかけずにはいられない。","Gdy widzę kogoś w kłopocie, nie mogę go nie zagadnąć."],
        ["{彼|かれ}の{努力|どりょく}には{感心|かんしん}せずにはいられない。","Nie sposób nie podziwiać jego wysiłku."]
      ] },
    { title: "～しかない i ～わけにはいかない (przypomnienie)",
      pattern: "V (słownik.) + しかない / ほかない · V + わけにはいかない",
      explain: "<b>しかない</b> – „nie pozostaje nic innego, jak…”: wszystkie inne opcje odpadły. Neutralne, często w mowie. Formalny wariant: <b>～ほかない</b> / <b>～よりほかない</b>. <b>わけにはいかない</b> (lekcja 1) mówi odwrotnie – czego <i>nie mogę</i> zrobić z powodu norm. Często stoją razem: <i>途中でやめるわけにはいかない。最後までやるしかない</i>.",
      examples: [
        ["{終電|しゅうでん}が{行|い}ってしまったから、タクシーで{帰|かえ}るしかない。","Ostatni pociąg odjechał, więc nie pozostaje nic innego, jak wrócić taksówką."],
        ["{引|ひ}き{受|う}けた{以上|いじょう}、{途中|とちゅう}でやめるわけにはいかない。やるしかない。","Skoro się podjąłem, nie mogę przerwać w połowie. Trzeba to zrobić."],
        ["{原因|げんいん}が{分|わ}からない{以上|いじょう}、{様子|ようす}を{見|み}るほかない。","Dopóki nie znamy przyczyny, pozostaje tylko obserwować sytuację."]
      ] },
    { title: "～からには / ～以上(は) – skoro już…, to",
      pattern: "forma zwykła + からには / 以上(は) (rzecz. + である)",
      explain: "Skoro zaistniała sytuacja A (decyzja, rola, fakt), to B jest logiczną konsekwencją: obowiązek, determinacja, wniosek. B to zwykle <i>～なければならない, ～べきだ, ～つもりだ, ～てください, ～はずだ</i>. <b>からには</b> brzmi bardziej osobiście i z determinacją (<i>やるからには一番を目指す</i>). <b>以上は</b> jest bardziej logiczne, chłodne, częste w zasadach i umowach (<i>契約した以上、守る義務がある</i>). Różnica z ～から: zwykłe から tylko podaje przyczynę, nie wyraża „skoro tak, to musi”.",
      examples: [
        ["{試合|しあい}に{出|で}るからには、{優勝|ゆうしょう}を{目指|めざ}したい。","Skoro już startuję w zawodach, chcę walczyć o zwycięstwo."],
        ["{日本|にほん}で{働|はたら}くからには、{日本|にほん}のビジネスマナーを{知|し}っておくべきだ。","Skoro pracujesz w Japonii, powinieneś znać japońską etykietę biznesową."],
        ["{契約書|けいやくしょ}にサインした{以上|いじょう}、{条件|じょうけん}は{守|まも}ってもらいます。","Skoro podpisał pan umowę, musi pan przestrzegać warunków."],
        ["{学生|がくせい}である{以上|いじょう}、{勉強|べんきょう}が{第一|だいいち}だ。","Skoro jesteś studentem, nauka jest na pierwszym miejscu."]
      ] },
    { title: "～上で – po (zrobieniu); przy, w kwestii",
      pattern: "V-ta + 上で / rzecz. + の上で · V (słownik.) + 上で(の/は)",
      explain: "(1) <b>V-た上で</b> – „najpierw A, a dopiero na tej podstawie B”: <i>確認した上で</i>, <i>相談の上で</i>. Bardziej formalne i staranne niż ～てから; sugeruje, że A to warunek B. (2) <b>V-る上で</b> – „przy robieniu, w kwestii”: <i>仕事をする上で大切なこと</i> – co ważne w pracy. Uwaga: <i>V-た上で</i> ≠ <i>V-た上に</i> (lekcja 5: „a do tego”).",
      examples: [
        ["{家族|かぞく}とよく{相談|そうだん}した{上|うえ}で、{転職|てんしょく}を{決|き}めました。","Postanowiłem zmienić pracę po dokładnym omówieniu tego z rodziną."],
        ["{内容|ないよう}をご{確認|かくにん}の{上|うえ}、サインをお{願|ねが}いします。","Proszę podpisać po zapoznaniu się z treścią."],
        ["{海外|かいがい}で{働|はたら}く{上|うえ}で、{一番|いちばん}{大切|たいせつ}なのは{柔軟性|じゅうなんせい}だと{思|おも}う。","Myślę, że w pracy za granicą najważniejsza jest elastyczność."]
      ] },
    { title: "Porównanie: skąd bierze się przymus?",
      pattern: "なければならない / ざるを得ない / しかない / ずにはいられない",
      explain: "<b>なければならない</b> – obowiązek ogólny, neutralny (prawo, zasady). <b>ざるを得ない</b> – sytuacja zmusza, robię wbrew sobie (pisane). <b>しかない</b> – nie ma innej opcji (mowa). <b>ずにはいられない</b> – emocja/odruch, nie obowiązek. Typowy błąd: używać ざるを得ない do uczuć (<i>笑わざるを得ない</i> ma sens tylko jako „muszę się śmiać, bo wypada”) albo ずにはいられない do obowiązków.",
      examples: [
        ["{税金|ぜいきん}は{払|はら}わなければならない。","Podatki trzeba płacić (obowiązek ogólny)."],
        ["{予算|よさん}が{足|た}りないので、{計画|けいかく}を{縮小|しゅくしょう}せざるを{得|え}ない。","Brakuje budżetu, więc wbrew woli musimy ograniczyć plan."],
        ["あまりにおかしくて、{笑|わら}わずにはいられなかった。","To było tak zabawne, że nie mogłem się powstrzymać od śmiechu."]

  intro: "<b>もの</b> (rzecz) i <b>こと</b> (sprawa) to nie tylko rzeczowniki. Na końcu zdania stają się narzędziem oceny:<br><b>もの</b> wiąże się z <i>naturą rzeczy</i> i uczuciem: „tak już jest” (<i>～ものだ</i>), „kiedyś tak robiłem” (<i>～たものだ</i>), „jakże bym chciał” (<i>～たいものだ</i>), „za nic!” (<i>～ものか</i>), „gdyby tylko się dało” (<i>～ものなら</i>).<br><b>こと</b> wiąże się z <i>konkretną sytuacją</i> i osądem mówiącego: „najlepiej zrób…” (<i>～ことだ</i>), „nie ma potrzeby” (<i>～ことはない</i>), „ku mojemu zdziwieniu” (<i>～ことに</i>).<br>Klucz do JLPT: <b>ものだ</b> = ogólna prawda / norma społeczna, <b>ことだ</b> = rada dla konkretnej osoby.",

  grammar: [
    { title: "～ものだ – tak już jest / tak się powinno",
      pattern: "forma zwykła (czas teraźniejszy) + ものだ (mowa: もんだ)",
      explain: "(1) <b>Ogólna prawda, natura rzeczy</b>: <i>人は変わるものだ</i> – ludzie się zmieniają (tak już jest). (2) <b>Norma społeczna, „tak wypada”</b>: <i>目上の人には敬語を使うものだ</i>. Przeczenie normy: <b>～ものではない</b> – „tak się nie robi”. Różnica z <b>べきだ</b>: べきだ to osobiste przekonanie mówiącego, ものだ powołuje się na ogólnie przyjęty zwyczaj. Różnica z <b>ことだ</b> – patrz punkt 4.",
      examples: [
        ["{時間|じかん}が{経|た}つのは{早|はや}いものだ。","Czas płynie szybko – tak już jest."],
        ["{新入社員|しんにゅうしゃいん}は{先輩|せんぱい}より{早|はや}く{来|く}るものだと{言|い}われた。","Powiedziano mi, że nowy pracownik przychodzi wcześniej niż starsi koledzy (tak się przyjęło)."],
        ["{人|ひと}の{悪口|わるぐち}を{言|い}うものではない。","Nie obgaduje się ludzi (tak się nie robi)."]
      ] },
    { title: "～たものだ / ～たいものだ – wspomnienie i pragnienie",
      pattern: "V-ta + ものだ · V-tai + ものだ",
      explain: "<b>V-たものだ</b> – nostalgiczne wspomnienie <b>powtarzającej się</b> czynności z przeszłości: „kiedyś to się…”. Nie używaj do jednorazowego zdarzenia (<i>去年一度京都へ行ったものだ</i> ✗). Często z <i>よく</i>, <i>昔は</i>, <i>子どものころ</i>. <b>V-たいものだ</b> / <b>V-てほしいものだ</b> – głębokie, refleksyjne pragnienie: „jakże bym chciał…”, często o rzeczach trudnych do osiągnięcia. Brzmi dojrzalej niż samo ～たい.",
      examples: [
        ["{若|わか}いころは、{先輩|せんぱい}と{朝|あさ}まで{飲|の}んだものだ。","Za młodu piło się ze starszymi kolegami do rana."],
        ["{子|こ}どものころ、この{川|かわ}でよく{泳|およ}いだものです。","W dzieciństwie często pływało się w tej rzece."],
        ["{一度|いちど}でいいから、オーロラを{見|み}てみたいものだ。","Choć raz w życiu chciałbym zobaczyć zorzę polarną."],
        ["{政治家|せいじか}にはもっと{国民|こくみん}の{声|こえ}を{聞|き}いてほしいものだ。","Jakże bym chciał, żeby politycy bardziej słuchali obywateli."]
      ] },
    { title: "～ものか – za nic! w życiu!",
      pattern: "forma zwykła + ものか / もんか (grzecznie: ものですか)",
      explain: "Retoryczne, stanowcze zaprzeczenie z emocją: „Miałbym to zrobić? W życiu!”. Mimo pytajnika znaczy „nie”. Mowa potoczna, często <b>もんか</b> (męskie) lub <b>もんですか</b> (kobiece, uprzejmiej). Różnica z <b>わけがない</b>: ものか wyraża <i>moją wolę</i> lub mocne uczucie (<i>二度と行くものか</i> – nigdy więcej nie pójdę!), わけがない ocenia <i>możliwość</i> (<i>彼が来るわけがない</i>).",
      examples: [
        ["あんな{店|みせ}、{二度|にど}と{行|い}くものか。","Do takiej knajpy? Nigdy więcej!"],
        ["こんな{難|むずか}しい{問題|もんだい}、{一日|いちにち}で{解|と}けるもんか。","Taki trudny problem w jeden dzień? Gdzie tam!"],
        ["{負|ま}けるものか。{最後|さいご}まで{頑張|がんば}るぞ。","Nie dam się pokonać! Walczę do końca!"]

    { title: "～ことだ / ～ことはない – rada",
      pattern: "V (słownik. / ない) + ことだ · V (słownik.) + ことはない",
      explain: "<b>～ことだ</b> – konkretna rada dla konkretnej osoby: „najlepiej (zrób)…”, „powinieneś”. Mówi ją ktoś starszy lub wyższy rangą; wobec szefa brzmi protekcjonalnie. <b>～ことはない</b> – „nie ma potrzeby, nie musisz” (pocieszenie): <i>心配することはない</i>. <b>ものだ vs ことだ</b>: <i>若いうちは苦労するものだ</i> – w młodości człowiek się męczy (ogólna prawda), <i>若いうちに苦労することだ</i> – póki jesteś młody, trudź się (rada). Różnica z <b>わけではない</b>: ことはない = „nie trzeba”, わけではない = „nie jest tak, że”.",
      examples: [
        ["{日本語|にほんご}が{上達|じょうたつ}したければ、{毎日|まいにち}{少|すこ}しずつでも{話|はな}すことだ。","Jeśli chcesz robić postępy w japońskim, najlepiej mów codziennie, choćby trochę."],

    { title: "～ことに – ku (mojemu) zdziwieniu",

        ["{残念|ざんねん}なことに、{今年|ことし}の{夏祭|なつまつ}りは{中止|ちゅうし}になった。","Niestety tegoroczny letni festyn odwołano."],

    { title: "～ものなら – gdyby tylko się dało / niech no tylko",

  intro: "Na N2 pojawiają się teksty „z prawdziwego życia”: e-maile firmowe i krótkie artykuły. Oba mają stałe schematy – kto je zna, czyta dwa razy szybciej.<br><b>E-mail służbowy</b>: powitanie (<i>お世話になっております</i>), przedstawienie się, „poduszka” przed prośbą (<i>恐れ入りますが</i>, <i>お手数ですが</i>), prośba stopniowana grzecznością (<i>～ていただけますでしょうか</i>), zakończenie (<i>よろしくお願いいたします</i>).<br><b>Artykuł</b>: styl <b>である</b>, na początku najważniejszy fakt (kto, co, kiedy), potem tło i źródło (<i>～によると</i>), a na końcu prognoza (<i>～見通しだ</i>, <i>～とみられる</i>).",

  grammar: [
    { title: "Otwarcie i „poduszki” w e-mailu",
      pattern: "お世話になっております。○○の△△です。 / 恐れ入りますが・お手数ですが・お忙しいところ恐縮ですが + prośba",
      explain: "Każdy e-mail do kontrahenta zaczyna się od <b>お世話になっております</b> („dziękujemy za stałą współpracę” – formuła, nie dosłowne podziękowanie), potem nazwa firmy i nazwisko. Przed prośbą stawia się <b>クッション言葉</b> (słowa-poduszki): <i>恐れ入りますが</i> (uniżenie), <i>お手数ですが</i> (przepraszam za fatygę), <i>お忙しいところ恐縮ですが</i> (wiem, że jest Pan zajęty). Typowy błąd obcokrajowców: pisać prośbę „wprost” – bez poduszki brzmi to jak żądanie. Na końcu: <b>何卒よろしくお願いいたします</b>.",
      examples: [
        ["いつもお{世話|せわ}になっております。ABC{商事|しょうじ}の{田中|たなか}です。","Dziękuję za stałą współpracę. Tu Tanaka z firmy ABC Shōji."],
        ["{恐|おそ}れ{入|い}りますが、{添付|てんぷ}の{資料|しりょう}をご{確認|かくにん}ください。","Uprzejmie proszę o zapoznanie się z załączonymi materiałami."],
        ["お{忙|いそが}しいところ{恐縮|きょうしゅく}ですが、{金曜日|きんようび}までにご{返信|へんしん}いただけますと{幸|さいわ}いです。","Przepraszam, że niepokoję w natłoku zajęć, byłbym wdzięczny za odpowiedź do piątku."]
      ] },
    { title: "～させていただきます – pozwolę sobie…",
      pattern: "V-causative-te + いただきます (五段: 休ませて, する: させて)",
      explain: "Dosłownie „otrzymuję pozwolenie, by…”. Pokornie zapowiadasz własne działanie, które <b>dotyczy rozmówcy</b> lub wymaga jego zgody: <i>説明させていただきます</i>, <i>欠席させていただきます</i>. Uwaga: nadużywanie (np. <i>私は田中と申させていただきます</i>) brzmi sztucznie – jeśli działanie nie dotyczy odbiorcy, wystarczy <i>いたします</i>. Częsty błąd w formie: <b>読ませて</b> (nie <i>読まさせて</i> – to tzw. さ入れ言葉, uważane za błąd).",
      examples: [
        ["{本日|ほんじつ}は{体調不良|たいちょうふりょう}のため、{休|やす}ませていただきます。","Z powodu złego samopoczucia pozwolę sobie dziś wziąć wolne."],
        ["それでは、{新商品|しんしょうひん}についてご{説明|せつめい}させていただきます。","Pozwolę sobie zatem przedstawić nowy produkt."],
        ["{誠|まこと}に{勝手|かって}ながら、{八月十三日|はちがつじゅうさんにち}から{十五日|じゅうごにち}まで{休業|きゅうぎょう}させていただきます。","Uprzejmie informujemy, że od 13 do 15 sierpnia firma będzie nieczynna."]
      ] },
    { title: "Drabina próśb: ～てください → ～いただけますでしょうか",
      pattern: "～てください < ～ていただけますか < ～ていただけませんか < ～ていただけますでしょうか / ～ていただけないでしょうか",
      explain: "Im dłuższa i bardziej „pytająca” forma, tym grzeczniej. <b>～てください</b> to w biznesie polecenie (do klienta nie!). <b>～ていただけますか</b> – uprzejmie. <b>～ていただけませんか</b> – uprzejmiej (przeczenie daje rozmówcy „wyjście”). <b>～ていただけますでしょうか</b> / <b>～ていただけないでしょうか</b> – najwyższy standard e-maili. Z rzeczownikami sino-japońskimi: <i>ご検討いただけますでしょうか</i>. W piśmie także: <i>～いただけますと幸いです</i> („byłbym wdzięczny”). Formalnie でしょうか po ます bywa krytykowane jako podwójne keigo, ale w praktyce jest powszechne i akceptowane.",
      examples: [
        ["{恐|おそ}れ{入|い}りますが、お{見積|みつ}もりを{送|おく}っていただけますでしょうか。","Uprzejmie proszę o przesłanie wyceny."],
        ["{納期|のうき}を{一週間|いっしゅうかん}{延|の}ばしていただけないでしょうか。","Czy byłoby możliwe przesunięcie terminu dostawy o tydzień?"],
        ["{打|う}ち{合|あ}わせの{日程|にってい}をご{調整|ちょうせい}いただけますと{幸|さいわ}いです。","Bylibyśmy wdzięczni za ustalenie terminu spotkania."]
      ] },
    { title: "Styl pisany である",
      pattern: "だ → である, ～ではない, ～であった, ～であろう, ～ており, ～ず",
      explain: "Artykuły, raporty i prace naukowe używają stylu <b>である</b> zamiast だ / です. Charakterystyczne cechy: <i>～であり、</i> (zamiast ～で), <i>～ており、</i> (zamiast ～ていて), <i>～ず、</i> (zamiast ～なくて), <i>～であろう</i> (zamiast ～だろう), formy ciągłe zakończone na ます-temat (<i>増加し、</i>). Nie mieszaj です/ます z である w jednym tekście – to typowy błąd w wypracowaniach.",
      examples: [
        ["{少子化|しょうしか}は{日本|にほん}が{直面|ちょくめん}する{最大|さいだい}の{課題|かだい}である。","Spadek urodzeń jest największym wyzwaniem, przed którym stoi Japonia."],
        ["{対策|たいさく}は{十分|じゅうぶん}ではなく、{効果|こうか}も{限定的|げんていてき}であった。","Działania były niewystarczające, a ich efekt ograniczony."],
        ["{輸出|ゆしゅつ}は{三か月|さんかげつ}{連続|れんぞく}で{減少|げんしょう}しており、{回復|かいふく}には{時間|じかん}がかかるであろう。","Eksport spada trzeci miesiąc z rzędu, a odbudowa zajmie zapewne trochę czasu."]
      ] },
    { title: "Struktura notki prasowej",
      pattern: "～によると / ～ことが明らかになった / ～とみられる / ～とされる / ～方針だ / ～見通しだ",
      explain: "Typowa notka (3–5 zdań): (1) <b>fakt główny</b> – kto, co, kiedy, często zakończony <i>～ことが明らかになった</i> (wyszło na jaw), <i>～と発表した</i>; (2) <b>szczegóły i źródło</b> – <i>関係者によると</i> (według źródeł); (3) <b>przyczyna</b> – <i>～とみられる</i> (uważa się, że), <i>～とされる</i> (mówi się, że); (4) <b>dalsze plany i prognozy</b> – <i>～方針だ</i> (zamierza), <i>～見通しだ</i> (przewiduje się). Sztuczka: główna informacja jest prawie zawsze w pierwszym zdaniu.",
      examples: [
        ["{政府|せいふ}は{来年度|らいねんど}から{最低賃金|さいていちんぎん}を{引|ひ}き{上|あ}げる{方針|ほうしん}を{固|かた}めた。","Rząd zdecydował o podniesieniu płacy minimalnej od przyszłego roku budżetowego."],
        ["{関係者|かんけいしゃ}によると、{工場|こうじょう}の{火災|かさい}は{電気系統|でんきけいとう}の{故障|こしょう}が{原因|げんいん}とみられる。","Według źródeł przyczyną pożaru fabryki była prawdopodobnie awaria instalacji elektrycznej."],
        ["{新|あたら}しい{駅|えき}は{二〇三〇年|にせんさんじゅうねん}に{完成|かんせい}する{見通|みとお}しだ。","Nowa stacja ma zostać ukończona w 2030 roku (przewidywania)."]
      ] }
  ],
  dialog: {
    title: "Negocjacje: termin dostawy",
    cast: { "えんどう": "m", "マルタ": "f" },
    lines: [
      ["マルタ","いつもお{世話|せわ}になっております。{本日|ほんじつ}はお{時間|じかん}をいただき、ありがとうございます。","Dziękuję za stałą współpracę i za poświęcony dziś czas."],
      ["えんどう","こちらこそ。{早速|さっそく}ですが、{納期|のうき}の{件|けん}ですね。","To ja dziękuję. Przejdźmy od razu do rzeczy – chodzi o termin dostawy, tak?"],
      ["マルタ","はい。{誠|まこと}に{申|もう}し{上|あ}げにくいのですが、{部品|ぶひん}の{不足|ふそく}により、{納期|のうき}を{二週間|にしゅうかん}{延|の}ばしていただけないでしょうか。","Tak. Bardzo mi niezręcznie to mówić, ale z powodu braku części – czy moglibyśmy przesunąć termin dostawy o dwa tygodnie?"],
      ["えんどう","{二週間|にしゅうかん}ですか。{弊社|へいしゃ}も{販売|はんばい}の{予定|よてい}がありますので、{正直|しょうじき}{厳|きび}しいですね。","Dwa tygodnie? My też mamy zaplanowaną sprzedaż, więc szczerze mówiąc, to trudne."],
      ["マルタ","ご{迷惑|めいわく}をおかけして{申|もう}し{訳|わけ}ございません。{半分|はんぶん}だけでも{予定|よてい}どおりお{届|とど}けするという{形|かたち}ではいかがでしょうか。","Bardzo przepraszam za kłopot. A gdybyśmy dostarczyli przynajmniej połowę w terminie?"],
      ["えんどう","なるほど。それなら{社内|しゃない}で{検討|けんとう}できそうです。","Rozumiem. To mógłbym rozważyć w firmie."],

      ["えんどう","{承知|しょうち}しました。{恐|おそ}れ{入|い}りますが、{残|のこ}りの{分|ぶん}の{確実|かくじつ}な{日付|ひづけ}も{入|い}れていただけますか。","Przyjąłem. Uprzejmie proszę też o podanie pewnej daty dla pozostałej części."],
      ["マルタ","かしこまりました。{工場|こうじょう}に{確認|かくにん}した{上|うえ}で、{必|かなら}ずお{知|し}らせいたします。","Oczywiście. Po potwierdzeniu w fabryce na pewno dam znać."],
      ["えんどう","よろしくお{願|ねが}いします。{今後|こんご}ともよろしくお{願|ねが}いいたします。","Proszę bardzo. Liczę na dalszą współpracę."]

  exercises: [
    { t:"mc", q:"E-mail do nowego kontrahenta. Co piszesz na samym początku?", opts:["お{世話|せわ}になっております。","お{疲|つか}れ{様|さま}です。","ご{苦労様|くろうさま}です。","はじめまして、よろしく。"], a:0, ex:"お世話になっております to standardowe otwarcie e-maili zewnętrznych (nawet przy pierwszym kontakcie często się go używa, choć można też zacząć od 突然のご連絡失礼いたします). お疲れ様です – tylko wewnątrz firmy. ご苦労様です mówi przełożony do podwładnego." },
    { t:"mc", q:"Najgrzeczniejsza prośba o przesłanie wyceny to:", opts:["お{見積|みつ}もりを{送|おく}っていただけますでしょうか。","お{見積|みつ}もりを{送|おく}ってください。","お{見積|みつ}もりを{送|おく}ってくれますか。","お{見積|みつ}もりを{送|おく}ってもらえる？"], a:0, ex:"Drabina grzeczności: てもらえる？ (kolega) < てくれますか < てください (polecenie) < ていただけますでしょうか (standard e-maila do klienta)." },
    { t:"mc", q:"{明日|あした}の{会議|かいぎ}は{欠席|けっせき}＿＿。", tr:"Pozwolę sobie nie uczestniczyć w jutrzejszym zebraniu.", opts:["させていただきます","していただきます","させてくださいます","されていただきます"], a:0, ex:"Pokorna zapowiedź własnego działania wymagającego zgody → させていただきます. していただきます znaczyłoby, że to KTOŚ INNY nie przyjdzie (dla mnie)." },
    { t:"mc", q:"Która forma jest uważana za BŁĄD (さ{入|い}れ{言葉|ことば})?", opts:["{読|よ}まさせていただきます","{読|よ}ませていただきます","{説明|せつめい}させていただきます","{休|やす}ませていただきます"], a:0, ex:"Czasowniki 五段 tworzą causative bez さ: 読む → 読ませる. 読まさせる to częsty błąd nawet wśród Japończyków." },
    { t:"mc", q:"Przeczytaj: 「{大手|おおて}{自動車|じどうしゃ}メーカーA{社|しゃ}は{昨日|きのう}、{国内|こくない}{工場|こうじょう}の{一部|いちぶ}を{来年|らいねん}{三月|さんがつ}に{閉鎖|へいさ}すると{発表|はっぴょう}した。{電気自動車|でんきじどうしゃ}への{移行|いこう}が{遅|おく}れ、{業績|ぎょうせき}が{悪化|あっか}したためとみられる。{従業員|じゅうぎょういん}は{他|ほか}の{工場|こうじょう}に{異動|いどう}させる{方針|ほうしん}だ。」 Co stanie się z pracownikami?", opts:["Zostaną przeniesieni do innych fabryk.","Zostaną zwolnieni w marcu.","Przejdą do produkcji aut elektrycznych w tej samej fabryce.","Jeszcze nie wiadomo."], a:0, ex:"Ostatnie zdanie notki (～方針だ) mówi o planach: 他の工場に異動させる – przenieść do innych fabryk. とみられる w zdaniu 2 to przypuszczalna przyczyna, nie fakt." },
    { t:"mc", q:"Przeczytaj: 「{気象庁|きしょうちょう}によると、{今年|ことし}の{夏|なつ}の{平均気温|へいきんきおん}は{平年|へいねん}を{一・五度|いってんごど}{上回|うわまわ}り、{観測史上|かんそくしじょう}{最高|さいこう}となった。{熱中症|ねっちゅうしょう}で{搬送|はんそう}された{人|ひと}も{過去最多|かこさいた}であった。」 Jakie jest źródło informacji?", opts:["Agencja meteorologiczna","Szpitale","Ministerstwo zdrowia","Nie podano"], a:0, ex:"～によると wskazuje źródło: 気象庁 – Japońska Agencja Meteorologiczna. Zwróć uwagę na styl である: となった, であった." },

  intro: "Współczesny japoński pełen jest skamielin z języka klasycznego (文語). Nie musisz znać gramatyki klasycznej, ale musisz rozpoznawać jej ślady:<br>• <b>ごとし / ごとく / ごとき</b> – „jak, niczym” (dziś: ～ような / ～ように),<br>• <b>ぬ / ず / ざる</b> – przeczenie (dziś: ～ない),<br>• <b>べし / べき</b> – powinność, możliwość,<br>• <b>なり</b> – dziś głównie „zaraz po” i „czy to…, czy…”.<br>Do tego <b>四字熟語</b> (wyrażenia z czterech znaków) i <b>ことわざ</b> (przysłowia) – Japończycy używają ich w mowach, komentarzach i… w żartach. Użyte w porę świadczą o wysokim poziomie, nadużywane brzmią staroświecko.",

  grammar: [
    { title: "～ごとし / ～ごとく / ～ごとき – jak, niczym",
      pattern: "N + の + ごとし / ごとく / ごとき + N;  V + (が) ごとく",
      explain: "Klasyczny odpowiednik ～ようだ: ごとし (koniec zdania), ごとく (jak przysłówek), ごとき (przed rzeczownikiem). Dziś w stałych wyrażeniach (光陰矢の如し, 前述のごとく) i w stylu pisanym. Uwaga: <b>N + ごとき</b> po osobie bywa pogardliwe (お前ごときに負けるか – „miałbym przegrać z kimś takim jak ty?”), a o sobie – skromne (私ごとき – „ktoś tak marny jak ja”).",
      examples: [
        ["{光陰|こういん}{矢|や}の{如|ごと}し。","Czas płynie jak strzała. (przysłowie)"],
        ["{前述|ぜんじゅつ}のごとく、{計画|けいかく}は{変更|へんこう}された。","Jak wspomniano wyżej, plan został zmieniony."],
        ["{彼|かれ}は{何事|なにごと}もなかったかのごとく{振|ふ}る{舞|ま}った。","Zachowywał się, jakby nic się nie stało."],
        ["{私|わたし}ごときに{務|つと}まる{仕事|しごと}ではありません。","To nie jest zadanie dla kogoś tak skromnego jak ja."]
      ]
    },
    { title: "～ぬ / ～ず / ～ざる / ～ずとも – klasyczne przeczenie",
      pattern: "V (temat ない) + ぬ / ず / ざる + N;  ～ずとも (=～なくても);  する → せぬ / せず",
      explain: "ぬ i ざる stoją przed rzeczownikiem (知らぬ間に, 見知らぬ人, 招かれざる客). ず kończy zdanie lub łączy zdania (= ～ないで). ～ずとも = „nawet bez…, nie trzeba…”. Stałe frazy: 言わずと知れた („rzecz jasna”), 相変わらず, 思わず. W rozmowie żywe są głównie te utarte zwroty – nie twórz z ぬ nowych form w codziennej mowie.",
      examples: [
        ["{知|し}らぬ{間|ま}に{夜|よる}が{明|あ}けていた。","Nie wiadomo kiedy, nastał świt."],
        ["{見知|みし}らぬ{人|ひと}に{道|みち}を{聞|き}かれた。","Nieznajomy zapytał mnie o drogę."],
        ["{言|い}わずと{知|し}れた{名作|めいさく}だ。","To arcydzieło, którego nie trzeba przedstawiać."],
        ["{言|い}わずとも{分|わ}かるだろう。","Nie trzeba mówić – i tak wiesz."],
        ["{心配|しんぱい}せずともよい。","Nie musisz się martwić. (podniośle)"]
      ]
    },
    { title: "～べし / ～べき – powinno się; godny",
      pattern: "V (forma słownikowa) + べし / べき + N;  する → すべし",
      explain: "べし kończy zdanie w regulaminach, maksymach i rozkazach stylizowanych („należy”). べき (forma przydawkowa) jest wciąż żywa: 驚くべき („zdumiewający”), 恐るべき („przerażający, niesamowity” – od klasycznego 恐る), 注目すべき („godny uwagi”). Przypomnienie z lekcji 2: zakaz to べからず.",
      examples: [
        ["{学生|がくせい}は{学業|がくぎょう}に{励|はげ}むべし。","Uczeń winien przykładać się do nauki."],
        ["{参加者|さんかしゃ}は{九時|くじ}までに{集合|しゅうごう}すべし。","Uczestnicy mają zebrać się do dziewiątej."],
        ["{調査|ちょうさ}で{驚|おどろ}くべき{事実|じじつ}が{明|あき}らかになった。","Badanie ujawniło zdumiewający fakt."],
        ["{恐|おそ}るべき{新人|しんじん}が{現|あらわ}れた。","Pojawił się niesamowity debiutant."]
      ]
    },
    { title: "～なり – zaraz po; czy to…, czy; na swój sposób",
      pattern: "V (forma słownikowa) + なり;  N1 なり N2 なり;  N + なりに",
      explain: "1) V + なり = „ledwie…, natychmiast” – zaskakująca, nagła reakcja <b>osoby trzeciej</b> (nie o sobie, nie z rozkazem). 2) ～なり～なり = „czy to X, czy Y” – propozycja przykładowych opcji (często z prośbą). 3) N + なりに = „na miarę (swoich możliwości)”: 私なりに. 4) Na pokwitowaniach klasyczne 也 = „równo”: 金五万円也.",
      examples: [
        ["{彼|かれ}は{家|いえ}に{帰|かえ}るなり、ベッドに{倒|たお}れ{込|こ}んだ。","Ledwie wrócił do domu, padł na łóżko."],
        ["{彼女|かのじょ}は{私|わたし}の{顔|かお}を{見|み}るなり{泣|な}き{出|だ}した。","Jak tylko mnie zobaczyła, wybuchła płaczem."],
        ["{電話|でんわ}なりメールなりで{連絡|れんらく}してください。","Proszę się skontaktować, czy to telefonicznie, czy mailowo."],
        ["{私|わたし}なりに{精一杯|せいいっぱい}{努力|どりょく}しました。","Starałem się, jak umiałem."]

    },
    { title: "四字熟語 – wyrażenia czteroznakowe",
      pattern: "四字熟語 + だ / の + N / に + V",
      explain: "Zwięzłe idiomy, często z chińskich klasyków lub buddyzmu. Funkcjonują jak rzeczowniki lub przymiotniki: 一石二鳥だ, 半信半疑で聞く, 試行錯誤を重ねる. Zwróć uwagę na nieregularne czytania: 十人十色（じゅうにん<b>といろ</b>）, 一期一会（いち<b>ご</b>いち<b>え</b>）, 異口同音（い<b>く</b>どうおん）. 自業自得 brzmi oskarżycielsko – nie mów tak do kogoś w nieszczęściu.",
      examples: [
        ["{駅|えき}まで{歩|ある}けば{運動|うんどう}にもなるし、お{金|かね}も{浮|う}く。{一石二鳥|いっせきにちょう}だ。","Pieszo na stację to i ruch, i oszczędność. Dwie pieczenie na jednym ogniu."],
        ["{徹夜|てつや}で{遊|あそ}んで{試験|しけん}に{落|お}ちたなら、{自業自得|じごうじとく}だよ。","Jak całą noc się bawiłeś i oblałeś egzamin, to sam sobie winien."],
        ["{試行錯誤|しこうさくご}を{重|かさ}ねて、ようやく{新製品|しんせいひん}が{完成|かんせい}した。","Po wielu próbach i błędach nowy produkt jest wreszcie gotowy."],
        ["{好|この}みは{十人十色|じゅうにんといろ}だから、{正解|せいかい}はない。","Ilu ludzi, tyle gustów – nie ma jednej dobrej odpowiedzi."],
        ["{参加者|さんかしゃ}は{異口同音|いくどうおん}に「{楽|たの}しかった」と{言|い}った。","Uczestnicy jednogłośnie powiedzieli, że było świetnie."]

    { title: "ことわざ – przysłowia",
      pattern: "ことわざ + ですね / と言うように / というわけだ",
      explain: "Przysłowia wplata się w rozmowę z komentarzem: ～と言うでしょう, ～ですね, まさに～だ. Najczęstsze: 猿も木から落ちる (każdy się myli, nawet mistrz), 石の上にも三年 (cierpliwość popłaca), 急がば回れ (co nagle, to po diable), 塵も積もれば山となる (ziarnko do ziarnka – klasyczne となる), 花より団子 (praktyczne ponad piękne). Uwaga: 猿も木から落ちる mówi się o <b>ekspercie</b>, nie o sobie jako początkującym.",
      examples: [
        ["{猿|さる}も{木|き}から{落|お}ちるで、プロの{選手|せんしゅ}でもミスをする。","Każdemu się zdarza – nawet zawodowcy popełniają błędy."],
        ["{石|いし}の{上|うえ}にも{三年|さんねん}と{言|い}うから、もう{少|すこ}し{続|つづ}けてみよう。","Jak mówią, cierpliwość popłaca – pociągnę to jeszcze trochę."],
        ["{急|いそ}がば{回|まわ}れ。{基礎|きそ}からやり{直|なお}そう。","Co nagle, to po diable. Zacznijmy od podstaw."],

<script>
const PASS = 60; // próg zaliczenia lekcji i egzaminu (%)
/* ===================== zeszyt błędów ===================== */
// Każde ćwiczenie źle rozwiązane za pierwszym razem trafia do S.mist; znika po 2 poprawnych odpowiedziach.
function mistKey(it) { const s = JSON.stringify(it); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function noteMistake(it, ok, opts) {
  if (opts.noMist) return;
  const k = mistKey(it), m = S.mist[k];
  if (!ok) {
    S.mist[k] = { it, src: opts.src || (m && m.src) || "", n: (m ? m.n : 0) + 1, ok: 0, t: Date.now() };
    const keys = Object.keys(S.mist);
    if (keys.length > 150) keys.sort((a, b) => S.mist[a].t - S.mist[b].t).slice(0, keys.length - 150).forEach(x => delete S.mist[x]);
  } else if (m) { if (++m.ok >= 2) delete S.mist[k]; }
  else return;
  saveState();
}
function mistCount() { return Object.keys(S.mist).length; }
/* ===================== silnik ćwiczeń ===================== */
const TYPE_LABEL = { mc: "Wybierz odpowiedź", listen: "Słuchanie", order: "Ułóż zdanie", type: "Wpisz odpowiedź", match: "Dopasuj pary" };
const BLANK = /＿＿+|__+/;

function runQuiz(root, items, opts = {}) {
  // opts: title, onFinish(pct), back (href), color
  let queue = items.map((it, i) => ({ it, i, retry: false }));
  const total = items.length;
  const firstTry = new Map(); // i → correct?
  let pos = 0;
  root.innerHTML = `<div class="quiz">
    <div class="qhead"><a class="btn sm" href="${opts.back || "#/"}">✕</a><div class="prog" style="--c:${opts.color || "var(--ok)"}"><i style="width:0%"></i></div><span class="small muted qcount"></span></div>
    <div class="qbody"></div></div>`;
  const body = $(".qbody", root), bar = $(".prog>i", root), cnt = $(".qcount", root);

  function next() {
    TTS.stop();
    if (pos >= queue.length) return finish();
    const q = queue[pos];
    bar.style.width = (100 * firstTry.size / total) + "%";
    cnt.textContent = Math.min(firstTry.size + 1, total) + "/" + total + (q.retry ? " · powtórka" : "");
    const card = document.createElement("div");
    card.className = "card qcard";
    body.innerHTML = ""; body.appendChild(card);
    renderItem(card, q.it, ok => {
      if (!firstTry.has(q.i)) { firstTry.set(q.i, ok); noteMistake(q.it, ok, opts); }
      if (!ok && !q.retry) queue.push({ it: q.it, i: q.i, retry: true });
      bar.style.width = (100 * firstTry.size / total) + "%";
    }, () => { pos++; next(); });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function finish() {
    bar.style.width = "100%";
    const good = [...firstTry.values()].filter(Boolean).length;
    const pct = Math.round(100 * good / Math.max(1, total));
    const xp = good * 2 + (pct >= PASS ? 10 : 0);
    addXP(xp);
    const emo = pct >= 90 ? "🏆" : pct >= 75 ? "🎉" : pct >= PASS ? "👍" : "💪";
    const msg = pct >= 90 ? "Doskonale! Ten materiał masz opanowany." : pct >= 75 ? "Bardzo dobrze – lekcja zaliczona!" : pct >= PASS ? "Zaliczone! Jeśli chcesz, zrób to jeszcze raz – za drugim razem pójdzie lepiej." : "Prawie! Posłuchaj jeszcze raz słówek i przykładów, a potem spróbuj ponownie – zaliczenie od " + PASS + "%.";
    body.innerHTML = `<div class="card result"><div style="font-size:50px">${emo}</div><div class="pct">${pct}%</div>
      <p>${good} z ${total} dobrze za pierwszym razem · +${xp} XP</p><p class="muted">${msg}</p>
      <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn again">↻ Jeszcze raz</button>${opts.nextHref ? `<a class="btn pri" href="${opts.nextHref}">${opts.nextLabel || "Dalej"} →</a>` : ""}<a class="btn" href="${opts.back || "#/"}">Wróć</a></div></div>`;
    $(".again", body).onclick = () => runQuiz(root, opts.regen ? opts.regen() : shuffle(items), opts);
    opts.onFinish && opts.onFinish(pct);
  }
  next();
}

function feedback(card, ok, correctHtml, ex, speakText, onNext) {
  const fb = document.createElement("div");
  fb.className = "fb " + (ok ? "ok" : "bad");
  fb.innerHTML = `<div class="h">${ok ? "✓ Dobrze!" : "✗ Niestety."}</div>
    ${!ok && correctHtml ? `<div>Poprawnie: <span class="jpline">${correctHtml}</span></div>` : ""}
    ${ok && correctHtml && speakText ? `<div class="jpline">${correctHtml}</div>` : ""}
    ${ex ? `<div class="small" style="margin-top:6px">${ruby(ex)}</div>` : ""}`;
  if (speakText) { const b = document.createElement("span"); b.innerHTML = " " + sayBtn(speakText); fb.querySelector(".h").appendChild(b.firstElementChild); }
  card.appendChild(fb);
  const nav = document.createElement("div");
  nav.className = "qnav";
  nav.innerHTML = `<button class="btn pri nextq">Dalej →</button>`;
  card.appendChild(nav);
  const btn = $(".nextq", nav);
  btn.focus({ preventScroll: true });
  btn.onclick = onNext;
  if (speakText && S.settings.autoplay) say(speakText);
}

function renderItem(card, it, report, onNext) {
  const head = `<div class="qtype">${it.label || TYPE_LABEL[it.t] || ""}</div>`;
  if (it.t === "mc") {
    const order = shuffle(it.opts.map((o, i) => i));
    const jpQ = HAS_JP.test(plain(it.q || ""));
    const filled = BLANK.test(it.q || "") && HAS_JP.test(it.opts[it.a]) ? it.q.replace(BLANK, it.opts[it.a]) : null;
    card.innerHTML = head + `<div class="qq ${it.big ? "bigjp" : ""}">${ruby(it.q)} ${it.speakQ ? sayBtn(it.speakQ, { raw: true }) : ""}</div>
      ${it.tr ? `<div class="qtr">„${esc(it.tr)}”</div>` : ""}
      <div class="opts">${order.map(i => `<button class="opt" data-i="${i}">${ruby(it.opts[i])}</button>`).join("")}</div>`;
    if (it.speakQ && it.autoSpeak !== false && S.settings.autoplay) TTS.speak(it.speakQ);
    $$(".opt", card).forEach(b => b.onclick = () => {
      const i = +b.dataset.i, ok = i === it.a;
      $$(".opt", card).forEach(x => { x.disabled = true; if (+x.dataset.i === it.a) x.classList.add("ok"); });
      if (!ok) b.classList.add("bad");
      report(ok);

/* ===================== generatory ćwiczeń ===================== */
function vocabPool(level) { return level.lessons.flatMap(l => l.vocab || []); }
function distract(list, correct, n, key) {
  const seen = new Set([key(correct)]); const out = [];
  for (const x of shuffle(list)) { const k = key(x); if (!seen.has(k)) { seen.add(k); out.push(x); } if (out.length >= n) break; }
  return out;
}
function genVocab(vocab, pool, n) {
  const res = [];
  const src = pick(vocab, Math.min(n, vocab.length));
  src.forEach((v, k) => {
    const [w, r, m] = v;
    const others = distract(vocab.length >= 6 ? vocab : pool, v, 3, x => x[2]);
    if (others.length < 3) others.push(...distract(pool, v, 3 - others.length, x => x[2]));
    const mk = wordMarkup(w, r);
    const kind = k % 4;
    if (kind === 0) {
      const opts = [m, ...others.map(o => o[2])];
      res.push({ t: "mc", label: "Co to znaczy?", q: mk, big: true, speakQ: r, opts, a: 0 });
    } else if (kind === 1) {
      const opts = [mk, ...others.map(o => wordMarkup(o[0], o[1]))];
      res.push({ t: "mc", label: "Jak to powiesz po japońsku?", q: "„" + m + "”", opts, a: 0, ex: "" });
    } else if (kind === 2) {
      res.push({ t: "listen", jp: r, raw: true, opts: [m, ...others.map(o => o[2])], a: 0, ex: mk + " – " + m });
    } else {
      if (HAS_KANJI.test(w)) res.push({ t: "type", label: "Jak to się czyta?", q: `<span style="font-size:34px">${w}</span> <span class="small muted">(${esc(m)})</span>`, a: [r], say: r, sayShow: mk });
      else res.push({ t: "type", label: "Napisz po japońsku", q: "„" + m + "”", a: [r, w], say: r, sayShow: w, hint: toRomaji(r).slice(0, 2) + "…" });
    }
  });
  return res;
}
function genKanji(kanji, pool) {
  const res = [];
  kanji.forEach((k, i) => {
    const others = distract(kanji.length >= 5 ? kanji : pool, k, 3, x => x[0]);
    if (others.length < 3) return;
    if (i % 3 === 0) res.push({ t: "mc", label: "Znaczenie kanji", q: `<span style="font-family:var(--jpserif);font-size:60px">${k[0]}</span>`, big: true, opts: [k[3], ...others.map(o => o[3])], a: 0, ex: `on: ${k[1] || "–"} · kun: ${k[2] || "–"}` });
    else if (i % 3 === 1) res.push({ t: "mc", label: "Który to znak?", q: "„" + k[3] + "”", opts: [k[0], ...others.map(o => o[0])].map(x => `<span style="font-size:30px">${x}</span>`), a: 0 });
    else {
      const ex = (k[4] || [])[0];
      if (ex) { const p = plain(ex), r = reading(ex); res.push({ t: "type", label: "Przeczytaj słowo", q: `<span style="font-size:34px">${p}</span>`, a: [r], say: r, sayShow: ex }); }
    }
  });
  return res;
}
function genKana(chars, pool) {
  const res = [];
  chars.forEach((c, i) => {
    const others = distract(pool, c, 3, x => x[1]);
    const k = i % 4;
    if (k === 0) res.push({ t: "mc", label: "Jak to czytamy?", q: `<span style="font-size:70px">${c[0]}</span>`, big: true, speakQ: K2H(c[0]) === "を" ? "お" : c[0], autoSpeak: false, opts: [c[1], ...others.map(o => o[1])], a: 0 });
    else if (k === 1) res.push({ t: "mc", label: "Który znak to…", q: `<b style="font-size:30px">${c[1]}</b>`, opts: [c[0], ...others.map(o => o[0])].map(x => `<span style="font-size:30px">${x}</span>`), a: 0 });
    else if (k === 2) res.push({ t: "listen", jp: c[0] === "を" || c[0] === "ヲ" ? "お" : c[0], raw: true, opts: [c[0], ...others.map(o => o[0])].map(x => `<span style="font-size:28px">${x}</span>`), a: 0, ex: c[0] + " = " + c[1] });
    else res.push({ t: "type", latin: true, label: "Wpisz romaji", q: `<span style="font-size:60px">${c[0]}</span>`, a: [c[1].replace(/\s*\(.*\)/, ""), toRomaji(c[0])] });
  });
  return res;
}

/* ===================== widok: lekcja ===================== */
function lessonTabs(l) {
  const t = [];
  if (l.kind === "kana") { t.push(["learn", "📖 Znaki"], ["film", "🎬 Filmik"]); }
  else t.push(["learn", l.kind === "phr" ? "📖 Wstęp" : "📖 Teoria"]);
  if (l.vocab && l.vocab.length && l.kind !== "intro") t.push(["vocab", "🗣 Słówka"]);
  if (l.kanji && l.kanji.length) t.push(["kanji", "字 Kanji"]);
  if (l.dialog && l.dialog.lines) t.push(["dialog", "🎬 Scenka"]);
  t.push(["practice", "✍️ Ćwiczenia"], ["test", "🏁 Test"]);
  return t;
}
function viewLesson(id, tab) {
  const l = LESSONS[id]; if (!l) return viewHome();
  const L = LESSON_LEVEL[id];
  const st = lessonState(id);
  if (!st.seen) { st.seen = true; saveState(); }
  const tabs = lessonTabs(l);
  if (!tabs.some(t => t[0] === tab)) tab = tabs[0][0];
  const idx = L.lessons.indexOf(l);
  const nextL = L.lessons[idx + 1] || (LV[LV.indexOf(L) + 1] || { lessons: [] }).lessons[0];
  app().innerHTML = `<div class="crumbs"><a href="#/">Start</a> › <a href="#/level/${L.id}">${esc(L.short)}</a> › Lekcja ${idx + 1}</div>
    <h1 style="--c:${L.color}">${esc(l.title)} ${st.done ? `<span class="pill">✓ zaliczona · ${st.best}%</span>` : ""}</h1>
    <div class="tabs">${tabs.map(([k, n]) => `<a class="tab ${k === tab ? "on" : ""}" href="#/lesson/${id}/${k}">${n}</a>`).join("")}</div>
    <div id="tab" style="--c:${L.color}"></div>`;
  const root = $("#tab");
  const nextTab = (() => { const i = tabs.findIndex(t => t[0] === tab); return tabs[i + 1]; })();
  const nextBtn = nextTab ? `<div class="row" style="justify-content:flex-end;margin-top:18px"><a class="btn pri" href="#/lesson/${id}/${nextTab[0]}">Dalej: ${nextTab[1]} →</a></div>` : "";
  if (tab === "learn") root.innerHTML = (l.kind === "kana" ? learnKana(l) : learnTheory(l)) + nextBtn;
  if (tab === "pron") root.innerHTML = pronTab(l) + nextBtn;
  if (tab === "vocab") { root.innerHTML = vocabTab(l) + nextBtn; bindVocab(root, l, L); addToSRS(l); }
  if (tab === "kanji") { root.innerHTML = kanjiTab(l) + nextBtn; bindKanji(root, l, L); addToSRS(l); }
  if (tab === "dialog") { root.innerHTML = `<div id="stage"></div>` + nextBtn; dialogPlayer($("#stage"), l.dialog); }
  if (tab === "film") { root.innerHTML = `<div id="stage"></div>` + nextBtn; kanaFilm($("#stage"), l); }
  if (tab === "practice" || tab === "test") {
    addToSRS(l);
    const make = () => buildLessonQuiz(l, L, tab);
    const items = make();
    const done = pct => {
      if (pct > st.best) st.best = pct;
      if (pct >= PASS && !st.done) { st.done = true; toast("🎉 Lekcja zaliczona!"); }
      saveState();
    };
    const nextHref = tab === "practice" ? `#/lesson/${id}/test` : (nextL ? `#/lesson/${nextL.id}` : `#/level/${L.id}`);
    const intro = document.createElement("div");
    intro.className = "card"; intro.style.marginBottom = "14px";
    intro.innerHTML = tab === "practice"
      ? `<b>Ćwiczenia</b><p class="small muted">${items.length} zadań: wszystkie ćwiczenia z lekcji plus trening słówek${l.kanji ? " i kanji" : ""}. Błędne odpowiedzi wrócą na końcu. Zaliczenie lekcji: ${PASS}%.</p><button class="btn pri start">Zaczynamy ▶</button>`
      : `<b>Test lekcji</b><p class="small muted">${items.length} losowych zadań z całej lekcji. Wynik od ${PASS}% zalicza lekcję.</p><button class="btn pri start">Rozpocznij test ▶</button>`;
    root.appendChild(intro);
    $(".start", intro).onclick = () => runQuiz(root, items, { src: id, back: `#/lesson/${id}`, color: L.color, onFinish: done, regen: make, nextHref, nextLabel: tab === "practice" ? "Test" : "Następna lekcja" });
  }
}
function buildLessonQuiz(l, L, tab) {
  const pool = vocabPool(L);
  const hand = (l.exercises || []).slice();
  let gen = [];
  if (l.kind === "kana") {
    const lvlChars = L.lessons.filter(x => x.chars).flatMap(x => x.chars);
    gen = (l.chars.length ? genKana(shuffle(l.chars).concat(l.chars.length < 8 ? shuffle(l.chars) : []), lvlChars) : []).concat(genVocab(l.vocab || [], pool, 6));
  } else {
    gen = genVocab(l.vocab || [], pool, tab === "practice" ? 10 : 6);
    if (l.kanji && l.kanji.length) gen = gen.concat(genKanji(shuffle(l.kanji), ALL_KANJI.map(x => x.k)).slice(0, tab === "practice" ? 6 : 4));
  }
  if (tab === "practice") {
    // najpierw ćwiczenia ręczne (z przemieszanymi generowanymi), żeby było różnorodnie
    const out = []; const g = shuffle(gen);
    hand.forEach((h, i) => { out.push(h); if (i % 2 === 1 && g.length) out.push(g.shift()); });
    return out.concat(g);
  }
  return shuffle(pick(hand, Math.min(12, hand.length)).concat(pick(gen, 8)));
}

function bindVocab(root, l, L) {
  const rows = $$("tr[data-v]", root);
  let stop = false;
  $(".playall", root).onclick = async e => {
    const b = e.target; if (b.dataset.on) { stop = true; TTS.stop(); return; }
    b.dataset.on = 1; b.textContent = "⏹ Zatrzymaj"; stop = false;
    for (let i = 0; i < l.vocab.length && !stop; i++) {
      rows.forEach(r => r.style.background = ""); rows[i].style.background = "var(--bg3)"; rows[i].scrollIntoView({ block: "nearest", behavior: "smooth" });
      await TTS.speak(l.vocab[i][1], { queue: true }); await sleep(900);
    }
    rows.forEach(r => r.style.background = ""); delete b.dataset.on; b.textContent = "▶ Odsłuchaj wszystkie";
  };
  players.push({ stop: () => { stop = true; } });
  $(".rom", root).onchange = e => { S.settings.romaji = e.target.checked; saveState(); route(); };
  $(".flashb", root).onclick = () => flashcards(root, l.vocab.map(v => ({ front: wordMarkup(v[0], v[1]), back: v[2], say: v[1], sub: toRomaji(v[1]) + " · czytaj „" + toPolish(v[1]) + "”" })), `#/lesson/${l.id}/vocab`);
  $(".vquiz", root).onclick = () => runQuiz(root, genVocab(l.vocab, vocabPool(L), Math.min(16, l.vocab.length)), { src: l.id, back: `#/lesson/${l.id}/vocab`, color: L.color });
}
function flashcards(root, cards, back) {
  let i = 0, flipped = false, dir = 0; cards = shuffle(cards);
  function draw() {
    const c = cards[i];
    const front = dir === 0 ? `<div class="fjp">${ruby(c.front)}</div>` : `<div class="fpl">${esc(c.back)}</div>`;
    const backS = dir === 0 ? `<div class="fpl">${esc(c.back)}</div><div class="muted">${esc(c.sub || "")}</div>` : `<div class="fjp">${ruby(c.front)}</div><div class="muted">${esc(c.sub || "")}</div>`;
    root.innerHTML = `<div class="quiz"><div class="qhead"><a class="btn sm" href="${back}">✕</a><div class="prog"><i style="width:${100 * i / cards.length}%"></i></div><span class="small muted">${i + 1}/${cards.length}</span></div>
      <div class="card flash">${flipped ? `<div>${front}<hr style="border:none;border-top:1px solid var(--line)">${backS}</div>` : `<div>${front}<p class="muted small">Kliknij, żeby odwrócić</p></div>`}</div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn prev">←</button><button class="btn sp">🔊</button><button class="btn dirb">⇄ ${dir ? "PL→JP" : "JP→PL"}</button><button class="btn pri nx">→</button></div></div>`;
    $(".flash", root).onclick = () => { flipped = !flipped; if (flipped) TTS.speak(c.say); draw(); };
    $(".sp", root).onclick = () => TTS.speak(c.say);
    $(".prev", root).onclick = () => { if (i > 0) { i--; flipped = false; draw(); } };
    $(".nx", root).onclick = () => { if (i < cards.length - 1) { i++; flipped = false; draw(); } else go(back.replace("#", "")); };
    $(".dirb", root).onclick = () => { dir = 1 - dir; flipped = false; draw(); };
    if (dir === 0 && !flipped && S.settings.autoplay) TTS.speak(c.say);
  }
  draw();
}

/* ===================== okno: pisanie ===================== */
function traceModal(ch, infoHtml, speak, serif, opt = {}) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box"><button class="ib x">✕</button>
    <div class="row">${speak ? sayBtn(speak, { raw: true }) : ""}<div>${infoHtml}</div></div>
    <div class="trace"><div class="grid-l"></div><div class="gh" style="${opt.hidden ? "visibility:hidden;" : ""}font-size:min(230px,60vw);${serif ? "font-family:var(--jpserif)" : ""}">${ch}</div><canvas></canvas></div>
    <div class="row" style="justify-content:center"><button class="btn sm clr">🧽 Wyczyść</button><button class="btn sm tg">${opt.hidden ? "👁 Pokaż znak" : "👁 Ukryj wzór"}</button>${opt.next ? `<button class="btn sm pri nx">Następny →</button>` : ""}</div>
    <p class="small muted" style="text-align:center">${opt.hidden ? "Napisz znak z pamięci palcem, potem stuknij „Pokaż znak” i porównaj." : "Pisz palcem lub myszką po szarym wzorze."} Zasada kolejności kresek: od góry do dołu, od lewej do prawej; poziome przed pionowymi.</p></div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.onclick = e => { if (e.target === m) close(); };
  $(".x", m).onclick = close;
  const cv = $("canvas", m), box = $(".trace", m);
  const dpr = window.devicePixelRatio || 1;
  const r = box.getBoundingClientRect(); cv.width = r.width * dpr; cv.height = r.height * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = Math.max(8, r.width / 28); ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent") || "#d62828";
  let down = false, lx, ly;
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { e.preventDefault(); down = true; [lx, ly] = pt(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(lx, ly, ctx.lineWidth / 2, 0, 7); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); };
  cv.onpointermove = e => { if (!down) return; const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(x, y); ctx.stroke(); lx = x; ly = y; };
  cv.onpointerup = cv.onpointercancel = () => down = false;
  $(".clr", m).onclick = () => ctx.clearRect(0, 0, cv.width, cv.height);
  const nx = $(".nx", m); if (nx) nx.onclick = () => { close(); opt.next(); };
  $(".tg", m).onclick = e => { const g = $(".gh", m); g.style.visibility = g.style.visibility === "hidden" ? "" : "hidden"; e.target.textContent = g.style.visibility ? "👁 Pokaż znak" : "👁 Ukryj wzór"; if (!g.style.visibility && opt.onShow) opt.onShow(m); };
  if (speak && !opt.hidden) TTS.speak(speak);
}

function dialogPlayer(root, d) {

    <div class="script">${d.lines.map((ln, i) => `<div class="sline" data-l="${i}"><span class="who">${esc(ln[0])}</span><div style="flex:1"><div class="jpl">${ruby(ln[1])}</div><div class="pl ${S.settings.hidepl ? "hid" : ""}">${esc(ln[2])}</div></div>${recBtn(ln[1])}</div>`).join("")}</div></div>`;
  const subs = $(".subs", root), playB = $(".play", root);
  const actors = $$(".actor", root), lines = $$(".sline", root);
  const hints = { watch: "Oglądaj i słuchaj. Kliknij dowolną kwestię poniżej, żeby ją powtórzyć.", shadow: "Po każdej kwestii masz chwilę, żeby powtórzyć ją na głos – naśladuj melodię i tempo.", role: "Wybierz swoją postać. Gdy przyjdzie Twoja kolej, powiedz kwestię na głos" + (SRec ? " – mikrofon sprawdzi wymowę." : ", potem naciśnij „Dalej”.") };
  function show(i, yourTurn) {
    const ln = d.lines[i];
    actors.forEach(a => a.classList.toggle("talk", a.dataset.a === ln[0] && !yourTurn));
    lines.forEach((x, k) => x.classList.toggle("on", k === i));
    lines[i].scrollIntoView({ block: "nearest", behavior: "smooth" });
    subs.innerHTML = `${yourTurn ? `<div class="yt">🎤 Twoja kolej (${esc(ln[0])})!</div>` : ""}${showJP || yourTurn ? `<div class="sj">${ruby(ln[1])}</div>` : ""}${showPL ? `<div class="sp">${esc(ln[2])}</div>` : ""}`;
  }
  async function speakLine(i, t) {
    const ln = d.lines[i];
    show(i);
    await say(ln[1], { gender: d.cast[ln[0]], queue: true, rate: S.settings.rate });
    if (t === token) actors.forEach(a => a.classList.remove("talk"));
  }
  async function playFrom(start) {
    const t = ++token; playing = true; playB.textContent = "⏸ Pauza";
    TTS.stop();
    for (let i = start; i < d.lines.length; i++) {
      if (t !== token) return;
      cur = i;
      const ln = d.lines[i];
      if (mode === "role" && ln[0] === role) {
        show(i, true);
        if (SRec) { await checkSpeech(ln[1], null); await sleep(600); }
        else { await waitNext(t); }
        if (t !== token) return;
        await say(ln[1], { gender: d.cast[ln[0]], queue: true, rate: S.settings.rate });
        continue;
      }
      const t0 = Date.now();
      await speakLine(i, t);
      if (t !== token) return;
      if (mode === "shadow") {
        const dur = Math.max(1500, (Date.now() - t0) * 1.3);
        subs.insertAdjacentHTML("afterbegin", `<div class="yt">🔁 Powtórz!</div>`);
        await sleep(dur);
      } else await sleep(450);
    }
    if (t === token) { playing = false; playB.textContent = "↻ Od początku"; cur = -1; addXP(3); }
  }
  function waitNext(t) {
    return new Promise(res => {
      const b = document.createElement("button"); b.className = "btn pri"; b.textContent = "Dalej →"; b.style.marginTop = "8px";
      subs.appendChild(b); b.onclick = () => res();
      const iv = setInterval(() => { if (t !== token) { clearInterval(iv); res(); } }, 300);
    });
  }
  function stop() { token++; playing = false; TTS.stop(); actors.forEach(a => a.classList.remove("talk")); playB.textContent = "▶ Odtwórz"; }
  players.push({ stop });
  playB.onclick = () => { if (playing) stop(); else playFrom(cur >= 0 && cur < d.lines.length - 1 ? cur : 0); };
  $(".prev", root).onclick = () => { stop(); cur = Math.max(0, cur - 1); playFrom(cur); };
  $(".nxt", root).onclick = () => { stop(); cur = Math.min(d.lines.length - 1, cur + 1); playFrom(cur); };
  lines.forEach((x, i) => x.onclick = e => { if (e.target.closest("[data-rec]") || e.target.closest(".pl.hid")) return; stop(); cur = i; const t = ++token; speakLine(i, t); });
  $(".mode", root).onchange = e => { mode = e.target.value; $(".role", root).style.display = mode === "role" ? "" : "none"; $(".mhint", root).textContent = hints[mode]; stop(); cur = -1; };
  $(".role", root).onchange = e => { role = e.target.value; };
  $(".rate", root).oninput = e => { S.settings.rate = +e.target.value; saveState(); };
  $(".sjp", root).onchange = e => { showJP = e.target.checked; };
  $(".spl", root).onchange = e => { showPL = e.target.checked; };
}

function kanaFilm(root, l) {
  let i = 0, token = 0, playing = false;
  root.innerHTML = `<div class="card" style="padding:12px"><div class="stage film"><div class="fbox"><div class="muted">Filmik pokaże każdy znak, przeczyta go wolno i normalnie, a potem przykładowe słowo. Po każdym odczycie jest chwila ciszy – powtórz wtedy na głos!</div></div></div>
    <div class="ctrl"><button class="btn pri play">▶ Odtwórz</button><button class="btn sm prev">⏮</button><button class="btn sm nxt">⏭</button>
    <label class="small">tempo <input type="range" class="rate" min="0.5" max="1.2" step="0.05" value="${S.settings.rate}"></label><span class="small muted pos"></span></div></div>`;
  const box = $(".fbox", root), playB = $(".play", root), posEl = $(".pos", root);
  function show(k) {
    const c = l.chars[k];
    box.innerHTML = `<div class="fc">${c[0]}</div><div class="fr">${esc(c[1])} <span style="font-size:18px;font-weight:600">· czytaj „${esc(toPolish(c[0]))}”</span></div><div class="fm">🗣 ${esc(pronNote(c[0]))}</div>${c[2] ? `<div class="fm small">💡 ${esc(c[2])}</div>` : ""}${c[3] ? `<div class="fw">${esc(c[3])} <span class="small">„${esc(toPolish(c[3]))}” – ${esc(c[4])}</span></div>` : ""}`;
    posEl.textContent = (k + 1) + " / " + l.chars.length;
  }
  async function run(start) {
    const t = ++token; playing = true; playB.textContent = "⏸ Pauza";
    for (i = start; i < l.chars.length; i++) {
      if (t !== token) return;
      const c = l.chars[i]; show(i);
      const s = c[0] === "を" || c[0] === "ヲ" ? "お" : c[0];
      await sleep(400); if (t !== token) return;
      await TTS.speak(s, { queue: true, slow: true }); await sleep(1200); if (t !== token) return;
      await TTS.speak(s, { queue: true }); await sleep(1500); if (t !== token) return;
      await TTS.speak(s, { queue: true }); await sleep(1300); if (t !== token) return;
      if (c[3]) { await TTS.speak(c[3], { queue: true, slow: true }); await sleep(1000); if (t !== token) return; await TTS.speak(c[3], { queue: true }); await sleep(1600); }
    }
    if (t === token) { playing = false; playB.textContent = "↻ Od początku"; i = 0; addXP(3); }
  }
  function stop() { token++; playing = false; TTS.stop(); playB.textContent = "▶ Odtwórz"; }
  players.push({ stop });
  playB.onclick = () => playing ? stop() : run(i >= l.chars.length ? 0 : i);
  $(".prev", root).onclick = () => { stop(); i = Math.max(0, i - 1); run(i); };
  $(".nxt", root).onclick = () => { stop(); i = Math.min(l.chars.length - 1, i + 1); run(i); };
  $(".rate", root).oninput = e => { S.settings.rate = +e.target.value; saveState(); };
}

const INTERVALS = [0, 1, 3, 7, 16, 35, 90]; // dni
function viewReview() {
  const now = Date.now();
  const keys = Object.keys(S.srs);
  const due = shuffle(keys.filter(k => S.srs[k].due <= now)).slice(0, 30);
  const boxes = [0, 0, 0, 0, 0, 0, 0]; keys.forEach(k => boxes[Math.min(6, S.srs[k].box)]++);
  if (!due.length) {
    app().innerHTML = `<div class="crumbs"><a href="#/">Start</a> › Powtórki</div><h1>Powtórki 🔁</h1>
      <div class="card"><p>${keys.length ? "✅ Na dziś wszystko powtórzone! Wróć jutro." : "Nie masz jeszcze słówek w powtórkach. Otwórz zakładkę <b>Słówka</b> albo <b>Kanji</b> w dowolnej lekcji – trafią tutaj automatycznie."}</p>
      ${keys.length ? `<p class="small muted">Masz ${keys.length} kart. Pudełka (im wyżej, tym lepiej utrwalone): ${boxes.map((b, i) => `<span class="pill">${i}: ${b}</span>`).join(" ")}</p><button class="btn extra">Powtórz mimo to 10 losowych kart</button>` : ""}</div>`;
    const ex = $(".extra"); if (ex) ex.onclick = () => reviewSession(pick(keys, 10));

  }

}
function reviewSession(keys) {
  let i = 0, flipped = false, good = 0;
  const cardOf = k => {
    const [t, a, b] = k.split("|");
    if (t === "v") return { front: wordMarkup(a, b), back: S.srs[k].m, say: b, sub: toRomaji(b) };
    const K = ALL_KANJI.find(x => x.k[0] === a);
    return { front: `<span style="font-family:var(--jpserif)">${a}</span>`, back: S.srs[k].m, say: K ? reading(K.k[4][0] || "") : "", sub: K ? `on: ${K.k[1]} · kun: ${K.k[2] || "–"} · ${(K.k[4] || []).map(plain).join("、")}` : "" };
  };
  function draw() {
    if (i >= keys.length) {
      addXP(good * 2);
      app().innerHTML = `<div class="card result"><div style="font-size:48px">✅</div><h2>Powtórka skończona</h2><p>${good} z ${keys.length} pamiętałeś/aś. +${good * 2} XP</p><div class="row" style="justify-content:center"><a class="btn pri" href="#/">Start</a><a class="btn" href="#/review">Jeszcze raz</a></div></div>`;
      updateBadge(); return;
    }
    const k = keys[i], c = cardOf(k);
    const rev = S.srs[k].box % 2 === 1; // co drugie pudełko: kierunek PL → JP
    const front = rev ? `<div class="fpl">${esc(c.back)}</div>` : `<div class="fjp">${ruby(c.front)}</div>`;
    const back = rev ? `<div class="fjp">${ruby(c.front)}</div><div class="muted small">${esc(c.sub)}</div>` : `<div class="fpl">${esc(c.back)}</div><div class="muted small">${esc(c.sub)}</div>`;
    app().innerHTML = `<div class="quiz"><div class="qhead"><a class="btn sm" href="#/">✕</a><div class="prog"><i style="width:${100 * i / keys.length}%"></i></div><span class="small muted">${i + 1}/${keys.length}</span></div>
      <div class="card flash"><div>${front}${flipped ? `<hr style="border:none;border-top:1px solid var(--line)">${back}` : `<p class="muted small">${rev ? "Jak to powiesz po japońsku? Pomyśl, potem kliknij." : "Co to znaczy? Pomyśl, potem kliknij."}</p>`}</div></div>
      <div class="row" style="justify-content:center;margin-top:12px">${flipped ? `<button class="btn r0" style="border-color:var(--bad)">✗ Nie pamiętam</button><button class="btn r1">😐 Trudne</button><button class="btn r2" style="border-color:var(--ok)">✓ Umiem</button>` : `<button class="btn pri show">Pokaż odpowiedź</button>`} ${c.say ? `<button class="btn sp">🔊</button>` : ""}</div></div>`;
    const flip = () => { flipped = true; if (c.say) TTS.speak(c.say); draw(); };
    if (!flipped) { $(".flash").onclick = flip; $(".show").onclick = flip; if (!rev && c.say && S.settings.autoplay && k[0] === "v") TTS.speak(c.say); }
    const sp = $(".sp"); if (sp) sp.onclick = () => TTS.speak(c.say);
    const grade = g => {
      const s = S.srs[k];
      if (g === 0) s.box = 0; else if (g === 1) s.box = Math.max(1, s.box); else { s.box = Math.min(6, s.box + 1); good++; }
      s.due = Date.now() + (g === 0 ? 60 * 1000 : INTERVALS[s.box] * 86400000 - 3600000);
      if (g === 0) keys.push(k);
      saveState(); i++; flipped = false; draw();
    };
    if (flipped) { $(".r0").onclick = () => grade(0); $(".r1").onclick = () => grade(1); $(".r2").onclick = () => grade(2); }
  }
  draw();
}
