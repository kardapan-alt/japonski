<style>:root{
  --bg:#faf7f2; --bg2:#ffffff; --bg3:#f1ece4; --fg:#22201c; --fg2:#5d574e; --line:#e3dccf;
  --accent:#d62828; --ok:#2a9d5c; --okbg:#e3f5ea; --bad:#d1495b; --badbg:#fbe6e8; --warn:#e9a23b;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06); --r:14px;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic","Meiryo","MS Gothic",sans-serif;
  --jpserif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP","MS Mincho",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#17161a; --bg2:#212026; --bg3:#2b2a31; --fg:#efece6; --fg2:#a9a39a; --line:#38363e; --okbg:#173a28; --badbg:#41202a; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);}
}
:root[data-theme="dark"]{--bg:#17161a; --bg2:#212026; --bg3:#2b2a31; --fg:#efece6; --fg2:#a9a39a; --line:#38363e; --okbg:#173a28; --badbg:#41202a; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,var(--jp);-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.jp,ruby,.jpt{font-family:var(--jp)}
rt{font-size:.55em;color:var(--fg2);font-weight:normal}
body.nofuri rt{display:none}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;text-decoration:none;display:flex;align-items:center;gap:8px;font-size:18px;white-space:nowrap}
.logo .hanko{background:var(--accent);color:#fff;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;font-family:var(--jpserif);font-size:20px}
.topin .sp{flex:1}
.tbtn{background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;text-decoration:none;white-space:nowrap}
.tbtn.on{background:var(--fg);color:var(--bg)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;line-height:20px;text-align:center;margin-left:4px}
main{max-width:980px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:26px;margin:.2em 0 .4em;line-height:1.25}
h2{font-size:21px;margin:1.2em 0 .5em}
h3{font-size:18px;margin:1em 0 .4em}
h4{margin:1em 0 .3em}
.muted{color:var(--fg2)}
.small{font-size:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:10px 16px;font-weight:600;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--fg2)}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.dark{background:var(--fg);color:var(--bg);border-color:transparent}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ib{border:none;background:var(--bg3);border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;font-size:16px;flex:none;vertical-align:middle}
.ib:hover{filter:brightness(.95)}
.ib.rec{background:#ffe1e1}
.ib.rec.live{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.hero{display:grid;gap:16px;grid-template-columns:1.4fr 1fr;align-items:stretch}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--bg3);border-radius:12px;padding:10px 12px}
.stat b{font-size:22px;display:block}
.lvl{position:relative;overflow:hidden;text-decoration:none;display:block}
.lvl .bar{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.lvl .big{font-family:var(--jpserif);font-size:30px;font-weight:700;color:var(--c)}
.prog{height:8px;border-radius:99px;background:var(--bg3);overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--c,var(--ok));border-radius:99px;transition:width .4s}
.lesson-list{display:grid;gap:10px}
.li{display:flex;gap:12px;align-items:center;text-decoration:none;padding:12px 14px}
.li .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bg3);font-weight:700;flex:none}
.li.done .num{background:var(--ok);color:#fff}
.li .t{flex:1;min-width:0}
.li .t b{display:block}
.li .sc{font-size:13px;color:var(--fg2);white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:12px 0 16px;scrollbar-width:thin}
.tab{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:8px 14px;white-space:nowrap;text-decoration:none;font-size:15px}
.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.crumbs{font-size:14px;color:var(--fg2);margin-bottom:6px}
.crumbs a{text-decoration:none}
.goal{border-left:4px solid var(--c,var(--accent));background:var(--bg3);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.gp{margin:14px 0}
.gp .pat{display:inline-block;font-family:var(--jp);background:var(--bg3);border:1px dashed var(--line);border-radius:8px;padding:4px 10px;margin:4px 0 8px;font-weight:600}
.ex-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.ex-list li{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;background:var(--bg3);border-radius:10px}
.ex-list .txt{flex:1;min-width:0}
.ex-list .jpl{font-family:var(--jp);font-size:19px;line-height:2}
.ex-list .pl{color:var(--fg2);font-size:15px}
body.hidepl .pl.hid{filter:blur(5px);cursor:pointer}
table.voc{width:100%;border-collapse:collapse}
table.voc td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.voc td:not(.a){overflow-wrap:anywhere}
table.voc .w{font-family:var(--jp);font-size:20px}
table.voc .r{font-size:13px;color:var(--fg2)}
table.voc td.a{white-space:nowrap;text-align:right;width:80px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kc{text-align:center;cursor:pointer;padding:12px}
.kc .k{font-family:var(--jpserif);font-size:56px;line-height:1.1}
.kc .m{font-weight:600;font-size:14px}
.kc .rd{font-size:12px;color:var(--fg2);font-family:var(--jp)}
.kana-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px}
.kana-grid.w3{grid-template-columns:repeat(3,1fr);max-width:330px}
.kcell{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer;min-height:70px}
.kcell:hover{border-color:var(--accent)}
.kcell .ch{font-family:var(--jp);font-size:30px;line-height:1.2}
.kcell .ro{font-size:12px;color:var(--fg2)}
.kcell.empty{visibility:hidden}
.charcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cc{display:flex;gap:12px;align-items:center;cursor:pointer}
.cc .ch{font-family:var(--jp);font-size:46px;width:70px;text-align:center;flex:none;line-height:1}
.cc .ro{font-weight:700}
.cc .mn{font-size:13px;color:var(--fg2)}
/* quiz */
.quiz{max-width:720px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qhead .prog{flex:1;margin:0;height:10px}
.qcard{padding:20px}
.qtype{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);margin-bottom:6px}
.qq{font-size:20px;line-height:2;font-family:var(--jp)}
.qq.bigjp{font-size:34px;text-align:center}
.qtr{color:var(--fg2);margin-top:2px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;border:2px solid var(--line);background:var(--bg2);border-radius:12px;padding:12px 14px;font-size:17px;font-family:var(--jp);line-height:1.8}
.opt:hover:not(:disabled){border-color:var(--fg2)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.listenbig{display:flex;justify-content:center;gap:12px;margin:10px 0}
.listenbig button{width:78px;height:78px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:30px}
.listenbig button.slow{background:var(--bg3);color:var(--fg);font-size:24px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:12px}
.tiles.ans{border:2px dashed var(--line);background:var(--bg3)}
.tile{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:6px 12px;font-family:var(--jp);font-size:18px;line-height:1.9;box-shadow:0 2px 0 var(--line)}
.tinput{width:100%;font:22px var(--jp);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--fg)}
.tinput:focus{outline:none;border-color:var(--fg2)}
.tinput.ok{border-color:var(--ok);background:var(--okbg)}
.tinput.bad{border-color:var(--bad);background:var(--badbg)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.match .col{display:grid;gap:8px;align-content:start}
.mbtn{border:2px solid var(--line);background:var(--bg2);border-radius:12px;padding:10px;font-family:var(--jp);font-size:16px;line-height:1.8;min-height:52px}
.mbtn.sel{border-color:var(--accent)}
.mbtn.done{border-color:var(--ok);background:var(--okbg);opacity:.6}
.mbtn.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:16px;border-radius:12px;padding:12px 14px}
.fb.ok{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb .h{font-weight:700;margin-bottom:4px}
.fb .jpline{font-family:var(--jp);font-size:18px;line-height:2}
.qnav{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.result{text-align:center;padding:30px 20px}
.result .pct{font-size:56px;font-weight:800}
/* stage */
.stage{background:linear-gradient(180deg,#cfe8f7 0%,#f6f1e6 70%,#e9dcc4 100%);border-radius:var(--r);padding:16px;min-height:300px;position:relative;overflow:hidden;color:#22201c}
:root[data-theme="dark"] .stage{background:linear-gradient(180deg,#22324a 0%,#2b2a31 70%,#3a3226 100%);color:#efece6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stage{background:linear-gradient(180deg,#22324a 0%,#2b2a31 70%,#3a3226 100%);color:#efece6}}
.actors{display:flex;justify-content:space-around;align-items:flex-end;gap:10px;margin-top:8px}
.actor{text-align:center;transition:transform .3s,opacity .3s;opacity:.65;flex:1;max-width:180px}
.actor.talk{opacity:1;transform:translateY(-6px) scale(1.05)}
.actor svg{width:96px;height:110px}
.actor .nm{font-family:var(--jp);font-weight:700}
.actor .mouth{transform-origin:50px 74px;transform-box:view-box}
.actor.talk .mouth{animation:talk .22s infinite alternate}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.3)}}
.subs{min-height:96px;text-align:center;margin-top:8px}
.subs .sj{font-family:var(--jp);font-size:22px;line-height:2.1;background:rgba(255,255,255,.75);display:inline-block;padding:2px 12px;border-radius:10px}
:root[data-theme="dark"] .subs .sj{background:rgba(0,0,0,.45)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .subs .sj{background:rgba(0,0,0,.45)}}
.subs .sp{font-size:15px;margin-top:4px;opacity:.85}
.subs .yt{font-weight:800;color:var(--accent);font-size:18px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.ctrl select,.ctrl input[type=range]{font:inherit}
select,input[type=text],input[type=search]{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit}
.script{display:grid;gap:6px;margin-top:10px}
.sline{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);cursor:pointer}
.sline.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.sline .who{font-family:var(--jp);font-weight:700;min-width:64px}
.sline .jpl{font-family:var(--jp);font-size:17px;line-height:2}
.sline .pl{font-size:14px;color:var(--fg2)}
.film{display:grid;place-items:center;text-align:center;min-height:320px}
.film .fc{font-family:var(--jp);font-size:150px;line-height:1;animation:pop .5s}
.film .fr{font-size:30px;font-weight:800}
.film .fm{max-width:520px;margin:6px auto}
.film .fw{font-family:var(--jp);font-size:24px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--bg2);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:92vh;overflow:auto;position:relative}
.modal .x{position:absolute;right:10px;top:10px}
.trace{position:relative;width:min(300px,78vw);height:min(300px,78vw);margin:10px auto;border-radius:14px;background:var(--bg3);overflow:hidden;touch-action:none}
.trace .gh{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--jp);color:color-mix(in srgb,var(--fg) 14%,transparent);pointer-events:none;line-height:1}
.trace canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.trace{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.modal{overscroll-behavior:contain}
.trace .grid-l{position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat,linear-gradient(90deg,var(--line),var(--line)) center/1px 100% no-repeat}
.flash{min-height:260px;display:grid;place-items:center;text-align:center;cursor:pointer;perspective:800px}
.flash .fjp{font-family:var(--jp);font-size:42px;line-height:1.8}
.flash .fpl{font-size:22px;font-weight:600}
.hint{background:var(--bg3);border-radius:10px;padding:10px 12px;font-size:14px}
.warnbox{background:#fff4dc;color:#5a4100;border:1px solid #f0d58e;border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:15px;box-shadow:var(--shadow);max-width:90vw}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--bg3);font-size:12px;color:var(--fg2)}
.search-res{display:grid;gap:6px;margin-top:12px}
.sr{display:flex;gap:10px;align-items:center;padding:8px 12px}
.sr .w{font-family:var(--jp);font-size:19px;min-width:120px}
footer{max-width:980px;margin:0 auto;padding:20px 16px 40px;color:var(--fg2);font-size:13px}
@media (max-width:560px){
  h1{font-size:22px}
  .qq{font-size:18px}
  .topin .tlabel{display:none}
  table.voc .w{font-size:18px}
  .ex-list .jpl{font-size:17px}
}
.ctrl select{max-width:100%}
a.sr{text-decoration:none}
.sr{flex-wrap:wrap}
.sr .w{min-width:0}
#q{max-width:100%}
table.voc td.a{width:124px}

.plan .pstep{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.plan .pstep>span:last-child{display:flex;flex-direction:column;min-width:0}
.plan .pnum{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent);color:#fff}
.plan .pstep.done .pnum{background:var(--ok)}
.plan .pstep.done b{color:var(--fg2)}
.script.story .sline{cursor:pointer}
.script.story .pl.hid{display:none}
.kc .k{position:relative}.kok{position:absolute;top:-4px;right:-10px;font-size:12px;color:var(--ok)}
</style></head><body>
<header class="top"><div class="topin"><a class="logo" href="#/"><span class="hanko">日</span><span class="tlabel">Nauka japońskiego</span></a><span class="sp"></span>

const HAS_JP = /[぀-ヿ一-鿿]/;

function wordMarkup(w, r) { return (w !== r && HAS_KANJI.test(w)) ? `{${w}|${r}}` : w; }

/* ===================== kana ↔ romaji ===================== */
const K2H = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));

const ROMA = {
  "あ":"a","い":"i","う":"u","え":"e","お":"o","か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko","さ":"sa","し":"shi","す":"su","せ":"se","そ":"so",
  "た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to","な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no","は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho",
  "ま":"ma","み":"mi","む":"mu","め":"me","も":"mo","や":"ya","ゆ":"yu","よ":"yo","ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro","わ":"wa","ゐ":"wi","ゑ":"we","を":"o","ん":"n",

const ROMA2 = {
  "きゃ":"kya","きゅ":"kyu","きょ":"kyo","しゃ":"sha","しゅ":"shu","しょ":"sho","ちゃ":"cha","ちゅ":"chu","ちょ":"cho","にゃ":"nya","にゅ":"nyu","にょ":"nyo",

  "じゃ":"ja","じゅ":"ju","じょ":"jo","ぢゃ":"ja","ぢゅ":"ju","ぢょ":"jo","びゃ":"bya","びゅ":"byu","びょ":"byo","ぴゃ":"pya","ぴゅ":"pyu","ぴょ":"pyo",

};
const MACRON = { a: "ā", i: "ī", u: "ū", e: "ē", o: "ō" };
function toRomaji(s) {
  s = K2H(reading(s));
  let out = "", i = 0;
  while (i < s.length) {
    const two = s.substr(i, 2), c = s[i];
    if (ROMA2[two]) { out += ROMA2[two]; i += 2; continue; }
    if (c === "っ") {
      const nx = ROMA2[s.substr(i + 1, 2)] || ROMA[s[i + 1]];
      if (nx) out += nx[0] === "c" ? "t" : nx[0];
      i++; continue;
    }
    if (c === "ー") { const v = out.slice(-1); if (MACRON[v]) out = out.slice(0, -1) + MACRON[v]; else out += "-"; i++; continue; }
    if (c === "ん") { const nx = ROMA[s[i + 1]] || ""; out += /^[aiueoy]/.test(nx) ? "n'" : "n"; i++; continue; }
    if (ROMA[c]) out += ROMA[c]; else out += c === "。" ? ". " : c === "、" ? ", " : c;
    i++;
  }

}
// romaji → hiragana (prosty IME)
const R2K = {};
(function () {
  for (const [k, v] of Object.entries(ROMA)) if (!"ぁぃぅぇぉゃゅょゎゐゑを".includes(k)) R2K[v] = R2K[v] || k;
  for (const [k, v] of Object.entries(ROMA2)) R2K[v] = R2K[v] || k;
  Object.assign(R2K, {
    "wo":"を","si":"し","ti":"ち","tu":"つ","hu":"ふ","zi":"じ","di":"ぢ","du":"づ","jya":"じゃ","jyu":"じゅ","jyo":"じょ","sya":"しゃ","syu":"しゅ","syo":"しょ",
    "tya":"ちゃ","tyu":"ちゅ","tyo":"ちょ","cya":"ちゃ","cyu":"ちゅ","cyo":"ちょ","zya":"じゃ","zyu":"じゅ","zyo":"じょ","ca":"か","cu":"く","co":"こ",
    "xa":"ぁ","xi":"ぃ","xu":"ぅ","xe":"ぇ","xo":"ぉ","la":"ぁ","li":"ぃ","lu":"ぅ","le":"ぇ","lo":"ぉ","xya":"ゃ","xyu":"ゅ","xyo":"ょ","lya":"ゃ","lyu":"ゅ","lyo":"ょ",
    "xtu":"っ","ltu":"っ","xtsu":"っ","nn":"ん","n'":"ん","ti":"ち","thi":"てぃ","dhi":"でぃ","fa":"ふぁ","fi":"ふぃ","fe":"ふぇ","fo":"ふぉ","va":"ゔぁ","vi":"ゔぃ","vu":"ゔ","ve":"ゔぇ","vo":"ゔぉ",
    "a":"あ","i":"い","u":"う","e":"え","o":"お","-":"ー"
  });
})();
function romajiToKana(src, final) {
  let s = src.replace(/[āĀ]/g, "aa").replace(/[īĪ]/g, "ii").replace(/[ūŪ]/g, "uu").replace(/[ēĒ]/g, "ee").replace(/[ōŌ]/g, "ou");
  let out = "", i = 0;
  while (i < s.length) {
    const ch = s[i], lc = ch.toLowerCase();
    if (!/[a-z'\-]/.test(lc)) { out += ch; i++; continue; }
    if (lc === "-") { out += "ー"; i++; continue; }
    const nx = (s[i + 1] || "").toLowerCase();
    // podwójna spółgłoska → っ
    if (lc === nx && /[bcdfghjkmpqrstvwxyz]/.test(lc)) { out += "っ"; i++; continue; }
    if (lc === "t" && nx === "c") { out += "っ"; i++; continue; }
    if (lc === "n") {
      if (nx === "n") { const n2 = (s[i + 2] || "").toLowerCase(); if (/[aiueoy]/.test(n2)) { out += "ん"; i++; } else { out += "ん"; i += 2; } continue; }

      if (nx && !/[aiueoy]/.test(nx)) { out += "ん"; i++; continue; }
      if (!nx) { out += final ? "ん" : "n"; i++; continue; }
    }
    let matched = false;
    for (let L = 4; L >= 1; L--) {
      const part = s.substr(i, L).toLowerCase();
      if (part.length === L && R2K[part]) { out += R2K[part]; i += L; matched = true; break; }
    }
    if (!matched) {
      // niedokończony fragment – zostaw jako łacinkę
      if (!final) { out += s.slice(i); break; }
      out += ch; i++;
    }
  }
  return out;
}
const VOWEL_KANA = { a: "あ", i: "い", u: "う", e: "え", o: "お" };
function longVowels(s) {
  // ー → samogłoska poprzedniej sylaby; おう → おお, えい → ええ (tylko do porównywania odpowiedzi)
  let out = "";
  for (const c of s) {
    const prev = out.slice(-1), v = prev && ROMA[prev] ? ROMA[prev].slice(-1) : "";
    if (c === "ー" && v) out += VOWEL_KANA[v];
    else if (c === "う" && v === "o") out += "お";
    else if (c === "い" && v === "e") out += "え";
    else out += c;
  }
  return out;
}
function normAnswer(s) {
  return longVowels(K2H(plain(String(s))).replace(/を/g, "お").toLowerCase().replace(/[\s。、．，.,!?！？「」『』・〜～…]/g, "").replace(/ō/g, "ou").replace(/ā/g, "aa").replace(/ū/g, "uu").replace(/ī/g, "ii").replace(/ē/g, "ee").replace(/'/g, ""));
}

const STORE = "nauka-japonskiego-v1";
let S;
function loadState() {
  try { S = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { S = null; }
  S = Object.assign({ xp: 0, streak: { last: "", count: 0 }, lessons: {}, srs: {}, exams: {}, daily: {}, mist: {}, settings: {} }, S || {});
  S.settings = Object.assign({ rate: 0.9, voice: "", romaji: true, furi: {}, theme: "auto", hidepl: false, autoplay: true }, S.settings);
}
function saveState() { S.t = Date.now(); try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { } if (window.CloudSync) CloudSync.push(); }
function addXP(n) {
  S.xp += n;
  const d = today();
  S.daily[d] = (S.daily[d] || 0) + n;
  if (S.streak.last !== d) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    const yd = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
    S.streak.count = S.streak.last === yd ? S.streak.count + 1 : 1;
    S.streak.last = d;
  }
  saveState();
}

  setTimeout(() => t.remove(), ms);
}

/* ===================== mowa: synteza ===================== */
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const ANDROID = /Android/.test(navigator.userAgent);
const TTS = {
  ok: "speechSynthesis" in window, voices: [], ready: false,
  init() {
    if (!this.ok) return;
    const rank = v => /^(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\b/i.test(v.name) ? 2 : /kyoko|o-ren|otoya|hattori|haruka|nanami|google/i.test(v.name) ? 0 : 1;
    const load = fin => {
      const all = speechSynthesis.getVoices();
      this.voices = all.filter(v => /^ja/i.test(v.lang) || /japan|日本/i.test(v.name)).sort((a, b) => rank(a) - rank(b) || (b.localService - a.localService));
      if (all.length || fin === true) this.ready = true; // Android ładuje głosy z opóźnieniem – nie ostrzegaj za wcześnie
      document.dispatchEvent(new Event("voices"));
    };
    load();
    speechSynthesis.onvoiceschanged = () => load(true);
    setTimeout(() => load(true), 2500);
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) { } // iPhone: głos także przy wyciszonym telefonie
  },
  pickVoice(gender) {
    if (!this.voices.length) return null;
    const pref = this.voices.find(v => v.name === S.settings.voice);
    if (!gender || this.voices.length < 2) return pref || this.voices[0];
    const male = /otoya|hattori|ichiro|keita|daichi|naoki|takumi|male|男/i, female = /kyoko|haruka|nanami|ayumi|sayaka|mizuki|o-ren|female|女|google/i;
    const want = this.voices.filter(v => gender === "m" ? male.test(v.name) : (female.test(v.name) && !male.test(v.name)));
    return want[0] || pref || this.voices[0];
  },
  speak(text, o = {}) {
    return new Promise(res => {
      if (!this.ok) { noVoiceWarn(); return res(); }
      if (!o.queue) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP";
      const v = this.pickVoice(o.gender);
      if (v) u.voice = v;
      const rate = (o.rate || S.settings.rate) * (o.slow ? 0.65 : 1);
      u.rate = rate;
      u.pitch = o.gender === "m" ? 0.85 : o.gender === "f" ? 1.15 : 1;
      let done = false;
      const fin = () => { if (!done) { done = true; clearTimeout(tm); o.onend && o.onend(); res(); } };
      u.onend = fin;
      u.onerror = e => { if (!/interrupted|canceled/.test(e && e.error || "") && !TTS.errWarned) { TTS.errWarned = true; toast("Głos nie zadziałał. Bez internetu potrzebny jest pobrany japoński głos – instrukcja w Ustawieniach." + (IOS ? " Na iPhonie sprawdź też, czy nie jest włączony tryb cichy." : ""), 6000); } fin(); };
      const tm = setTimeout(fin, 1500 + text.length * 420 / rate);
      o.onstart && (u.onstart = o.onstart);
      speechSynthesis.speak(u);
      if (IOS && !S.settings.iosHint) { S.settings.iosHint = 1; saveState(); toast("Nie słychać głosu? Wyłącz tryb cichy w iPhonie.", 4500); }
      if (!this.voices.length) noVoiceWarn();
    });
  },
  stop() { if (this.ok) speechSynthesis.cancel(); }
};
let warnedVoice = false;
function noVoiceWarn() {
  if (warnedVoice) return; warnedVoice = true;
  if (!TTS.ok) toast("Ta przeglądarka nie obsługuje syntezy mowy. Użyj Chrome, Edge lub Safari.", 5000);
  else if (TTS.ready && !TTS.voices.length) toast("Nie znaleziono japońskiego głosu – zajrzyj do Ustawień.", 5000);
}
// tekst do przeczytania: zdanie z kanji (lepsza intonacja), pojedyncze słowo – czytanie w kana
function sayText(s) { return plain(s).replace(/[＿_]{2,}/g, "…"); }
function say(s, o) { return TTS.speak(sayText(s), o); }

/* ===================== mowa: rozpoznawanie ===================== */
const SRec = window.SpeechRecognition || window.webkitSpeechRecognition;
function listenOnce() {
  return new Promise((res, rej) => {
    if (!SRec) return rej(new Error("nosr"));
    const r = new SRec();
    r.lang = "ja-JP"; r.interimResults = false; r.maxAlternatives = 5;
    let got = false;
    r.onresult = e => { got = true; res([...e.results[0]].map(a => a.transcript)); };
    r.onerror = e => rej(e);
    r.onend = () => { if (!got) rej(new Error("nospeech")); };
    r.start();
  });
}
function similarity(a, b) {
  if (!a.length && !b.length) return 1;
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return 1 - d[m][n] / Math.max(m, n);
}
async function checkSpeech(target, btn) {
  if (!SRec) { toast("Rozpoznawanie mowy działa w Chrome/Edge (komputer i Android) oraz Safari. Tu go nie ma – powtarzaj na głos i porównuj ze wzorem 🔊."); return; }
  if (navigator.onLine === false) { toast("Sprawdzanie wymowy 🎤 potrzebuje internetu. Bez sieci słuchaj 🔊 i powtarzaj na głos.", 4500); return; }
  TTS.stop();
  btn && btn.classList.add("live");
  try {
    const alts = await listenOnce();
    const t1 = normAnswer(plain(target)), t2 = normAnswer(reading(target));
    let best = 0, heard = alts[0];
    for (const a of alts) { const n = normAnswer(a); const s = Math.max(similarity(n, t1), similarity(n, t2)); if (s > best) { best = s; heard = a; } }
    const pct = Math.round(best * 100);
    const msg = pct >= 85 ? "🎉 Świetnie!" : pct >= 60 ? "👍 Prawie dobrze" : "🔁 Spróbuj jeszcze raz";
    toast(`${msg} (${pct}%)<br><span class="jp">Usłyszałem: ${esc(heard)}</span>`, 4000);
    if (pct >= 85) addXP(2);
    return pct;
  } catch (e) {
    const er = e && e.error;
    toast(er === "not-allowed" ? "Zezwól stronie na użycie mikrofonu." : er === "network" ? "Sprawdzanie wymowy potrzebuje internetu – powtarzaj na głos ze wzorem 🔊." : er === "service-not-allowed" || er === "language-not-supported" ? (IOS ? "Włącz Dyktowanie: Ustawienia → Ogólne → Klawiatura." : "Ta przeglądarka nie obsługuje rozpoznawania mowy po japońsku.") : er === "audio-capture" ? "Mikrofon jest zajęty albo niedostępny." : "Nic nie usłyszałem – spróbuj jeszcze raz, mów wyraźnie.", 4500);
  } finally { btn && btn.classList.remove("live"); }
}
// przyciski 🔊 / 🎤 w HTML – dane trzymamy w rejestrze
const SAY = [];
function sayBtn(text, o = {}) { SAY.push({ text, o }); return `<button class="ib" title="Posłuchaj" data-say="${SAY.length - 1}">🔊</button>`; }
function recBtn(text) { SAY.push({ text }); return SRec ? `<button class="ib rec" title="Powiedz i sprawdź wymowę" data-rec="${SAY.length - 1}">🎤</button>` : ""; }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if (b) { const it = SAY[+b.dataset.say]; if (it) (it.o.raw ? TTS.speak(it.text, it.o) : say(it.text, it.o)); return; }
  const r = e.target.closest("[data-rec]");
  if (r) { const it = SAY[+r.dataset.rec]; if (it) checkSpeech(it.text, r); return; }
  const h = e.target.closest(".pl.hid");
  if (h) h.classList.remove("hid");
});

// Polski zapis przybliżonej wymowy: si = ś (jak w „siwy”), ci = ć, dzi = dź, cu, ja/ju/jo, ła
const PL = Object.assign({}, ROMA, {
  "し":"si","ち":"ci","つ":"cu","じ":"dzi","ぢ":"dzi","づ":"zu","や":"ja","ゆ":"ju","よ":"jo","わ":"ła","を":"o","ゃ":"ja","ゅ":"ju","ょ":"jo","ゎ":"ła","ゔ":"wu"

const PL2 = {
  "きゃ":"kia","きゅ":"kiu","きょ":"kio","しゃ":"sia","しゅ":"siu","しょ":"sio","ちゃ":"cia","ちゅ":"ciu","ちょ":"cio","にゃ":"nia","にゅ":"niu","にょ":"nio",
  "ひゃ":"hia","ひゅ":"hiu","ひょ":"hio","みゃ":"mia","みゅ":"miu","みょ":"mio","りゃ":"ria","りゅ":"riu","りょ":"rio","ぎゃ":"gia","ぎゅ":"giu","ぎょ":"gio",
  "じゃ":"dzia","じゅ":"dziu","じょ":"dzio","ぢゃ":"dzia","ぢゅ":"dziu","ぢょ":"dzio","びゃ":"bia","びゅ":"biu","びょ":"bio","ぴゃ":"pia","ぴゅ":"piu","ぴょ":"pio",
  "ふぁ":"fa","ふぃ":"fi","ふぇ":"fe","ふぉ":"fo","てぃ":"ti","でぃ":"di","とぅ":"tu","どぅ":"du","うぃ":"łi","うぇ":"łe","うぉ":"ło","しぇ":"sie","ちぇ":"cie","じぇ":"dzie",
  "ゔぁ":"wa","ゔぃ":"wi","ゔぇ":"we","ゔぉ":"wo","いぇ":"je","つぁ":"ca"
};
function toPolish(s) {
  let k = K2H(reading(s));
  k = k.replace(/(こんにち|こんばん)は/g, "$1わ");
  let out = "", i = 0;
  while (i < k.length) {
    const two = k.substr(i, 2), c = k[i];
    if (PL2[two]) { out += PL2[two]; i += 2; continue; }
    if (c === "っ") { const nx = PL2[k.substr(i + 1, 2)] || PL[k[i + 1]] || ""; out += nx.startsWith("c") ? "t" : nx.startsWith("dz") ? "d" : (nx[0] || ""); i++; continue; }
    if (c === "ー") { const v = out.slice(-1); out += /[aiueo]/.test(v) ? v : ""; i++; continue; }
    if (c === "ん") { const nx = PL[k[i + 1]] || ""; out += /^[aiueoj]/.test(nx) ? "n'" : /^[bpm]/.test(nx) ? "m" : "n"; i++; continue; }
    out += PL[c] !== undefined ? PL[c] : (c === "。" ? ". " : c === "、" ? ", " : c);
    i++;
  }
  return out.replace(/ou(?![aiueo])/g, "oo").replace(/ei(?![aiueo])/g, "ee").replace(/\s+/g, " ").trim();
}
// podział na mory (sylaby rytmiczne)
function morae(s) {
  const k = reading(s), out = [];
  for (const c of k) {
    if (/[ゃゅょぁぃぅぇぉャュョァィゥェォ]/.test(c) && out.length) out[out.length - 1] += c;
    else if (c === "ー" && out.length) out[out.length - 1] += c;
    else if (/[぀-ヿ]/.test(c)) out.push(c);
  }
  return out;
}
// wskazówki wymowy dla trudnych dźwięków

<h4>2. Pauza (małe っ) – trwa 1 klaśnięcie ciszy</h4>

  grammar: [
    { title: "Forma ない – przeczenie w formie prostej",
      pattern: "U: -u → -a + ない (う → わない) · RU: る → ない · する → しない · 来る → 来ない (こない)",
      explain: "Forma słownikowa ({食|た}べる, {行|い}く) to prosty odpowiednik ～ます, a forma <b>ない</b> – odpowiednik ～ません.<br><b>Grupa RU</b>: odcinasz る i dodajesz ない: {食|た}べる → {食|た}べない, {見|み}る → {見|み}ない.<br><b>Grupa U</b>: ostatnie -u zamieniasz na -a i dodajesz ない: {書|か}く → {書|か}かない, {飲|の}む → {飲|の}まない, {待|ま}つ → {待|ま}たない, {話|はな}す → {話|はな}さない. Czasowniki na う dostają <b>わ</b>: {買|か}う → {買|か}わない (nie ×かあない).<br><b>Nieregularne</b>: する → しない, {来|く}る → {来|こ}ない (czytaj <i>konai</i>!). Wyjątek: ある → <b>ない</b>.<br>Pułapka: {帰|かえ}る, {入|はい}る, {知|し}る, {走|はし}る wyglądają jak grupa RU, ale należą do U: {帰|かえ}らない.",
      examples: [
        ["{今日|きょう}は{家|うち}に{帰|かえ}らない。","Dziś nie wracam do domu."],
        ["{私|わたし}はお{酒|さけ}を{飲|の}まない。","Nie piję alkoholu."],
        ["{山田|やまだ}さんは{来|こ}ない。","Pan Yamada nie przyjdzie."],
        ["お{金|かね}がない。","Nie mam pieniędzy."],
        ["{新聞|しんぶん}は{買|か}わない。","Gazet nie kupuję."]

      explain: "W formie prostej znika です. Przymiotnik <b>い</b> zostaje sam: {高|たか}いです → {高|たか}い; przeczenie: {高|たか}くない (いい → <b>よくない</b>). Przymiotnik <b>な</b> i rzeczownik dostają <b>だ</b> zamiast です: {静|しず}かだ, {学生|がくせい}だ; przeczenie: じゃない (w piśmie ではない).<br>Częsty błąd: ×{高|たか}いだ – przymiotnik い nigdy nie dostaje だ. W rozmowie だ na końcu zdania często się opuszcza („きれい！”, „{学生|がくせい}？”), ale zostaje przed よ i ね u mężczyzn: {学生|がくせい}だよ.",
      examples: [

    { title: "Mowa potoczna: うん / ううん, pytania bez か",

      explain: "Wśród przyjaciół i w rodzinie mówisz formą prostą. Zamiast はい/いいえ używasz <b>うん</b> (tak) i <b>ううん</b> (nie) – uważaj, brzmią podobnie, a znaczą odwrotnie! Pytanie tworzysz bez か, tylko intonacją rosnącą: {行|い}く？ (Idziesz?). Samo か na końcu formy prostej brzmi szorstko. Rzeczownik i przymiotnik な w pytaniu tracą だ: {元気|げんき}？ (nie ×{元気|げんき}だ？). Partykuły は, を często znikają: {映画|えいが}、{見|み}る？ Zaproszenie robisz formą ～ない？ ({行|い}かない？ = Może pójdziemy?). Do nauczyciela, szefa czy obcych tak nie mów!",

      examples: [

    { title: "～なければいけません / なりません – muszę",
      pattern: "V-ない → ～なければいけません / ～なければなりません",
      explain: "„Muszę, trzeba”. Bierzesz formę ない, odcinasz い i dodajesz <b>ければいけません</b>: {行|い}かない → {行|い}かなければいけません. Dosłownie: „jeśli nie pójdę, to niedobrze” – podwójne przeczenie daje przymus. ～なければいけません to raczej konieczność wynikająca z sytuacji, ～なければなりません – obowiązek ogólny, przepisy (częściej w piśmie); w praktyce są wymienne. Forma prosta: ～なければいけない. Przeszłość: ～なければいけませんでした (musiałem). Przeciwieństwo, „nie trzeba”: ～なくてもいいです.",

  grammar: [
    { title: "Forma potencjalna – mogę, umiem",

  grammar: [
    { title: "～がほしい – chcę (mieć) coś",
      pattern: "N + がほしいです / ほしくないです / ほしかったです",
      explain: "„Chcę coś mieć”. Przedmiot oznaczasz <b>が</b>. ほしい odmienia się jak przymiotnik い: ほしくない, ほしかった. Podobnie jak たい, mówi tylko o <b>twoim</b> pragnieniu (lub pyta rozmówcę). Rozróżniaj: rzecz + がほしい, czynność + たい: {車|くるま}がほしい, ale {車|くるま}を{買|か}いたい.",
      examples: [
        ["{新|あたら}しいパソコンがほしいです。","Chcę nowy komputer."],
        ["{誕生日|たんじょうび}に{何|なに}がほしい？","Co chcesz na urodziny?"],
        ["{子|こ}どものとき、{犬|いぬ}がほしかった。","Jako dziecko chciałem psa."],
        ["{今|いま}は{何|なに}もほしくないです。","Teraz niczego nie chcę."]

    { title: "～てほしい – chcę, żeby ktoś…",

        ["{彼|かれ}にもっと{早|はや}く{連絡|れんらく}してほしかった。","Chciałam, żeby wcześniej się do mnie odezwał."],

      examples: [

        ["{父|ちち}は{大|おお}きい{車|くるま}をほしがっていました。","Tata chciał duży samochód."]

    { title: "～かもしれません – może, być może",
      pattern: "forma prosta + かもしれません (rzecz., na-przym. bez だ) · potocznie: ～かも",
      explain: "„Może, być może” – mniejsza pewność niż でしょう. Przed かもしれません stoi forma prosta, ale rzeczownik i przymiotnik な <b>bez だ</b>: {雨|あめ}かもしれません, {暇|ひま}かもしれない. Forma prosta: かもしれない, a w luźnej rozmowie samo <b>かも</b>. Skala pewności: きっと～でしょう > たぶん～でしょう > ～かもしれません.",
      examples: [

    { title: "あげる・くれる・もらう – dawać i dostawać",
      pattern: "A は B に N をあげる · (B が) 私に N をくれる · 私は B に/から N をもらう",
      explain: "Japoński rozróżnia <b>kierunek</b> dawania. <b>あげる</b> – dawanie „na zewnątrz”: ja (lub ktoś) daję komuś innemu: {私|わたし}は{妹|いもうと}に{本|ほん}をあげました. <b>くれる</b> – ktoś daje <i>mnie</i> lub komuś z mojej grupy (rodzina): {友|とも}だちが{花|はな}をくれました. Nigdy ×{友|とも}だちが{私|わたし}にあげました! <b>もらう</b> – otrzymywać, z perspektywy odbiorcy; dawca dostaje に lub から: {友|とも}だちに/から{花|はな}をもらいました. Przy くれる słowo {私|わたし}に zwykle się pomija.",
      examples: [

    { title: "～てあげる・～てくれる・～てもらう – przysługi",
      pattern: "V-て + あげる / くれる / もらう",
      explain: "Te same czasowniki po formie て oznaczają <b>przysługę</b>. ～てあげる: robię coś dla kogoś (wobec starszych brzmi protekcjonalnie – unikaj). ～てくれる: ktoś robi coś dla mnie – wyraża wdzięczność. ～てもらう: dostaję przysługę od kogoś (wykonawca dostaje <b>に</b>). Porównaj: {友|とも}だちが{手伝|てつだ}ってくれた = {友|とも}だちに{手伝|てつだ}ってもらった (Przyjaciel mi pomógł). Polacy często pomijają te końcówki – ale bez nich japońskie zdanie brzmi chłodno, jakby przysługa była czymś oczywistym.",

    { title: "も (aż) i しか～ない (tylko)",

      explain: "Po liczbie <b>も</b> podkreśla, że to dużo: {本|ほん}を{十冊|じゅっさつ}も{買|か}った (kupiłem aż dziesięć książek). <b>しか</b> znaczy „tylko, zaledwie” i wymaga <b>przeczenia</b> w orzeczeniu – zawsze z odcieniem „za mało”: {千円|せんえん}しかありません. Typowy błąd: ×{千円|せんえん}しかあります. しか zastępuje は, が, を, a z innymi partykułami stoi po nich: {友|とも}だちにしか{言|い}っていない. Neutralne „tylko”, bez narzekania, to だけ.",

    { title: "Liczniki: つ・本・枚・冊・台・匹・人・個・杯",
      pattern: "N を + liczba z licznikiem + czasownik (りんごを三つ買う)",
      explain: "Licznik zależy od rodzaju rzeczy. <b>つ</b> – ogólny: ひとつ, ふたつ, みっつ, よっつ, いつつ, むっつ, ななつ, やっつ, ここのつ, とお. <b>本</b> – podłużne (butelki, ołówki, parasole): いっぽん, にほん, さんぼん, ろっぽん, はっぽん, じゅっぽん, なんぼん. <b>枚</b> – płaskie (kartki, koszule, bilety): いちまい, にまい… <b>冊</b> – książki, zeszyty: いっさつ, はっさつ, じゅっさつ. <b>台</b> – maszyny, pojazdy: いちだい, にだい… <b>匹</b> – małe zwierzęta: いっぴき, にひき, さんびき, ろっぴき, はっぴき, じゅっぴき, なんびき. <b>人</b> – ludzie: ひとり, ふたり, さんにん, よにん. <b>個</b> – małe przedmioty: いっこ, ろっこ, はっこ, じゅっこ. <b>杯</b> – kubki, szklanki, miski: いっぱい, にはい, さんばい, ろっぱい, はっぱい, じゅっぱい, なんばい.<br>Zmiany dźwięków pojawiają się przy 1, 3, 6, 8 i 10 (h → p lub b, skrócenie do „t”). Liczba z licznikiem stoi zwykle tuż przed czasownikiem: {猫|ねこ}が{二匹|にひき}います.",
      examples: [

  grammar: [
    { title: "～そうです / ～って – podobno, słyszałem, że…",
      pattern: "forma prosta + そうです · rzecz. / na-przym. + だそうです · potocznie: ～って / ～んだって",
      explain: "Gdy przekazujesz informację, którą <b>usłyszałeś albo przeczytałeś</b>, dodaj <b>そうです</b> do formy prostej:<br>• czasownik: {降|ふ}る<b>そうです</b>, {結婚|けっこん}した<b>そうです</b>, {来|こ}ない<b>そうです</b><br>• przymiotnik い: {高|たか}い<b>そうです</b><br>• rzeczownik i przymiotnik な – z <b>だ</b>: {雨|あめ}<b>だそうです</b>, {有名|ゆうめい}<b>だそうです</b>.<br>Źródło podajesz z <b>～によると</b>: ニュースによると… (według wiadomości…).<br>Wśród przyjaciół zamiast そうです mówi się <b>って</b> albo <b>んだって</b>: {結婚|けっこん}するんだって！ (Podobno bierze ślub!).<br><b>Uwaga – dwa różne そう!</b> Poznany wcześniej „wygląda na…” dokleja się do <b>tematu</b> czasownika: {雨|あめ}が{降|ふ}り<b>そう</b>です = wygląda, że zaraz będzie padać (patrzę na chmury). Dzisiejszy stoi po <b>pełnej formie prostej</b>: {雨|あめ}が{降|ふ}る<b>そう</b>です = podobno będzie padać (słyszałem w prognozie). Podobnie: おいし<b>そう</b> (wygląda smacznie) ≠ おいしい<b>そう</b> (podobno smaczne).",
      examples: [
        ["{天気予報|てんきよほう}によると、{明日|あした}は{雨|あめ}が{降|ふ}るそうです。","Według prognozy jutro podobno będzie padać."],
        ["{田中|たなか}さんは{結婚|けっこん}したそうです。","Słyszałem, że pan Tanaka się ożenił."],
        ["あの{店|みせ}のラーメンはおいしいそうですよ。","Podobno ramen w tamtym lokalu jest dobry."],
        ["{山田|やまだ}さんのお{父|とう}さんは{医者|いしゃ}だそうです。","Podobno tata pana Yamady jest lekarzem."],
        ["ゆきちゃん、{試験|しけん}に{合格|ごうかく}したんだって！","Podobno Yuki zdała egzamin!"]
      ] },
    { title: "～ても / ～でも – nawet jeśli",
      pattern: "V-て + も · i-przym.: い → くても · na-przym. / rzecz. + でも · przeczenie: ない → なくても",
      explain: "<b>～ても</b> znaczy „nawet jeśli, choćby”. Mówisz nim, że wynik będzie <b>inny, niż można by się spodziewać</b>.<br><b>Czasownik</b>: forma て + も: {降|ふ}って → {降|ふ}っ<b>ても</b>, {飲|の}んで → {飲|の}ん<b>でも</b> (gdy て to で, będzie でも).<br><b>Przymiotnik い</b>: い → <b>くても</b>: {高|たか}い → {高|たか}くても. いい → <b>よくても</b>.<br><b>Przymiotnik な i rzeczownik</b>: + <b>でも</b>: {暇|ひま}でも, {雨|あめ}でも.<br><b>Przeczenie</b>: ない → <b>なくても</b>: {勉強|べんきょう}しなくても (nawet jeśli się nie uczysz).<br>Z pytajnikami: {何|なに}を{食|た}べても = cokolwiek zjem, いくら{寝|ね}ても = choćbym nie wiem ile spał.<br>Typowy błąd: mylenie z ～たら / ～ば. {雨|あめ}が{降|ふ}れ<b>ば</b>{行|い}きません = jeśli pada, nie idę; {雨|あめ}が{降|ふ}っ<b>ても</b>{行|い}きます = <b>nawet jeśli</b> pada, idę.",
      examples: [
        ["{雨|あめ}が{降|ふ}っても、{祭|まつ}りに{行|い}きます。","Nawet jeśli będzie padać, pójdę na festiwal."],
        ["{高|たか}くても、このかばんが{欲|ほ}しいです。","Nawet jeśli jest droga, chcę tę torbę."],
        ["{日曜日|にちようび}でも、{父|ちち}は{残業|ざんぎょう}します。","Nawet w niedzielę tata zostaje po godzinach."],
        ["いくら{寝|ね}ても、{眠|ねむ}いです。","Choćbym nie wiem ile spał, jestem śpiący."],
        ["{勉強|べんきょう}しなくても、{成績|せいせき}がいいです。","Choć się nie uczy, ma dobre oceny."]
      ] },
    { title: "～なくてもいいです – nie musisz, nie trzeba",
      pattern: "forma ない: ない → なくて + もいいです",
      explain: "Pamiętasz ～てもいいです (wolno, możesz)? Tu jest jego „siostra”: <b>wolno nie robić</b>, czyli „nie musisz”.<br><b>Krok po kroku</b>: 1) forma ない: {来|く}る → {来|こ}ない, {書|か}く → {書|か}かない, する → しない. 2) ない → <b>なくて</b>. 3) dodaj <b>もいいです</b>: {来|こ}なくてもいいです (<i>konakute mo ii desu</i>).<br>Wśród przyjaciół: ～なくてもいい albo krócej ～なくていい.<br>Pytanie: ～なくてもいいですか = Czy mogę nie…? Odpowiedź przecząca to ～なければなりません / ～なきゃだめ (musisz).<br>Typowy błąd: Polacy tłumaczą „nie musisz” słowo w słowo i mówią coś w stylu ×しなければなりません<b>ない</b>. Po japońsku po prostu mówisz „wolno nie robić”: しなくてもいいです.",
      examples: [
        ["{明日|あした}は{来|こ}なくてもいいです。","Jutro nie musisz przychodzić."],
        ["{靴|くつ}を{脱|ぬ}がなくてもいいですよ。","Nie trzeba zdejmować butów."],
        ["{全部|ぜんぶ}{食|た}べなくてもいいよ。","Nie musisz zjeść wszystkiego."],

  grammar: [
    { title: "Czasowniki przechodnie (を) i nieprzechodnie (が)",
      pattern: "ktoś が/は + rzecz. を + V przechodni · rzecz. が + V nieprzechodni",
      explain: "<b>Przechodni</b> ({他動詞|たどうし} – <i>tadōshi</i>): ktoś coś <b>robi z czymś</b>. Przedmiot dostaje <b>を</b>: {私|わたし}はドア<b>を</b>{開|あ}けます (otwieram drzwi).<br><b>Nieprzechodni</b> ({自動詞|じどうし} – <i>jidōshi</i>): coś <b>dzieje się samo</b>, nie mówimy, kto to zrobił. Rzecz dostaje <b>が</b>: ドア<b>が</b>{開|あ}きます (drzwi się otwierają).<br>Najważniejsze pary (przechodni ↔ nieprzechodni):<br>{開|あ}ける ↔ {開|あ}く · {閉|し}める ↔ {閉|し}まる · つける ↔ つく · {消|け}す ↔ {消|き}える · {落|お}とす ↔ {落|お}ちる · {壊|こわ}す ↔ {壊|こわ}れる · {割|わ}る ↔ {割|わ}れる · {汚|よご}す ↔ {汚|よご}れる · {沸|わ}かす ↔ {沸|わ}く · {入|い}れる ↔ {入|はい}る · {出|だ}す ↔ {出|で}る.<br>Podpowiedź: czasowniki na <b>-su</b> są prawie zawsze przechodnie ({消|け}す, {落|お}とす, {壊|こわ}す), a te na <b>-reru</b> często nieprzechodnie ({壊|こわ}れる, {割|わ}れる).<br>Japończycy, mówiąc o wypadkach, lubią formę nieprzechodnią: お{皿|さら}が{割|わ}れました (talerz się stłukł) brzmi łagodniej niż „stłukłem talerz”. Typowy błąd: ×ドアを{開|あ}きます – {開|あ}く nie może mieć を.",
      examples: [
        ["{窓|まど}を{開|あ}けてもいいですか。","Czy mogę otworzyć okno?"],
        ["{風|かぜ}で{窓|まど}が{開|あ}きました。","Okno otworzyło się od wiatru."],
        ["{部屋|へや}を{出|で}る{時|とき}、{電気|でんき}を{消|け}してください。","Wychodząc z pokoju, proszę zgasić światło."],
        ["{急|きゅう}に{電気|でんき}が{消|き}えました。","Nagle zgasło światło."],
        ["{弟|おとうと}がパソコンを{壊|こわ}しました。","Młodszy brat zepsuł komputer."]
      ] },
    { title: "Nieprzechodni + ている – stan, który widać",
      pattern: "rzecz. が + V nieprzechodni (forma て) + いる",
      explain: "Gdy do czasownika nieprzechodniego dodasz <b>ている</b>, opisujesz <b>stan, który trwa</b> po jakiejś zmianie – to, co widzisz teraz.<br>ドアが{開|あ}い<b>ています</b> = drzwi są otwarte (otworzyły się i tak zostały).<br>{電気|でんき}がつい<b>ています</b> = światło jest zapalone.<br>コップが{割|わ}れ<b>ています</b> = szklanka jest pęknięta.<br>Nie pomyl z ～ている przy czasownikach czynności ({食|た}べている = właśnie jem). Typowy błąd: Polacy mówią „drzwi są otwarte” i szukają przymiotnika. Po japońsku to po prostu ドアが{開|あ}いています.",
      examples: [
        ["{冷蔵庫|れいぞうこ}のドアが{開|あ}いていますよ。","Drzwi lodówki są otwarte."],

      explain: "Strona bierna mówi, że ktoś <b>doświadcza</b> czynności wykonanej przez kogoś innego („zostałem pochwalony”, „ukradziono mi”).<br><b>Grupa U</b>: ostatnie -u → <b>-a</b> + <b>れる</b>: {書|か}く → {書|か}かれる, {盗|ぬす}む → {盗|ぬす}まれる, {踏|ふ}む → {踏|ふ}まれる, {叱|しか}る → {叱|しか}られる. Czasowniki na う dostają <b>わ</b>: {言|い}う → {言|い}われる (<i>iwareru</i>), {笑|わら}う → {笑|わら}われる.<br><b>Grupa RU</b>: る → <b>られる</b>: {褒|ほ}める → {褒|ほ}められる, {見|み}る → {見|み}られる. (Wygląda tak samo jak forma potencjalna – o znaczeniu decyduje zdanie.)<br><b>Nieregularne</b>: する → <b>される</b>, {来|く}る → <b>{来|こ}られる</b> (<i>korareru</i>).<br>Forma bierna odmienia się jak czasownik grupy RU: {褒|ほ}められ<b>ます</b>, {褒|ほ}められ<b>ました</b>, {褒|ほ}められ<b>た</b>.<br><b>Kto zrobił?</b> Sprawcę oznaczasz partykułą <b>に</b>: {先生|せんせい}<b>に</b>{褒|ほ}められました (zostałem pochwalony przez nauczyciela). Osoba, która doznaje, dostaje は/が.",
      examples: [
        ["{先生|せんせい}に{褒|ほ}められました。","Zostałem pochwalony przez nauczyciela."],
        ["{母|はは}に{叱|しか}られました。","Mama mnie zbeształa (zostałem zbesztany przez mamę)."],
        ["{犬|いぬ}にかまれました。","Pogryzł mnie pies."],
        ["{犯人|はんにん}は{警察|けいさつ}に{捕|つか}まえられました。","Sprawca został schwytany przez policję."],
        ["{友達|ともだち}に{笑|わら}われました。","Koledzy mnie wyśmiali."]
      ] },
    { title: "Strona bierna z przedmiotem i „przykra” strona bierna",
      pattern: "osoba は + sprawca に + rzecz. を + V bierny · osoba は + sprawca に + V nieprzechodni bierny",
      explain: "<b>1) „Ukradli mi coś”</b> – gdy czynność dotyczy <b>twojej rzeczy lub części ciała</b>, w japońskim podmiotem jesteś <b>ty</b>, a rzecz zostaje z <b>を</b>:<br>{私|わたし}は{泥棒|どろぼう}に{財布|さいふ}<b>を</b>{盗|ぬす}まれました = Złodziej ukradł mi portfel.<br>{電車|でんしゃ}で{足|あし}<b>を</b>{踏|ふ}まれました = W pociągu ktoś nadepnął mi na nogę.<br>Typowy błąd: ×{私|わたし}の{財布|さいふ}は{盗|ぬす}まれました – to brzmi jak z raportu policyjnego, a nie jak opowieść poszkodowanego.<br><b>2) „Przykra” strona bierna</b> ({迷惑|めいわく}の{受身|うけみ} – <i>meiwaku no ukemi</i>) – nawet czasowniki <b>nieprzechodnie</b> mogą być w stronie biernej. Znaczy to wtedy: „spotkało mnie to i było mi przykro”:<br>{雨|あめ}に{降|ふ}られました = Złapał mnie deszcz (i przemokłem).<br>{赤|あか}ちゃんに{泣|な}かれました = Dziecko płakało (i nie mogłem spać).<br>{友達|ともだち}に{来|こ}られて、{勉強|べんきょう}できませんでした = Przyszedł kolega (nieproszony) i nie mogłem się uczyć.<br><b>3) Neutralna</b> – o rzeczach i wydarzeniach: この{本|ほん}は{英語|えいご}で{書|か}かれています. Twórcę dzieła podajesz z <b>によって</b>: この{絵|え}はピカソによって{描|か}かれました.",
      examples: [
        ["{駅|えき}で{財布|さいふ}を{盗|ぬす}まれました。","Na stacji ukradziono mi portfel."],
        ["{帰|かえ}りに{雨|あめ}に{降|ふ}られました。","W drodze powrotnej złapał mnie deszcz."],
        ["{夜中|よなか}に{赤|あか}ちゃんに{泣|な}かれて、{寝|ね}られませんでした。","W nocy płakało dziecko i nie mogłem spać."],
        ["{蚊|か}に{刺|さ}されました。","Ugryzł mnie komar."],
        ["この{歌|うた}は{世界中|せかいじゅう}で{歌|うた}われています。","Ta piosenka jest śpiewana na całym świecie."]
      ] },
    { title: "Tryb warunkowy ～たら – jeśli; kiedy (już)",
      pattern: "forma た + ら · i-przym.: かった → かったら · rzecz. / na-przym. + だったら · przeczenie: なかったら",
      explain: "～たら to <b>najczęściej używane</b> japońskie „jeśli” i zarazem „kiedy już…, gdy tylko…”. Budowa jest bardzo prosta: weź formę <b>た</b> (przeszłą prostą) i dodaj <b>ら</b>:<br>{行|い}った → {行|い}った<b>ら</b> · {食|た}べた → {食|た}べた<b>ら</b> · した → した<b>ら</b> · {来|き}た → {来|き}た<b>ら</b> · {飲|の}んだ → {飲|の}んだ<b>ら</b><br>Przymiotnik い: {安|やす}かった<b>ら</b>; rzeczownik i na: {雨|あめ}だった<b>ら</b>, {暇|ひま}だった<b>ら</b>; przeczenie: {行|い}かなかった<b>ら</b>.<br>Mimo formy przeszłej, ～たら często mówi o <b>przyszłości</b>!<br>Znaczenia: 1) <b>jeśli</b>: お{金|かね}があったら、{車|くるま}を{買|か}いたい. 2) <b>kiedy już</b> (na pewno nastąpi): {家|いえ}に{着|つ}いたら、{電話|でんわ}します. 3) <b>odkrycie w przeszłości</b>: ドアを{開|あ}けたら、{猫|ねこ}がいました (otworzyłem drzwi, a tam kot).<br>W przeciwieństwie do ～と i ～ば, po ～たら możesz swobodnie dać <b>prośbę, zaproszenie, plan</b>. Gdy nie wiesz, którego „jeśli” użyć – ～たら prawie zawsze pasuje.",
      examples: [
        ["{時間|じかん}があったら、{映画|えいが}を{見|み}ませんか。","Jeśli będziesz mieć czas, może obejrzymy film?"],
        ["{駅|えき}に{着|つ}いたら、{電話|でんわ}してください。","Jak dojedziesz na stację, zadzwoń proszę."],
        ["{元気|げんき}だったら、{明日|あした}{遊|あそ}びに{来|き}てください。","Jeśli będziesz zdrowy, przyjdź jutro się pobawić."],
        ["{安|やす}かったら、{買|か}います。","Jeśli będzie tanie, kupię."],
        ["{窓|まど}を{開|あ}けたら、{雪|ゆき}が{降|ふ}っていました。","Otworzyłem okno, a tam padał śnieg."]
      ] },
    { title: "～ないで – nie robiąc czegoś; zamiast",
      pattern: "forma ない + で、…",
      explain: "～ないで łączy dwie czynności i mówi, że pierwszej <b>nie zrobiłeś</b>, a mimo to zrobiłeś drugą: „bez…”, „nie robiąc…”, „zamiast…”.<br><b>Budowa</b>: forma ない + で: {食|た}べない → {食|た}べない<b>で</b>, {持|も}たない → {持|も}たない<b>で</b>, しない → しない<b>で</b>.<br>{朝|あさ}ご{飯|はん}を{食|た}べないで{出|で}かけました = Wyszedłem bez śniadania.<br>Znasz już ～ないでください (proszę nie…) – to ta sama forma.<br>Typowy błąd: mylenie z ～なくて, które podaje <b>przyczynę</b>: {宿題|しゅくだい}をしなくて{叱|しか}られました (nie odrobiłem lekcji, <i>więc</i> mnie zbesztano) ≠ {宿題|しゅくだい}をしないで{学校|がっこう}に{行|い}きました (poszedłem do szkoły <i>bez</i> odrobienia lekcji).",
      examples: [
        ["{宿題|しゅくだい}をしないで{学校|がっこう}に{行|い}きました。","Poszedłem do szkoły, nie odrobiwszy zadania."],
        ["{傘|かさ}を{持|も}たないで{出|で}かけました。","Wyszedłem bez parasola."],
        ["バスに{乗|の}らないで、{歩|ある}いて{帰|かえ}りました。","Zamiast jechać autobusem, wróciłem pieszo."],
        ["{砂糖|さとう}を{入|い}れないで、コーヒーを{飲|の}みます。","Piję kawę bez cukru."]
      ] },
    { title: "～てよかった – dobrze, że…",
      pattern: "V-て + よかった(です) · przeczenie: ～なくてよかった",
      explain: "Gdy się cieszysz albo czujesz ulgę, że coś się stało, mówisz <b>forma て + よかった</b>: {来|き}て<b>よかった</b> (dobrze, że przyszedłem). Grzecznie: ～てよかったです.<br>Z przeczeniem: ない → <b>なくて</b>よかった: {遅|おく}れ<b>なくて</b>よかった (dobrze, że się nie spóźniłem).<br>Porównaj z poznanym ～ばよかった (szkoda, że nie / trzeba było) – to jego przeciwieństwo:<br>{行|い}って<b>よかった</b> = dobrze, że poszedłem · {行|い}け<b>ばよかった</b> = trzeba było pójść.",
      examples: [
        ["{日本語|にほんご}を{勉強|べんきょう}してよかったです。","Cieszę się, że uczę się japońskiego."],
        ["{旅行|りょこう}に{行|い}ってよかった。","Dobrze, że pojechałem na wycieczkę."],
        ["けががなくてよかったですね。","Dobrze, że nic ci się nie stało."],
        ["{傘|かさ}を{持|も}ってきてよかった。","Dobrze, że wziąłem parasol."]
      ] },
    { title: "～はずです – powinno być, na pewno (z logiki)",
      pattern: "forma prosta + はずです · na-przym. + な + はず · rzecz. + の + はず · ～はずがない (niemożliwe)",
      explain: "～はず (<i>hazu</i>) wyraża <b>przekonanie oparte na faktach</b>: „powinno być tak, na pewno tak jest”. Nie chodzi o obowiązek, tylko o logiczny wniosek: {電車|でんしゃ}は{九時|くじ}に{出|で}たから、もう{着|つ}いた<b>はず</b>です (pociąg odjechał o 9, więc powinien już dojechać).<br><b>Budowa</b> (jak przed rzeczownikiem): {来|く}る<b>はず</b>, {来|こ}ない<b>はず</b>, {高|たか}い<b>はず</b>, {静|しず}か<b>な</b>はず, {休|やす}み<b>の</b>はず.<br><b>はずがない / はずはない</b> = to niemożliwe, na pewno nie: {彼|かれ}が{嘘|うそ}をつく<b>はずがない</b>.<br>Typowy błąd: Polskie „powinieneś iść do lekarza” to <b>rada</b> – wtedy mówisz ほうがいい, nie はず. はず opisuje, czego się spodziewasz, nie co komuś radzisz.",
      examples: [
        ["{田中|たなか}さんはもうすぐ{来|く}るはずです。","Pan Tanaka powinien zaraz przyjść."],
        ["この{薬|くすり}はよく{効|き}くはずです。","To lekarstwo powinno dobrze działać."],
        ["{今日|きょう}は{日曜日|にちようび}だから、{銀行|ぎんこう}は{休|やす}みのはずです。","Dziś niedziela, więc bank na pewno jest zamknięty."],
        ["{鍵|かぎ}はかばんに{入|い}れたはずなんですが…。","Przecież na pewno włożyłem klucz do torby…"],
        ["あの{真面目|まじめ}な{人|ひと}が{遅|おく}れるはずがない。","Ten sumienny człowiek nie może się spóźnić."]
      ] }
  ],

{
  id: "d3-5",
  title: "Strona sprawcza, rady i pytania zależne",
  goal: "Po tej lekcji potrafisz powiedzieć, że ktoś komuś coś każe lub pozwala zrobić (strona sprawcza), poprosić „pozwól mi…” (～させてください), doradzić (～たらどうですか), wbudować pytanie w zdanie („nie wiem, czy…”, „powiedz, gdzie…”) i ocenić, czy coś jest łatwe lub trudne do zrobienia (～やすい / ～にくい).",

  grammar: [
    { title: "Strona sprawcza – kazać / pozwolić komuś",
      pattern: "U: -u → -a + せる · RU: る → させる · する → させる · 来る → 来させる (こさせる)",
      explain: "Strona sprawcza ({使役|しえき} – <i>shieki</i>) mówi, że ktoś <b>każe</b> albo <b>pozwala</b> komuś coś zrobić. To, czy „kazać”, czy „pozwolić”, wynika z sytuacji.<br><b>Grupa U</b>: ostatnie -u → <b>-a</b> + <b>せる</b>: {書|か}く → {書|か}かせる, {待|ま}つ → {待|ま}たせる, {飲|の}む → {飲|の}ませる, {行|い}く → {行|い}かせる. Czasowniki na う → <b>わせる</b>: {買|か}う → {買|か}わせる, {言|い}う → {言|い}わせる.<br><b>Grupa RU</b>: る → <b>させる</b>: {食|た}べる → {食|た}べさせる, {見|み}る → {見|み}させる.<br><b>Nieregularne</b>: する → <b>させる</b>, {来|く}る → <b>{来|こ}させる</b> (<i>kosaseru</i>).<br>Odmienia się jak grupa RU: {書|か}かせます, {書|か}かせました.<br>Porównaj ze stroną bierną: {書|か}か<b>れる</b> (zostać napisanym) ↔ {書|か}か<b>せる</b> (kazać napisać). Różni je tylko jedna sylaba – czytaj uważnie!",
      examples: [
        ["{母|はは}は{子供|こども}に{野菜|やさい}を{食|た}べさせます。","Mama każe dziecku jeść warzywa."],
        ["{先生|せんせい}は{学生|がくせい}に{作文|さくぶん}を{書|か}かせました。","Nauczyciel kazał studentom napisać wypracowanie."],
        ["{部長|ぶちょう}は{部下|ぶか}に{残業|ざんぎょう}させました。","Kierownik kazał podwładnemu zostać po godzinach."],
        ["{遅|おそ}くなって、{友達|ともだち}を{待|ま}たせてしまいました。","Spóźniłem się i kazałem przyjacielowi czekać."]
      ] },
    { title: "Strona sprawcza: に czy を? oraz ～させてください",
      pattern: "osoba に + rzecz. を + V sprawczy · osoba を + V nieprzechodni sprawczy · V sprawczy (forma て) + ください",
      explain: "<b>Kogo zmuszasz?</b> Osobę, która ma wykonać czynność, oznaczasz:<br>• <b>に</b>, gdy w zdaniu jest już przedmiot z を: {子供|こども}<b>に</b>{部屋|へや}<b>を</b>{掃除|そうじ}させる (kazać dziecku sprzątnąć pokój).<br>• <b>を</b>, gdy czasownik jest nieprzechodni (bez przedmiotu): {子供|こども}<b>を</b>{公園|こうえん}で{遊|あそ}ばせる (pozwolić dziecku bawić się w parku). Pomaga zasada: w jednym zdaniu nie chcemy dwóch を.<br><b>Emocje</b>: strona sprawcza mówi też, że kogoś <b>rozśmieszyłeś, zasmuciłeś, zaskoczyłeś</b>: {母|はは}を{悲|かな}しませました (zasmuciłem mamę), {友達|ともだち}を{驚|おどろ}かせました.<br><b>～させてください</b> = „proszę pozwolić mi…”. Bardzo grzeczny sposób, by zaproponować, że coś zrobisz, albo poprosić o zgodę: {私|わたし}に{払|はら}わせてください (proszę pozwolić mi zapłacić), {今日|きょう}は{早|はや}く{帰|かえ}らせてください.<br>Typowy błąd: ×{払|はら}ってさせてください – させて dokleja się nie do formy て, tylko tworzysz formę sprawczą: {払|はら}う → {払|はら}わせる → {払|はら}わせてください.",
      examples: [
        ["{子供|こども}を{公園|こうえん}で{遊|あそ}ばせました。","Pozwoliłem dziecku pobawić się w parku."],
        ["{父|ちち}は{弟|おとうと}に{車|くるま}を{洗|あら}わせました。","Tata kazał młodszemu bratu umyć samochód."],
        ["{試験|しけん}に{落|お}ちて、{両親|りょうしん}を{悲|かな}しませてしまいました。","Oblałem egzamin i zasmuciłem rodziców."],
        ["その{仕事|しごと}、{私|わたし}にやらせてください。","Proszę pozwolić mi wykonać tę pracę."],
        ["{少|すこ}し{考|かんが}えさせてください。","Proszę dać mi chwilę do namysłu."]
      ] },
    { title: "～たらどうですか – może byś…? (rada)",
      pattern: "forma た + らどうですか · potocznie: ～たらどう？ / ～たら？",
      explain: "Chcesz komuś coś <b>zasugerować</b>? Weź formę ～たら (z poprzedniej lekcji) i dodaj <b>どうですか</b> – dosłownie „a gdybyś zrobił…, jak by było?”.<br>{休|やす}む → {休|やす}んだ → {休|やす}んだ<b>らどうですか</b> (Może byś odpoczął?)<br>{聞|き}く → {聞|き}いた → {聞|き}いた<b>らどうですか</b><br>Wśród przyjaciół: ～たらどう？ albo jeszcze krócej ～たら？: {寝|ね}たら？ (Może się prześpij?)<br>Uwaga: do osób starszych i przełożonych rada może brzmieć nieuprzejmie, bo to tak, jakbyś ich pouczał. Grzeczniej: ～たらいかがですか, a najlepiej – nie dawać rad szefowi.<br>Porównaj: ～ほうがいいです to mocniejsza rada („lepiej zrób”), ～たらどうですか – delikatna propozycja.",
      examples: [
        ["{疲|つか}れているなら、{少|すこ}し{休|やす}んだらどうですか。","Jeśli jesteś zmęczony, może trochę odpoczniesz?"],
        ["わからない{時|とき}は、{先生|せんせい}に{聞|き}いたらどうですか。","Kiedy czegoś nie rozumiesz, może zapytasz nauczyciela?"],
        ["{一人|ひとり}で{悩|なや}まないで、{家族|かぞく}と{話|はな}し{合|あ}ったら？","Nie martw się sam, może porozmawiasz z rodziną?"],
        ["{辞書|じしょ}で{調|しら}べたらどう？","Może sprawdzisz w słowniku?"]
      ] },
    { title: "～か / ～かどうか – pytanie wewnątrz zdania",
      pattern: "pytajnik + forma prosta + か + わかりません/知っていますか… · forma prosta + かどうか · rzecz. / na-przym. bez だ",
      explain: "Gdy pytanie jest <b>częścią większego zdania</b> („Nie wiem, <b>gdzie</b> on mieszka”, „Nie wiem, <b>czy</b> przyjdzie”), robisz tak:<br>1) Zamień pytanie na formę prostą: どこに{住|す}んでいますか → どこに{住|す}んでいる.<br>2) Dodaj <b>か</b> i resztę zdania: どこに{住|す}んでいる<b>か</b>{知|し}りません.<br>• Pytanie <b>z pytajnikiem</b> ({何|なに}, どこ, いつ, {誰|だれ}, どう…) → tylko <b>か</b>: {何時|なんじ}に{始|はじ}まる<b>か</b>{教|おし}えてください.<br>• Pytanie <b>tak/nie</b> → <b>かどうか</b> („czy… czy nie”): {彼|かれ}が{来|く}る<b>かどうか</b>わかりません.<br>Rzeczownik i przymiotnik な – <b>bez だ</b>: {誰|だれ}の{傘|かさ}<b>か</b> (nie ×{誰|だれ}の{傘|かさ}だか), {本当|ほんとう}<b>かどうか</b>.<br>Typowe czasowniki po: わかりません, {知|し}りません, {教|おし}えてください, {覚|おぼ}えていません, {調|しら}べます, {聞|き}いてみます.<br>Typowy błąd: zostawianie formy ます w środku: ×どこに{住|す}んでいます<b>か</b>{知|し}りません – w środku zdania forma prosta.",
      examples: [
        ["{試験|しけん}がいつ{始|はじ}まるか、{知|し}っていますか。","Wiesz, kiedy zaczyna się egzamin?"],
        ["{彼|かれ}が{来|く}るかどうか、わかりません。","Nie wiem, czy on przyjdzie."],
        ["この{本|ほん}が{面白|おもしろ}いかどうか、{教|おし}えてください。","Powiedz mi, proszę, czy ta książka jest ciekawa."],
        ["これは{誰|だれ}の{傘|かさ}か、わかりますか。","Wiesz, czyj to parasol?"],
        ["{駅|えき}までどうやって{行|い}くか、{調|しら}べてみます。","Sprawdzę, jak dojechać na stację."]
      ] },
    { title: "～やすい / ～にくい – łatwo / trudno coś zrobić",
      pattern: "V (temat formy ます) + やすい / にくい",
      explain: "Do <b>tematu formy ます</b> doklejasz:<br>• <b>やすい</b> (<i>yasui</i>) – łatwo (coś zrobić): {読|よ}みます → {読|よ}み<b>やすい</b> (łatwy do czytania)<br>• <b>にくい</b> (<i>nikui</i>) – trudno (coś zrobić): {覚|おぼ}えます → {覚|おぼ}え<b>にくい</b> (trudny do zapamiętania)<br>Wynik to zwykły przymiotnik い, więc odmieniasz go normalnie: {使|つか}いやすくない, {書|か}きにくかった, {分|わ}かりやすい{説明|せつめい}.<br>Uwaga: to やすい nie ma nic wspólnego z {安|やす}い (tani) – tylko brzmi tak samo!<br>Typowy błąd: ×{読|よ}むやすい – musi być temat ます: {読|よ}み.",
      examples: [
        ["この{本|ほん}は{字|じ}が{大|おお}きくて、{読|よ}みやすいです。","Ta książka ma duże litery i łatwo się ją czyta."],
        ["この{漢字|かんじ}は{覚|おぼ}えにくいです。","Ten kanji jest trudny do zapamiętania."],
        ["{先生|せんせい}の{説明|せつめい}はわかりやすいです。","Wyjaśnienia nauczyciela są łatwe do zrozumienia."],
        ["このペンは{書|か}きにくいですね。","Tym długopisem trudno się pisze."],
        ["この{靴|くつ}は{歩|ある}きやすいです。","W tych butach wygodnie się chodzi."]
      ] }
  ],

  grammar: [
    { title: "Sonkeigo – specjalne czasowniki wywyższające",
      pattern: "いる・行く・来る → いらっしゃる · 言う → おっしゃる · 食べる・飲む → 召し上がる · 見る → ご覧になる · する → なさる · 知っている → ご存じだ · くれる → くださる · 寝る → お休みになる",
      explain: "Sonkeigo stosujesz, gdy <b>podmiotem</b> czynności jest osoba, którą szanujesz: {先生|せんせい}, お{客|きゃく}さん, {部長|ぶちょう}. O sobie i swojej rodzinie – nigdy.<br>Najczęstsze czasowniki mają <b>osobne słowa</b>:<br>• いる / {行|い}く / {来|く}る → <b>いらっしゃる</b> (<i>irassharu</i>)<br>• {言|い}う → <b>おっしゃる</b> (<i>ossharu</i>)<br>• {食|た}べる / {飲|の}む → <b>{召|め}し{上|あ}がる</b> (<i>meshiagaru</i>)<br>• {見|み}る → <b>ご{覧|らん}になる</b> (<i>goran ni naru</i>)<br>• する → <b>なさる</b><br>• {知|し}っている → <b>ご{存|ぞん}じだ</b> (<i>gozonji da</i>)<br>• くれる → <b>くださる</b> · {寝|ね}る → <b>お{休|やす}みになる</b><br><b>Uwaga na formę ます!</b> いらっしゃる, おっしゃる, なさる, くださる mają nieregularną formę ます: いらっしゃ<b>い</b>ます, おっしゃ<b>い</b>ます, なさ<b>い</b>ます, くださ<b>い</b>ます (nie ×いらっしゃります).<br>Typowy błąd: ×{私|わたし}は{明日|あした}いらっしゃいます – o sobie nie mówisz sonkeigo, tylko zwykłe {行|い}きます.",
      examples: [
        ["{社長|しゃちょう}は{今|いま}{会議室|かいぎしつ}にいらっしゃいます。","Prezes jest teraz w sali konferencyjnej."],

        ["どうぞ、{召|め}し{上|あ}がってください。","Proszę, niech pan się poczęstuje."],
        ["この{写真|しゃしん}をご{覧|らん}になりましたか。","Czy widział pan to zdjęcie?"],
        ["{山田|やまだ}さんをご{存|ぞん}じですか。","Czy zna pan pana Yamadę?"]
      ] },
    { title: "Sonkeigo – forma regularna お～になる",
      pattern: "お + V (temat ます) + になる · ご + rzecz. (z する) + になる",
      explain: "Czasowniki, które nie mają osobnego słowa, ugrzeczniasz według wzoru:<br><b>お + temat formy ます + になる</b><br>{読|よ}みます → <b>お</b>{読|よ}み<b>になる</b> → お{読|よ}みになりました<br>{帰|かえ}ります → お{帰|かえ}りになる · {書|か}きます → お{書|か}きになる · {待|ま}ちます → お{待|ま}ちになる<br>Czasowniki z する (pochodzenia chińskiego) dostają zwykle <b>ご</b>: {利用|りよう}する → ご{利用|りよう}になる.<br>Nie działa to z czasownikami, których temat ma tylko jedną sylabę ({見|み}る, {寝|ね}る, {来|く}る, いる) – dla nich są specjalne słowa z poprzedniego punktu.<br>Uwaga: istnieje też łatwiejszy sposób – <b>forma bierna</b> jako forma grzecznościowa: {先生|せんせい}は{何時|なんじ}に{帰|かえ}られますか. Brzmi grzecznie, ale mniej niż お～になる.<br>Typowy błąd: ×お{読|よ}むになる – zawsze temat ます: お{読|よ}み.",
      examples: [

        ["このサービスは{誰|だれ}でもご{利用|りよう}になれます。","Z tej usługi może skorzystać każdy."]

    { title: "お～ください – proszę (zrobić)",
      pattern: "お + V (temat ます) + ください · ご + rzecz. (z する) + ください",
      explain: "To bardzo grzeczna wersja ～てください. Usłyszysz ją w sklepach, na dworcach, w recepcji.<br><b>Budowa</b>: お + temat formy ます + ください: {待|ま}ちます → <b>お</b>{待|ま}ち<b>ください</b> (proszę poczekać), {書|か}きます → お{書|か}きください, {座|すわ}ります → お{座|すわ}りください.<br>Z rzeczownikami z する: <b>ご</b>{注意|ちゅうい}ください (proszę uważać), ご{連絡|れんらく}ください.<br>Wyjątki: {見|み}る → <b>ご{覧|らん}ください</b>, {来|く}る → <b>お{越|こ}しください</b>, {食|た}べる → <b>{召|め}し{上|あ}がってください</b>.<br>Typowy błąd: mieszanie obu wzorów: ×お{待|ま}ってください. Albo {待|ま}ってください, albo お{待|ま}ちください.",
      examples: [

    { title: "～てある – coś zostało (celowo) zrobione",

      explain: "～てある opisuje <b>stan, który powstał, bo ktoś coś celowo zrobił</b> – i ten efekt widać teraz. Kto to zrobił, nie jest ważne.<br><b>Budowa</b>: czasownik <b>przechodni</b> w formie て + ある; rzecz zwykle z <b>が</b>: {窓|まど}<b>が</b>{開|あ}けて<b>あります</b> (okno jest otwarte – ktoś je otworzył, np. żeby przewietrzyć).<br>Porównaj z lekcją d3-3:<br>• {窓|まど}が{開|あ}い<b>ています</b> – okno jest otwarte (opis, może samo się otworzyło).<br>• {窓|まど}が{開|あ}けて<b>あります</b> – okno zostało otwarte (ktoś to zrobił celowo).<br>Często mówi o <b>przygotowaniach</b>: ビールは{冷|ひ}やしてあります (piwo już schłodzone), {部屋|へや}は{予約|よやく}してあります.<br>Typowy błąd: ×{窓|まど}が{開|あ}いてあります – ～てある tylko z czasownikami przechodnimi.",
      examples: [
        ["{机|つくえ}の{上|うえ}に{本|ほん}が{置|お}いてあります。","Na biurku leży (położona) książka."],

        ["{飲|の}み{物|もの}はもう{買|か}ってありますよ。","Napoje są już kupione."],
        ["ドアに{名前|なまえ}が{書|か}いてあります。","Na drzwiach jest napisane imię."]

    { title: "～ている間 / ～ている間に – w czasie gdy…",
      pattern: "V-ている + 間、… (przez cały czas) · V-ている + 間に、… (w którymś momencie) · rzecz. + の + 間(に)",
      explain: "{間|あいだ} (<i>aida</i>) znaczy „czas pomiędzy, okres”.<br>• <b>～ている{間|あいだ}</b>、 – przez <b>cały</b> ten czas działo się też B: {私|わたし}が{勉強|べんきょう}している{間|あいだ}、{弟|おとうと}はずっと{遊|あそ}んでいました (przez cały czas, gdy się uczyłem, brat się bawił). Druga część to też coś trwającego (ている, ずっと).<br>• <b>～ている{間|あいだ}に</b>、 – <b>w pewnym momencie</b> tego okresu stało się B: {映画|えいが}を{見|み}ている{間|あいだ}に、{寝|ね}てしまいました (podczas filmu w pewnej chwili zasnąłem). Druga część to jednorazowe zdarzenie.<br>Z rzeczownikiem: {夏休|なつやす}み<b>の</b>{間|あいだ}に (w czasie wakacji).<br>Typowy błąd: pomijanie に, gdy mówimy o jednorazowym zdarzeniu.",
      examples: [

    { title: "～く／～にする – sprawić, że coś będzie jakieś",
      pattern: "i-przym.: い → く + する · na-przym. / rzecz. + に + する",
      explain: "Znasz już ～くなる / ～になる (stawać się): {寒|さむ}くなる, {静|しず}かになる. Gdy to <b>ty</b> wywołujesz zmianę, używasz <b>する</b> zamiast なる:<br>• przymiotnik い: い → <b>く</b> + する: {短|みじか}い → {短|みじか}<b>くする</b> (skrócić), {大|おお}きい → {大|おお}きくする.<br>• przymiotnik な i rzeczownik: + <b>にする</b>: きれい → きれい<b>にする</b> (posprzątać, upiększyć), {静|しず}か → {静|しず}かにする (uciszyć się).<br>Przy rzeczowniku にする znaczy też „zdecydować się na”: コーヒー<b>にします</b> (wezmę kawę).<br>Typowy błąd: ×{部屋|へや}をきれいくする – きれい to przymiotnik な, więc きれい<b>に</b>する.",
      examples: [

  intro: "Druga część keigo to <b>kenjōgo</b> ({謙譲語|けんじょうご} – <i>kenjōgo</i>), czyli formy <b>uniżające</b>. W sonkeigo wywyższałeś drugą osobę, a tu robisz coś odwrotnego: <b>pomniejszasz siebie</b> (i swoją „drużynę”), żeby okazać szacunek rozmówcy. Przyda się na rozmowie o pracę, w pracy i w każdej oficjalnej sytuacji. Do tego natura, przyroda i słówka z codziennego życia.",

  grammar: [
    { title: "Kenjōgo – specjalne czasowniki uniżające",
      pattern: "いる → おる · 行く・来る → 参る · 言う → 申す · 食べる・飲む・もらう → いただく · 見る → 拝見する · する → いたす · 知っている → 存じている · 訪ねる・聞く → 伺う · 会う → お目にかかる",
      explain: "Kenjōgo stosujesz, gdy <b>ty</b> (albo ktoś z twojej rodziny czy firmy) jesteś podmiotem, a mówisz do osoby, którą szanujesz. Pomniejszasz siebie – to też jest grzeczność.<br>Najważniejsze słowa (naucz się ich jak słówek):<br>• いる → <b>おる</b> (おります – <i>orimasu</i>)<br>• {行|い}く / {来|く}る → <b>{参|まい}る</b> ({参|まい}ります)<br>• {言|い}う → <b>{申|もう}す</b> ({申|もう}します) – np. ノヴァクと{申|もう}します (nazywam się Nowak)<br>• {食|た}べる / {飲|の}む / もらう → <b>いただく</b><br>• {見|み}る → <b>{拝見|はいけん}する</b><br>• する → <b>いたす</b> (いたします)<br>• {知|し}っている → <b>{存|ぞん}じている</b> ({存|ぞん}じております); nie wiem → {存|ぞん}じません<br>• {訪|たず}ねる / {聞|き}く → <b>{伺|うかが}う</b> (odwiedzić; zapytać)<br>• {会|あ}う → <b>お{目|め}にかかる</b><br>Porównaj z sonkeigo: {先生|せんせい}が<b>いらっしゃいます</b> (nauczyciel przychodzi) ↔ {私|わたし}が<b>{参|まい}ります</b> (ja przychodzę).<br>Typowy błąd: ×{先生|せんせい}が{参|まい}りました – nie uniżasz nauczyciela! O nim mówisz いらっしゃいました.",
      examples: [
        ["はじめまして。{田中|たなか}と{申|もう}します。","Dzień dobry, nazywam się Tanaka."],
        ["{明日|あした}、{先生|せんせい}のお{宅|たく}に{伺|うかが}います。","Jutro odwiedzę dom pana profesora."],
        ["{私|わたし}は{東京|とうきょう}に{住|す}んでおります。","Mieszkam w Tokio."],
        ["お{手紙|てがみ}を{拝見|はいけん}しました。","Przeczytałem (obejrzałem) pański list."],
        ["お{先|さき}にいただきます。","Pozwolę sobie zacząć (jeść) przed wami."]
      ] },
    { title: "Kenjōgo – forma regularna お～する / ご～する",
      pattern: "お + V (temat ます) + する / いたす · ご + rzecz. (z する) + する / いたす",
      explain: "Gdy robisz coś <b>dla</b> szanowanej osoby, użyj wzoru:<br><b>お + temat formy ます + する</b> (jeszcze grzeczniej: + いたす)<br>{持|も}ちます → <b>お</b>{持|も}ち<b>します</b> (poniosę dla pana)<br>{待|ま}ちます → お{待|ま}ちしています (czekam na pana)<br>{知|し}らせます → お{知|し}らせします (powiadomię pana)<br>Czasowniki z する dostają <b>ご</b>: {案内|あんない}する → <b>ご</b>{案内|あんない}<b>します</b> (oprowadzę), {連絡|れんらく}する → ご{連絡|れんらく}します.<br>Nie myl ze sonkeigo! お{待|ま}ち<b>になる</b> (on czeka – wywyższam go) ↔ お{待|ま}ち<b>する</b> (ja czekam – uniżam siebie). Różni je tylko końcówka.<br>Uwaga: tej formy nie używa się do czynności, które robisz tylko dla siebie (×お{寝|ね}します).",
      examples: [
        ["{荷物|にもつ}をお{持|も}ちしましょうか。","Czy mogę ponieść pana bagaż?"],
        ["{会議室|かいぎしつ}へご{案内|あんない}します。","Zaprowadzę pana do sali konferencyjnej."],
        ["{結果|けっか}はメールでお{知|し}らせします。","Wynik przekażę panu mailem."],
        ["{皆様|みなさま}のお{越|こ}しをお{待|ま}ちしております。","Czekamy na Państwa przybycie."],
        ["{後|あと}でこちらからご{連絡|れんらく}いたします。","Później skontaktujemy się z Państwem."]
      ] },
    { title: "Grzeczne słówka i zasada „swoi – obcy”",
      pattern: "ここ → こちら · どこ → どちら · 誰 → どなた · ある → ござる (ございます) · です → でございます · どう → いかが",
      explain: "W grzecznej rozmowie niektóre zwykłe słowa zamienia się na ich eleganckie odpowiedniki:<br>• ここ / これ → <b>こちら</b>, そこ → そちら, どこ / どれ → <b>どちら</b><br>• {誰|だれ} → <b>どなた</b> (kto?)<br>• あります → <b>ございます</b>, ～です → <b>～でございます</b> (np. w sklepie: トイレはあちらでございます)<br>• どうですか → <b>いかがですか</b><br>• すみません → <b>{申|もう}し{訳|わけ}ありません</b>, わかりました → <b>かしこまりました</b><br><b>Zasada „swoi – obcy”</b> ({内|うち}と{外|そと} – <i>uchi to soto</i>): gdy rozmawiasz z kimś <b>spoza</b> twojej firmy lub rodziny, o swoich (nawet o szefie) mówisz uniżająco i bez さん: {部長|ぶちょう}の{鈴木|すずき}は{今|いま}{席|せき}を{外|はず}しております (kierownik Suzuki jest chwilowo nieobecny).",
      examples: [
        ["お{手洗|てあら}いはあちらでございます。","Toaleta jest tam."],
        ["{失礼|しつれい}ですが、どなたですか。","Przepraszam, kim pan jest?"],
        ["お{飲|の}み{物|もの}はいかがですか。","Czy podać coś do picia?"],
        ["{申|もう}し{訳|わけ}ありません。{田中|たなか}は{今日|きょう}{休|やす}みをいただいております。","Najmocniej przepraszam. Tanaka ma dziś wolne."]
      ] },
    { title: "N という N – (coś) o nazwie…",
      pattern: "rzecz. (nazwa) + という + rzecz. (kategoria)",
      explain: "Gdy wymieniasz nazwę, której rozmówca może <b>nie znać</b> (osobę, miejsce, książkę, potrawę), dodaj <b>という</b> i powiedz, czym to jest: 「ポチ」<b>という</b>{犬|いぬ} = pies o imieniu Pochi.<br>Pierwszy rzeczownik to konkretna nazwa, drugi – ogólna kategoria (osoba, sklep, miasto, książka).<br>Przydaje się też, gdy pytasz o nieznane słowo: 「わさび」という{言葉|ことば}はどういう{意味|いみ}ですか.<br>という wymawia się <i>to iu</i> (jak „to-ju”).<br>Typowy błąd: ×{田中|たなか}さんの{人|ひと} – po polsku „osoba o nazwisku Tanaka”, po japońsku {田中|たなか}さん<b>という</b>{人|ひと}.",
      examples: [
        ["{田中|たなか}さんという{人|ひと}を{知|し}っていますか。","Znasz osobę o nazwisku Tanaka?"],
        ["{私|わたし}はクラクフという{町|まち}から{来|き}ました。","Przyjechałem z miasta, które nazywa się Kraków."],
        ["「{雪国|ゆきぐに}」という{小説|しょうせつ}を{読|よ}んだことがありますか。","Czytałeś powieść pt. „Kraina śniegu”?"],
        ["「{積|つ}ん{読|どく}」という{言葉|ことば}の{意味|いみ}を{教|おし}えてください。","Proszę mi wyjaśnić, co znaczy słowo „tsundoku”."]
      ] },
    { title: "～のに – mimo że… (zdziwienie, żal)",
      pattern: "forma prosta + のに · i-przym. + のに · na-przym. / rzecz. + な + のに",
      explain: "～のに znaczy „mimo że, chociaż” – ale z <b>emocją</b>: zdziwieniem, rozczarowaniem, pretensją. Wynik jest inny, niż powinien być.<br><b>Budowa</b>: czasownik i przymiotnik い w formie prostej + のに: {勉強|べんきょう}した<b>のに</b>, {高|たか}い<b>のに</b>. Rzeczownik i przymiotnik な – z <b>な</b>: {元気|げんき}<b>なのに</b>, {日曜日|にちようび}<b>なのに</b>.<br>{一生懸命|いっしょうけんめい}{勉強|べんきょう}した<b>のに</b>、{試験|しけん}に{落|お}ちた = Tak bardzo się uczyłem, a mimo to oblałem (szkoda!).<br>Porównaj z ～ても (lekcja d3-2): ～ても mówi o hipotezie („nawet jeśli”), a ～のに – o <b>fakcie</b>, który już jest („mimo że faktycznie…”).<br>Po のに nie dajesz prośby ani planu – tylko opis tego, co się stało, i swoje uczucia.<br>Typowy błąd: ×{日曜日|にちようび}だのに – ma być なのに.",
      examples: [
        ["{雨|あめ}が{降|ふ}っているのに、{子供|こども}たちはサッカーをしています。","Mimo że pada, dzieci grają w piłkę."],

  title: "Kauzatyw i kauzatyw-bierna (使役)",
  goal: "Po tej lekcji mówisz, że ktoś kogoś zmusza lub komuś pozwala, grzecznie prosisz o pozwolenie (～させてください) i narzekasz, że cię do czegoś zmuszono (～させられる).",
  intro: "Kauzatyw (<b>使役</b>, shieki) to forma ～せる / ～させる. Ma dwa pozornie sprzeczne znaczenia: <b>zmuszać</b> („szef kazał mi zostać po godzinach”) i <b>pozwalać</b> („rodzice pozwolili mi wyjechać”). Który sens jest właściwy, wynika z kontekstu. Kauzatyw jest też podstawą bardzo grzecznych próśb o pozwolenie: 休ませてください – „proszę pozwolić mi odpocząć”. Na koniec połączymy kauzatyw ze stroną bierną: させられる – „zostałem zmuszony”, ulubiona forma narzekania na pracę i szkołę.",

  grammar: [
    { title: "Tworzenie kauzatywu",
      pattern: "G1: -u → -a + せる ・ G2: る → させる ・ する → させる ・ 来る → 来させる",
      explain: "<b>Grupa 1</b>: -u → -a + せる: 書く→書かせる, 待つ→待たせる, 言う→言わせる (う→わ). <b>Grupa 2</b>: る→させる: 食べる→食べさせる, 見る→見させる. <b>Nieregularne</b>: する→させる, 来る→来(こ)させる.<br>Kauzatyw odmienia się jak czasownik grupy 2: 書かせます, 書かせた, 書かせない, 書かせて.<br>Uwaga na wymowę: 待たせる to „kazać czekać”, stąd znane お待たせしました – „przepraszam, że kazałem czekać”.",
      examples: [
        ["{部長|ぶちょう}は{新人|しんじん}に{資料|しりょう}をコピーさせました。","Kierownik kazał nowemu skopiować materiały."],
        ["{母|はは}は{弟|おとうと}に{野菜|やさい}を{食|た}べさせます。","Mama każe bratu jeść warzywa."],
        ["{遅|おそ}くなってすみません。お{待|ま}たせしました。","Przepraszam za spóźnienie. Kazałem państwu czekać."],
        ["{先生|せんせい}は{学生|がくせい}に{作文|さくぶん}を{書|か}かせました。","Nauczyciel kazał uczniom napisać wypracowanie."]
      ] },
    { title: "Zmuszać czy pozwalać? を i に",
      pattern: "[osoba] に [rzecz] を V-させる ・ [osoba] を/に V-nieprzech.-させる",
      explain: "Przy czasownikach <b>przechodnich</b> (z を) osobę wykonującą oznaczasz に: 子どもに本を読ませる. Przy <b>nieprzechodnich</b> (行く, 走る, 休む) możliwe są obie partykuły i niosą różny odcień: <b>を</b> – raczej przymus (息子を塾に行かせた – posłałem syna na korepetycje), <b>に</b> – raczej zgoda na to, czego ta osoba chce (息子に留学させた – pozwoliłem synowi wyjechać).<br>Znaczenie „pozwalać” jest jaśniejsze w połączeniu ～させてあげる / ～させてくれる.<br>Z czasownikami emocji kauzatyw znaczy „wywołać uczucie”: 母を喜ばせる (sprawić mamie radość), 友達を笑わせる (rozśmieszyć), ご心配をおかけして… / 心配させてごめん (przepraszam, że cię zmartwiłem).",
      examples: [
        ["{父|ちち}は{私|わたし}を{毎週|まいしゅう}{塾|じゅく}に{行|い}かせました。","Ojciec co tydzień posyłał mnie na korepetycje."],
        ["{両親|りょうしん}は{私|わたし}に{自由|じゆう}に{進路|しんろ}を{選|えら}ばせてくれました。","Rodzice pozwolili mi swobodnie wybrać drogę życiową."],
        ["{彼|かれ}はいつも{冗談|じょうだん}を{言|い}って、みんなを{笑|わら}わせます。","On ciągle żartuje i rozśmiesza wszystkich."],
        ["{遅|おそ}く{帰|かえ}って、{母|はは}を{心配|しんぱい}させてしまいました。","Wróciłem późno i zmartwiłem mamę."],
        ["{子|こ}どもが{遊|あそ}びたがっていたので、{公園|こうえん}で{遊|あそ}ばせてあげました。","Dziecko chciało się bawić, więc pozwoliłem mu pobawić się w parku."]
      ] },
    { title: "～させてください / ～させてもらえますか – proszę mi pozwolić",
      pattern: "V-させて + ください / もらえますか / いただけませんか",
      explain: "Kauzatyw + ～てください to prośba o <b>pozwolenie dla siebie</b>: 休ませてください = „proszę pozwolić mi odpocząć”. To o wiele grzeczniejsze i bardziej japońskie niż 休みたいです. Stopnie uprzejmości: ～させてください (prośba) < ～させてもらえますか (pytanie) < ～させていただけませんか (bardzo grzecznie, do szefa, klienta).<br>Formułka ～させていただきます („pozwolę sobie…”) to pokorne ogłoszenie, co zaraz zrobisz: 説明させていただきます.<br>Typowy błąd: 休んでください = „proszę (ty) odpocząć” – zupełnie inna prośba!",
      examples: [

    { title: "Kauzatyw-bierna: ～させられる (zostałem zmuszony)",
      pattern: "G1: -u → -a + される (skrót) / せられる ・ G2: させられる ・ する → させられる",
      explain: "Kauzatyw + strona bierna = „<b>ktoś mnie zmusił</b>, choć nie chciałem”. Sprawcę oznaczasz に: 部長に残業させられた. Tworzenie: G2 食べる→食べさせられる, する→させられる, 来る→来させられる. W grupie 1 pełna forma 飲ませられる jest rzadka – używa się skrótu <b>-aされる</b>: 飲む→飲まされる, 待つ→待たされる, 歌う→歌わされる.<br>Wyjątek: czasowniki na -す nie mają skrótu (×話さされる), mówimy 話させられる.<br>Porównaj: 歌わせた (kazałem komuś śpiewać) – 歌わされた (kazano mi śpiewać) – 歌われた (piosenka była śpiewana / ktoś śpiewał, a ja miałem kłopot).",
      examples: [

        ["{歓迎会|かんげいかい}で、みんなの{前|まえ}でポーランド{語|ご}で{話|はな}させられた。","Na przyjęciu powitalnym kazano mi mówić po polsku przed wszystkimi."]

  grammar: [
    { title: "～ば – warunek (i ～ばよかった)",
      pattern: "G1: -u → -e + ば ・ G2: る → れば ・ する → すれば ・ 来る → 来れば ・ い-adj: い → ければ ・ N/な-adj: なら(ば) ・ przeczenie: ～なければ",
      explain: "～ba stawia akcent na <b>warunek</b>: „jeśli (tylko) X, to Y”. Najczęściej w zdaniach ogólnych i hipotetycznych: 安ければ買う (jeśli będzie tanie, kupię). Jeśli pierwsza część opisuje czynność, w drugiej zwykle nie ma prośby ani polecenia (×駅に着けば電話してください – lepiej 着いたら).<br>Ważne zwroty: <b>～ばいい</b> – „wystarczy, że…” / „co mam zrobić?” (どうすればいいですか), oraz <b>～ばよかった</b> – żal: „trzeba było…”. Przeczenie ～なければよかった = „nie trzeba było…”.<br>Uwaga: いい → よければ (nie ×いければ).",
      examples: [
        ["{家賃|やちん}がもう{少|すこ}し{安|やす}ければ、すぐ{契約|けいやく}します。","Gdyby czynsz był trochę niższy, od razu podpisałbym umowę."],
        ["この{書類|しょるい}は、どこに{出|だ}せばいいですか。","Gdzie mam złożyć ten dokument?"],
        ["{急|いそ}げば、{九時|くじ}の{電車|でんしゃ}に{間|ま}に{合|あ}いますよ。","Jeśli się pospieszysz, zdążysz na pociąg o dziewiątej."],
        ["もっと{早|はや}く{申|もう}し{込|こ}めばよかった。","Trzeba było złożyć wniosek wcześniej."],
        ["あんなことを{言|い}わなければよかった。","Nie trzeba było mówić czegoś takiego."]
      ] },
    { title: "～たら – jeśli / kiedy już",
      pattern: "V-た / い-adj-かった / N・な-adj-だった + ら",
      explain: "Najbardziej uniwersalna forma w mowie potocznej. Znaczy „jeśli” albo „kiedy (już) X się stanie, wtedy Y” – kolejność jest jasna: najpierw X, potem Y. Jako jedyna swobodnie łączy się z <b>prośbą, zaproszeniem, wolą</b> w drugiej części: 駅に着いたら電話してください.<br>W czasie przeszłym ～たら opisuje <b>odkrycie</b> lub zaskoczenie: 家に帰ったら、荷物が届いていた („kiedy wróciłem, okazało się, że…”).<br>Gdy nie wiesz, której formy użyć, ～たら rzadko będzie błędem.",
      examples: [
        ["{駅|えき}に{着|つ}いたら、{電話|でんわ}してください。","Jak dojedziesz na stację, zadzwoń."],
        ["{宝|たから}くじが{当|あ}たったら、{何|なに}をしますか。","Co zrobisz, jeśli wygrasz na loterii?"],
        ["{大家|おおや}さんに{聞|き}いたら、ペットは{駄目|だめ}だと{言|い}われました。","Kiedy zapytałem właściciela, powiedział, że zwierząt nie wolno."],
        ["{窓|まど}を{開|あ}けたら、{富士山|ふじさん}が{見|み}えました。","Gdy otworzyłem okno, zobaczyłem górę Fuji."]
      ] },
    { title: "～と – zawsze, gdy… (naturalne następstwo, instrukcje)",
      pattern: "V/adj. forma słownikowa (lub ない) + と",
      explain: "～と opisuje <b>automatyczne, nieuniknione następstwo</b>: prawa natury, działanie maszyn, wskazówki drogowe, nawyki. „Zawsze, gdy X, to Y”: 春になると桜が咲く, このボタンを押すと切符が出ます.<br>Zakaz: po ～と nie może stać <b>wola, prośba, zaproszenie ani polecenie</b> mówiącego: ×春になると旅行しましょう, ×駅に着くと電話してください. W takich zdaniach użyj ～たら.<br>W czasie przeszłym ～と, podobnie jak ～たら, opisuje odkrycie, ale brzmi bardziej literacko: ドアを開けると、猫がいた.",
      examples: [
        ["このボタンを{押|お}すと、{切符|きっぷ}が{出|で}ます。","Gdy naciśniesz ten przycisk, wyjdzie bilet."],

        ["{春|はる}になると、{桜|さくら}が{咲|さ}きます。","Gdy przychodzi wiosna, kwitną wiśnie."],
        ["{私|わたし}はコーヒーを{飲|の}むと、{眠|ねむ}れなくなります。","Gdy wypiję kawę, nie mogę zasnąć."]

    { title: "～なら – jeśli chodzi o… (temat, rada)",
      pattern: "V/adj. forma zwykła / N + なら",
      explain: "～なら nawiązuje do tego, co <b>rozmówca właśnie powiedział</b> lub planuje, i daje do tego radę albo opinię: „Skoro (jeśli) jedziesz do Kioto, to…”. 京都に行くなら、新幹線が便利ですよ.<br>Ważna różnica w kolejności: w ～なら to, co w drugiej części, może nastąpić <b>przed</b> pierwszą: 日本に行くなら、ガイドブックを買ったほうがいい (kup przewodnik przed wyjazdem). 日本に行ったら… znaczyłoby „kiedy już będziesz w Japonii”.<br>Z rzeczownikami: 引っ越しなら、この会社が安いです („jeśli chodzi o przeprowadzkę…”).",
      examples: [
        ["{部屋|へや}を{探|さが}しているなら、{駅前|えきまえ}の{不動産屋|ふどうさんや}がいいですよ。","Jeśli szukasz mieszkania, polecam biuro nieruchomości przed stacją."],
        ["パソコンを{買|か}うなら、{来月|らいげつ}のセールまで{待|ま}ったほうがいいです。","Jeśli chcesz kupić komputer, lepiej poczekaj do wyprzedaży w przyszłym miesiącu."],
        ["A：{田中|たなか}さん、いますか。B：{田中|たなか}さんなら、{会議室|かいぎしつ}にいますよ。","A: Czy jest pan Tanaka? B: Pan Tanaka? Jest w sali konferencyjnej."],
        ["{日本|にほん}で{運転|うんてん}するなら、{国際免許|こくさいめんきょ}が{必要|ひつよう}です。","Jeśli zamierzasz prowadzić w Japonii, potrzebujesz międzynarodowego prawa jazdy."]
      ] },
    { title: "Kiedy który? Krótka ściągawka",
      pattern: "と = zawsze ・ ば = pod warunkiem ・ たら = jeśli/kiedy już ・ なら = skoro tak",

{

  intro: "Keigo (<b>敬語</b>) to system grzeczności, bez którego trudno pracować w Japonii. Ma trzy warstwy:<br><b>丁寧語</b> (teineigo) – forma uprzejma です/ます, którą już znasz;<br><b>尊敬語</b> (sonkeigo) – <b>wywyższanie</b> czynności drugiej osoby (klienta, szefa): „raczył pan przyjść”;<br><b>謙譲語</b> (kenjōgo) – <b>uniżanie</b> własnych czynności (i swojej firmy) wobec rozmówcy.<br>Najważniejsza zasada: <b>nigdy</b> nie używaj 尊敬語 o sobie, a 謙譲語 o kliencie. To najczęstszy błąd uczących się.",
